    <path d="M22 12 q8 8 8 18 q0 -10 8 -18" fill="none" stroke="#FFF" stroke-width="4" stroke-linejoin="round"/>
    <path d="M30 50 v-26" stroke="rgba(0,0,0,.15)" stroke-width="2"/></svg>`;
  return `<svg class="thumb" viewBox="0 0 60 60"><g transform="translate(30,44) scale(1.5)">${shoeSVG(-8,g)}${shoeSVG(8,g)}</g></svg>`;
}
function wearCell(slot, id, mode){
  const g=WEAR[slot][id], has=S.closet.includes(id), on=S.wear[slot]===id;
  const foot = mode==='shop'
    ? (has?'보유 중':`${COIN_SVG}${g.amt.toLocaleString()}전`)
    : (on?'입는 중':'입기');
  return `<button class="cell ${mode==='shop'&&has?'owned':''} ${mode==='closet'&&on?'placed':''}" data-w="${id}">
    <span class="rar" style="background:${RAR_COLOR[g.rar]}">${g.rar}</span>
    ${wearThumb(slot,g)}
    <div class="cname">${g.name}</div>
    <div class="cost">${foot}</div></button>`;
}

/* ── 의전 ───────────────────────────────── */
function openClothes(){
  openSheetRaw('운교장터 · 의전');
  const n=WEAR_SLOTS.reduce((a,[s])=>a+Object.keys(WEAR[s]).length,0);
  sheetBody.innerHTML= resBarHTML() + `
    <div class="packhead">
      <div class="strip" style="background:#7FA9C9"><h2>의전</h2></div>
      <div class="sub">${n}벌 입고 · 옷장에 ${S.closet.length}벌</div>
    </div>
    ${WEAR_SLOTS.map(([s,label])=>`
      <p class="note" style="margin:14px 2px 8px;font-weight:700;color:#5C5346">${label}</p>
      <div class="grid">${Object.keys(WEAR[s]).map(id=>wearCell(s,id,'shop')).join('')}</div>`).join('')}
    <p class="note">산 옷은 학동보따리에 들어갑니다. 입는 것은 학동보따리에서 고르세요.</p>`;
  sheetBody.querySelectorAll('.cell').forEach(c=>c.addEventListener('click',()=>buyWear(c.dataset.w)));
}
function buyWear(id){
  const g=findWear(id);
  if(S.closet.includes(id)) return toast('이미 옷장에 있습니다');
  if(S.coin<g.amt) return toast('전이 모자랍니다');
  S.coin-=g.amt;
  S.closet.push(id); save(); syncHUD(); openClothes();
  toast(`${g.name} — 학동보따리에 넣었습니다`);
}
function equip(id){
  const g=findWear(id);
  if(g.slot==='outer' && S.wear.outer===id) S.wear.outer=null;
  else S.wear[g.slot]=id;
  save(); renderBag();
  toast(S.wear[g.slot]===id ? `${g.name}를 입었습니다` : `${g.name}를 벗었습니다`);
}

/* ── 전 충전(자리만 준비) ───────────────────
   지금은 결제를 만들지 않는다. 나중에 실제 구매를 붙일 자리만
   마련해 둔다. 1전은 국수 한 그릇 값, 유료로는 10전에 1만 원. */
function openTopUp(){
  openSheetRaw('전 충전');
  sheetBody.innerHTML=`
    <div class="hanja-card" style="padding:18px 16px">
      <div class="hint" style="margin-top:0">가진 전 <b>${S.coin.toLocaleString()}</b></div>
      <p class="note" style="margin-top:10px">1전은 국수 한 그릇 값입니다.</p>
    </div>
    <div class="choices">
      <button class="choice" disabled style="opacity:.55;cursor:default">10전 충전 — 10,000원</button>
    </div>
    <p class="note">충전은 아직 준비 중입니다. 서당에서 익히고 정원을 가꾸며 모아 보세요.</p>`;
}

/* ── 보따리 ─────────────────────────────── */
let bagTab='garden';
function openBag(){
  openSheetRaw('보따리');
  renderBag();
}
function renderBag(){
  const ownedIds=Object.keys(S.owned).filter(id=>ownedCount(id)>0);
  const tabs=`<div class="tabs">
    <button data-bag="garden" class="${bagTab==='garden'?'on':''}">정원보따리 ${ownedIds.length}</button>
    <button data-bag="hakdong" class="${bagTab==='hakdong'?'on':''}">학동보따리 ${S.closet.length}</button></div>`;

  if(bagTab==='hakdong'){
    const body = S.closet.length
      ? WEAR_SLOTS.map(([s,label])=>{
          const ids=Object.keys(WEAR[s]).filter(id=>S.closet.includes(id));
          if(!ids.length) return '';
          return `<p class="note" style="margin:14px 2px 8px;font-weight:700;color:#5C5346">${label}</p>
            <div class="grid">${ids.map(id=>wearCell(s,id,'closet')).join('')}</div>`;
        }).join('')
      : `<p class="note">아직 가진 옷이 없습니다. 저잣거리 의전에서 골라보세요.</p>`;
    sheetBody.innerHTML = tabs + body +
      `<p class="note">학동이 입을 것들입니다. 두루마기는 다시 누르면 벗습니다.</p>`;
  } else {
    let body='';
    if(!ownedIds.length){
      body=`<p class="note">아직 가진 물건이 없습니다. 저잣거리 화수전에서 골라보세요.</p>`;
    } else {
      body = SEASON_TABS.map(([k,label])=>{
        const ids=ownedIds.filter(id=>ITEMS[id] && ITEMS[id].season===k);
        if(!ids.length) return '';
        return `<p class="note" style="margin:14px 2px 8px;font-weight:700;color:#5C5346">${label} · ${ids.length}종</p>
          <div class="grid">${ids.map(id=>cellHTML(id,'bag')).join('')}</div>`;
      }).join('') +
      `<button class="subbtn" id="sampleBtn">처음 배치로 되돌리기</button>
       <p class="note">나무 평상과 삿갓 장독만 처음 자리에 다시 놓습니다. 옮겨둔 자리는 지워집니다.</p>`;
    }
    sheetBody.innerHTML = tabs +
      `<p class="note" style="margin:0 2px 4px">${ownedIds.length}종 보유 · ${S.placed.length}개 정원에 놓임</p>` + body;
  }

  sheetBody.querySelectorAll('.tabs button').forEach(b=>
    b.addEventListener('click',()=>{ bagTab=b.dataset.bag; renderBag(); sheetBody.scrollTop=0; }));
  sheetBody.querySelectorAll('.cell[data-w]').forEach(c=>
    c.addEventListener('click',()=>equip(c.dataset.w)));
  sheetBody.querySelectorAll('.cell[data-id]').forEach(c=>{
    c.addEventListener('click',()=>{
      const id=c.dataset.id;
      if(placedCount(id)<ownedCount(id)){
        startPlacing(id);
      } else {
        const insts=placedInstances(id), last=insts[insts.length-1];
        if(!last) return;
        S.placed=S.placed.filter(x=>x!==last); delete S.spot[last];
        save(); renderBag();
        toast(`${ITEMS[id].name}을(를) 거두었습니다`);
      }
    });
  });
  const sb=document.getElementById('sampleBtn');
  if(sb) sb.addEventListener('click',()=>{
    S.spot={...SAMPLE_SPOT};
    S.placed=SAMPLE_PLACED.filter(id=>ownedCount(id)>0);
    Object.assign(S.growth, SAMPLE_GROWTH);
    save(); renderBag(); toast('샘플 배치로 되돌렸습니다');
  });
}

/* ── 재화 얻음 표시 ─────────────────────────
   화면 가운데에 얻은 것이 글자로 잠깐 뜨고, 엽전(또는 물방울)이 몇
   흩어져 나와 위쪽 표시 자리까지 곡선을 그리며 날아간다. 위쪽 숫자는
   그 마지막 하나가 닿는 순간에야 세어 올라간다(coinFlights/growFlights
   가 몇 개나 날아가고 있는지 세어, 그동안은 syncHUD가 숫자를 미리
   바꾸지 않게 막아 둔다). 엽전이 다 날아간 뒤에야 물방울 차례가 와서
   둘이 겹치지 않는다. 눈으로 좇을 수 있게 조금 여유 있게 날아간다.
   움직임을 줄이는 설정에서는 particle 없이 글자만 옅게 보여주고
   숫자도 그 자리에서 곧장 바뀐다(움직임 요소만 뺀다). */
const rewardQueue=[];
let rewardBusy=false;
let coinFlights=0, growFlights=0;
function queueReward(parts){
  if(!parts || (!parts.coin && !parts.grow)) return;
  if(parts.coin) coinFlights++;
  if(parts.grow) growFlights++;
  rewardQueue.push(parts);
  if(!rewardBusy) playNextReward();
}
function playNextReward(){
  const parts=rewardQueue.shift();
  if(!parts){ rewardBusy=false; return; }
  rewardBusy=true;
  runRewardFlight(parts).then(playNextReward);
}
function appPoint(el){
  const appRect=document.getElementById('app').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  return { x:r.left+r.width/2-appRect.left, y:r.top+r.height/2-appRect.top };
}
/* #rewardPop은 뜨고 지며 스스로 옮겨 다니므로(transform으로 가운데 맞춤),
   그 살아있는 자리 대신 원래 자리(left:50%;top:42%)를 그대로 계산해 쓴다. */
function rewardOrigin(){
  const appRect=document.getElementById('app').getBoundingClientRect();
  return { x:appRect.width*0.5, y:appRect.height*0.42 };
}
/* 글자만(움직임 줄이기): 둘을 한 번에 보여주고 곧장 숫자를 바꾼다 */
function reducedMotionReward(parts){
  return new Promise(resolve=>{
    const pop=document.getElementById('rewardPop');
    pop.innerHTML=[
      parts.coin?`<span class="rw-item">${COIN_SVG}+${parts.coin.toLocaleString()}전</span>`:'',
      parts.grow?`<span class="rw-item">${GROW_SVG}+${parts.grow.toLocaleString()}방울</span>`:''
    ].join('');
    pop.getAnimations().forEach(a=>a.cancel());
    pop.animate([{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.8},{opacity:0}],
      {duration:900, easing:'ease', fill:'forwards'});
    setTimeout(()=>{
      if(parts.coin){ coinFlights--; animateNumber(document.getElementById('coinTxt'), S.coin); }
      if(parts.grow){ growFlights--; animateNumber(document.getElementById('growTxt'), S.growWater||0); }
      resolve();
    }, 900);
  });
}
const REWARD_UNIT={coin:'전', grow:'방울'};
const REWARD_TARGET={coin:'coinPlate', grow:'growPlate'};
const REWARD_TXT={coin:'coinTxt', grow:'growTxt'};
/* 가게·서당 화면이 덮개(overlay)로 떠 있을 때는 맨 위 진짜 표시가 그
   덮개에 가려 안 보인다. 그럴 때는 지금 펼쳐진 화면 자기 것(.studyhead
   안의 전·성장수 표시)으로 날아가게 하고, 덮개가 없을 때만(정원에서
   물 줄 때 등) 진짜 위쪽 표시로 날아가게 한다. */
function rewardTargetEl(kind){
  if(overlay.classList.contains('on')){
    const spans=sheetBody.querySelectorAll('.studyhead .coin');
    if(spans.length>=2) return kind==='coin' ? spans[0] : spans[1];
  }
  return document.getElementById(REWARD_TARGET[kind]);
}
/* 엽전(또는 물방울) 한 번의 오고 감: 가운데 글자 → 흩어져 날아감 → 마지막이
   닿으면 위쪽 숫자가 세어 오른다. */
function flightPhase(kind, amount){
  return new Promise(resolve=>{
    const pop=document.getElementById('rewardPop');
    const n = kind==='coin' ? 4 : 3;
    const dur = kind==='coin' ? 600 : 850;
    const stagger = kind==='coin' ? 90 : 120;
    const startDelay = kind==='coin' ? 250 : 200;
    const total = startDelay + (n-1)*stagger + dur;

    pop.innerHTML=`<span class="rw-item">${kind==='coin'?COIN_SVG:GROW_SVG}+${amount.toLocaleString()}${REWARD_UNIT[kind]}</span>`;
    pop.getAnimations().forEach(a=>a.cancel());
    pop.animate([
      {opacity:0, transform:'translate(-50%,-42%)', offset:0},
      {opacity:1, transform:'translate(-50%,-50%)', offset:Math.min(.3, 120/total)},
      {opacity:1, transform:'translate(-50%,-50%)', offset:Math.max(.6, 1-180/total)},
      {opacity:0, transform:'translate(-50%,-62%)', offset:1}
    ], {duration:total, easing:'ease', fill:'forwards'});

    const fx=document.getElementById('rewardFX');
    const origin=rewardOrigin();
    const target=appPoint(rewardTargetEl(kind));
    const dx=target.x-origin.x, dy=target.y-origin.y;
    let lastDone;
    for(let i=0;i<n;i++){
      const el=document.createElement('div');
      el.className='fx-particle';
      el.style.left=origin.x+'px'; el.style.top=origin.y+'px';
      el.innerHTML = kind==='coin' ? COIN_SVG : GROW_SVG;
      fx.appendChild(el);
      const side = i%2===0 ? 1 : -1;
      const keyframes = kind==='coin' ? [
        { transform:'translate(0,0) scale(1)', opacity:1, offset:0 },
        { transform:`translate(${dx*.5+side*18}px, ${dy*.5-30}px) scale(.7)`, opacity:1, offset:.55 },
        { transform:`translate(${dx}px, ${dy}px) scale(.3)`, opacity:.85, offset:1 }
      ] : [
        { transform:'translate(0,4px) scale(1)', opacity:1, offset:0 },
        { transform:`translate(${dx*.35+side*10}px, ${dy*.4+10}px) scale(.85)`, opacity:1, offset:.4 },
        { transform:`translate(${dx*.75+side*4}px, ${dy*.75-8}px) scale(.55)`, opacity:.95, offset:.75 },
        { transform:`translate(${dx}px, ${dy}px) scale(.3)`, opacity:.85, offset:1 }
      ];
      const anim=el.animate(keyframes, {
        duration:dur, delay:startDelay+i*stagger,
        easing: kind==='coin' ? 'ease-in' : 'ease-in-out', fill:'forwards'
      });
      const done=anim.finished.then(()=>el.remove()).catch(()=>el.remove());
      if(i===n-1) lastDone=done;
    }
    // 탭이 뒤로 밀려 애니메이션이 멈추더라도(예: 다른 창으로 전환) 숫자가
    // 영영 안 바뀌는 일이 없도록, 다 날아갈 시간이 지나면 그냥 넘어간다.
    lastDone=Promise.race([lastDone, new Promise(res=>setTimeout(res, total+250))]);
    lastDone.then(()=>{
      if(kind==='coin') coinFlights--; else growFlights--;
      animateNumber(document.getElementById(REWARD_TXT[kind]), kind==='coin'?S.coin:(S.growWater||0));
      resolve();
    });
  });
}
async function runRewardFlight(parts){
  if(prefersReducedMotion()) return reducedMotionReward(parts);
  if(parts.coin) await flightPhase('coin', parts.coin);
  if(parts.grow) await flightPhase('grow', parts.grow);
}

/* 위쪽 숫자를 한 번에 바꾸지 않고 짧게 세어 올라가듯(또는 내려가듯)
   바꾸고, 그 자리를 잠깐 밝혔다 되돌린다. */
function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function animateNumber(el, to){
  const from=parseInt((el.textContent||'0').replace(/,/g,''),10) || 0;
  if(from===to) return;
  const plate=el.closest('.plate');
  if(plate){ plate.classList.remove('flash'); void plate.offsetWidth; plate.classList.add('flash'); }
  if(prefersReducedMotion()){ el.textContent=to.toLocaleString(); return; }
  const dur=500, start=performance.now();
  // 탭이 뒤로 밀려 화면이 안 그려지는 동안은 requestAnimationFrame이 멈추므로,
  // 그래도 값은 맞게 끝나도록 타이머로 최종값을 한 번 더 못박아 둔다.
  setTimeout(()=>{ el.textContent=to.toLocaleString(); }, dur);
  (function tick(now){
    const t=Math.min(1, (now-start)/dur);
    const eased=1-Math.pow(1-t,3);
    el.textContent=Math.round(from+(to-from)*eased).toLocaleString();
    if(t<1) requestAnimationFrame(tick); else el.textContent=to.toLocaleString();
  })(start);
}

/* ── 공용 ───────────────────────────────── */
function syncHUD(){
  // 엽전·물방울이 화면을 날아가는 중이면, 닿을 때까지는 위쪽 숫자를 미리 바꾸지 않는다
  if(coinFlights<=0) animateNumber(document.getElementById('coinTxt'), S.coin);
  if(growFlights<=0) animateNumber(document.getElementById('growTxt'), S.growWater||0);
  const rk = rankInfo(curRankIdx());
  const gt = document.getElementById('gradeTxt');
  gt.textContent = rk.name; gt.style.background = rk.color;
  document.getElementById('navDot').style.display=(P.gu<GUJEOL.length||dueChars(P).length)?'block':'none';
}
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1800);
}
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; } }

syncHUD();
drawScene();
</script>
