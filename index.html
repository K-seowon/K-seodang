<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>K-서당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3D3A36; --hanji:#FBF3E4; --hanji-2:#F2E4CB;
  --maehwa:#F0A8BE; --maehwa-d:#D9718F;
  --leaf:#6E9A50; --wood:#B08F6A; --wood-d:#7A5F45;
  --coin:#E8A33C; --gem:#7FA9C9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2B2620}
body{font-family:'Gaegu',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;background:#FDF3E9;overflow:hidden}

#hud{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;gap:6px;align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
.plate{background:var(--hanji);border:2.5px solid var(--ink);border-radius:14px;padding:4px 10px;
  display:flex;align-items:center;gap:6px;font-size:17px;line-height:1.1;box-shadow:0 2px 0 rgba(61,58,54,.25)}
.plate .num{font-weight:700;font-size:19px}
#who{flex-direction:column;align-items:flex-start;gap:1px;padding:5px 12px}
#who .name{font-weight:700;font-size:18px}
#who .rank{font-size:15px;color:#7A6E5E}
.bar{width:86px;height:8px;background:var(--hanji-2);border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;background:var(--maehwa);width:0%}
.pip{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);flex:0 0 auto}
.pip.coin{background:var(--coin)} .pip.gem{background:var(--gem)}

#stage{flex:1;position:relative;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.tapzone{cursor:pointer}
#placeBar{position:absolute;left:0;right:0;bottom:0;z-index:25;display:none;
  background:var(--hanji);border-top:3px solid var(--ink);padding:8px 12px;
  font-size:17px;align-items:center;gap:10px}
#placeBar.on{display:flex}
#placeBar button{margin-left:auto;border:2.5px solid var(--ink);border-radius:12px;background:var(--hanji-2);
  font-family:inherit;font-size:17px;padding:5px 14px;cursor:pointer}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.badge-bob{animation:bob 1.6s ease-in-out infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}10%{opacity:.9}100%{transform:translate(var(--dx),660px) rotate(340deg);opacity:0}}
.petal{opacity:0;animation:fall linear infinite}
@media (prefers-reduced-motion:reduce){.petal,.badge-bob{animation:none}}

#nav{position:relative;z-index:20;display:flex;background:var(--hanji);
  border-top:3px solid var(--ink);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
#nav button{flex:1;background:none;border:0;padding:4px 0 2px;font-family:inherit;font-size:16px;
  color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  border-radius:10px;position:relative;opacity:.55}
#nav button.here{opacity:1;font-weight:700}
#nav button:focus-visible{outline:3px solid var(--maehwa-d);outline-offset:-2px}
#nav button svg{width:26px;height:26px}
#nav button .dot{position:absolute;top:2px;right:calc(50% - 18px);width:9px;height:9px;
  border-radius:50%;background:#D9463F;border:2px solid var(--hanji)}

#overlay{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;background:var(--hanji)}
#overlay.on{display:flex}
.sheet-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  border-bottom:3px solid var(--ink);background:var(--hanji-2)}
.sheet-top h1{margin:0;font-size:22px;font-weight:700;flex:1}
.iconbtn{width:38px;height:38px;flex:0 0 auto;border:2.5px solid var(--ink);border-radius:12px;
  background:var(--hanji);font-family:inherit;font-size:20px;cursor:pointer;line-height:1}
.sheet-body{flex:1;overflow-y:auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 20px)}

.hanja-card{background:var(--hanji-2);border:3px solid var(--ink);border-radius:18px;padding:20px 16px;text-align:center}
.gu{font-size:20px;color:#8A7D6B;letter-spacing:.12em}
.hanja{font-size:92px;line-height:1.05;font-weight:700}
.hunum{font-size:26px;margin-top:6px}
.hint{font-size:17px;color:#7A6E5E;margin-top:4px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji);padding:12px;
  font-family:inherit;font-size:20px;cursor:pointer;text-align:left}
.choice.right{background:#CFE7BE} .choice.wrong{background:#F3CFCF}
.bigbtn{width:100%;margin-top:16px;padding:14px;border:3px solid var(--ink);border-radius:16px;
  background:var(--maehwa);font-family:inherit;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.note{font-size:17px;color:#7A6E5E;margin:10px 2px 0;line-height:1.5}

.packhead{border:3px solid var(--ink);border-radius:16px;overflow:hidden;margin-bottom:14px}
.packhead .strip{padding:10px 14px;background:var(--maehwa);border-bottom:3px solid var(--ink)}
.packhead h2{margin:0;font-size:22px;font-weight:700}
.packhead .sub{padding:8px 14px;font-size:17px;background:var(--hanji-2);color:#6B6154}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji-2);padding:6px;
  cursor:pointer;position:relative;font-family:inherit;text-align:center}
.cell .thumb{width:100%;aspect-ratio:1;display:block;background:#FBF0E6;border-radius:9px}
.cell .cname{font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cost{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.cell .cost i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.cell.owned{opacity:.55}
.cell.placed{background:#DCEAC8}
.rar{position:absolute;top:3px;right:3px;min-width:22px;height:22px;border-radius:50%;
  border:2.5px solid var(--ink);color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 3px}
.tag{position:absolute;top:3px;left:3px;background:var(--leaf);color:#fff;border:2.5px solid var(--ink);
  border-radius:9px;font-size:13px;padding:0 5px;height:20px;display:flex;align-items:center}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);z-index:50;
  background:var(--ink);color:var(--hanji);padding:9px 18px;border-radius:20px;font-size:18px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="plate" id="who">
      <span class="name">푸믹</span>
      <span class="rank" id="rankTxt"></span>
      <span class="bar"><i id="progBar"></i></span>
    </div>
    <div class="plate"><span class="pip coin"></span><span class="num" id="coinTxt">0</span></div>
    <div class="plate"><span class="pip gem"></span><span class="num" id="gemTxt">0</span></div>
  </div>

  <div id="stage">
    <svg id="scene" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice" aria-label="공간"></svg>
    <div id="placeBar"><span id="placeMsg"></span><button id="placeCancel">그만두기</button></div>
  </div>

  <nav id="nav">
    <button data-go="seodang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8 12 3l10 5"/><path d="M4 8v12h16V8"/><path d="M9 20v-6h6v6"/></svg>
      서당<span class="dot" id="navDot"></span>
    </button>
    <button data-go="market">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-2-5H5Z"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg>
      저잣거리
    </button>
    <button data-go="garden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c5-3 7-6 7-10a7 7 0 1 0-14 0c0 4 2 7 7 10Z"/><circle cx="12" cy="10" r="3"/></svg>
      나의 정원
    </button>
    <button data-go="bag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l1 12H4Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
      보따리
    </button>
    <button data-go="neighbors">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15c3 0 5 2 5 5"/></svg>
      이웃
    </button>
  </nav>

  <div id="overlay" role="dialog" aria-modal="true">
    <div class="sheet-top">
      <button class="iconbtn" id="closeSheet" aria-label="닫기">←</button>
      <h1 id="sheetTitle"></h1>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* =========================================================
   K-서당 v0.7   (v0.6에서 이어짐)
   추가·수정
     · 길이 문을 지나 담장 밖으로 이어짐 (서당·저잣거리 지붕이 멀리 보임)
     · 산 물건은 보따리로 먼저 → 보따리에서 정원에 놓기 / 거두기
     · 서당·저잣거리도 공간(장면). 안에서 배너·전을 골라 들어감
     · 천자문 1000자 전체 수록 / 명심보감은 이름만
   ========================================================= */

const SAVE_KEY = 'kseodang_v07';

/* ── 천자문 1000자 ────────────────────────
   토큰 = 한자 + 훈 + 음   (예: 天하늘천)
   ---------------------------------------- */
const CJ_RAW = [

"日날일 月달월 盈찰영 昃기울측 辰별진 宿잘숙 列벌릴렬 張베풀장",
"寒찰한 來올래 暑더울서 往갈왕 秋가을추 收거둘수 冬겨울동 藏감출장",
"閏윤달윤 餘남을여 成이룰성 歲해세 律법칙률 呂음률려 調고를조 陽볕양",

"劍칼검 號이름호 巨클거 闕대궐궐 珠구슬주 稱일컬을칭 夜밤야 光빛광",
"果실과과 珍보배진 李오얏리 柰벚내 菜나물채 重무거울중 芥겨자개 薑생강강",
"海바다해 鹹짤함 河물하 淡맑을담 鱗비늘린 潛잠길잠 羽깃우 翔날상",

    + `<rect id="floor" x="0" y="330" width="400" height="270" fill="transparent" class="tapzone"/>`;

const scene = document.getElementById('scene');
const FLOOR = { garden:[340,588,24,376], seodang:[470,586,24,376], market:[470,586,24,376] };
let where = 'garden';
let walking = false;
let placingId = null;

function drawScene(){
  if (where==='garden') drawGarden();
  else if (where==='seodang') drawSeodang();
  else drawMarket();
  bindScene();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('here', b.dataset.go===where));
}
function goScene(name){
  where=name; placingId=null;
  document.getElementById('placeBar').classList.remove('on');
  overlay.classList.remove('on');
  drawScene();
}
function bindScene(){
  scene.querySelectorAll('[data-act]').forEach(g=>{
    g.addEventListener('click', e=>{
      e.stopPropagation();
      if (walking || placingId) return;
      const ax=+g.dataset.ax, ay=+g.dataset.ay, act=g.dataset.act;
      walkTo(ax, ay, ()=> setTimeout(()=>doAct(act), 180));
    });
  });
  const floor = scene.querySelector('#floor');
  floor.addEventListener('click', e=>{
    const p = svgPoint(e);
    const [y0,y1,x0,x1] = FLOOR[where];
    if (placingId){ dropItem(clamp(p.x,x0,x1), clamp(p.y,y0,y1)); return; }
    if (walking) return;
    walkTo(clamp(p.x,x0,x1), clamp(p.y,y0,y1));
  });
}
function doAct(act){
  if (act==='go-seodang') return goScene('seodang');
  if (act==='go-market')  return goScene('market');
  if (act==='go-garden')  return goScene('garden');
  if (act==='study-cheonja')   return openStudy('cheonja');
  if (act==='study-myeongsim') return toast('명심보감은 곧 문을 엽니다');
  if (act==='shop-flower') return openShop();
  if (act==='shop-stone' || act==='shop-goods') return toast('아직 전을 열지 않았습니다');
}
function walkTo(x,y,done){
  const g=document.getElementById('hakdong'); if(!g){ done&&done(); return; }
  const p=S.pos[where], sx=p.x, sy=p.y;
  const dx=x-sx, dist=Math.hypot(dx,y-sy);
  if (dist<3){ done&&done(); return; }
  const dur=Math.max(240, dist*9), flip=dx<0?-1:1, legs=document.getElementById('hakLegs');
  walking=true;
  const t0=performance.now();
  const tick=(t)=>{
    const k=Math.min(1,(t-t0)/dur);
    g.setAttribute('transform',`translate(${sx+(x-sx)*k},${sy+(y-sy)*k}) scale(${flip},1)`);
    if(legs) legs.setAttribute('transform',`translate(0,${Math.abs(Math.sin((t-t0)/90))*-2.2})`);
    if(k<1) requestAnimationFrame(tick);
    else { if(legs) legs.setAttribute('transform',''); walking=false; S.pos[where]={x,y}; save(); done&&done(); }
  };
  requestAnimationFrame(tick);
}
function svgPoint(e){
  const pt=scene.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(scene.getScreenCTM().inverse());
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ── 배치 모드 ──────────────────────────── */
function startPlacing(id){
  const it = ITEMS[id];
  overlay.classList.remove('on');
  where='garden'; drawScene();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('here', b.dataset.go==='garden'));
  if (it.fixed){
    if(!S.placed.includes(id)) S.placed.push(id);
    save(); drawScene(); toast(`${it.name}을(를) 놓았습니다`); return;
  }
  placingId = id;
  document.getElementById('placeMsg').textContent = `${it.name} — 놓을 자리를 누르세요`;
  document.getElementById('placeBar').classList.add('on');
}
function dropItem(x,y){
  const id=placingId; if(!id) return;
  S.spot[id]=[Math.round(x),Math.round(y)];
  if(!S.placed.includes(id)) S.placed.push(id);
  placingId=null; document.getElementById('placeBar').classList.remove('on');
  save(); drawScene(); toast(`${ITEMS[id].name}을(를) 놓았습니다`);
}
document.getElementById('placeCancel').addEventListener('click', ()=>{
  placingId=null; document.getElementById('placeBar').classList.remove('on');
});

/* ── 덮개 화면 ──────────────────────────── */
const overlay=document.getElementById('overlay');
const sheetTitle=document.getElementById('sheetTitle');
const sheetBody=document.getElementById('sheetBody');
function openSheetRaw(title){ sheetTitle.textContent=title; overlay.classList.add('on'); }
function closeSheet(){ overlay.classList.remove('on'); drawScene(); }
document.getElementById('closeSheet').addEventListener('click', closeSheet);

document.querySelectorAll('#nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    const g=b.dataset.go;
    if(g==='bag') return openBag();
    if(g==='neighbors'){
      openSheetRaw('이웃');
      sheetBody.innerHTML=`<p class="note">아직 이웃이 없습니다. 정원이 어느 정도 꾸며지면 이웃의 정원을 구경하러 갈 수 있습니다.</p>`;
      return;
    }
    goScene(g);
  });
});

/* ── 학습 ───────────────────────────────── */
let book='cheonja';
function openStudy(b){ book=b; openSheetRaw(BOOKS[b].name); renderStudy(); }
function renderStudy(){
  if(S.todayLeft<=0){
    sheetBody.innerHTML=`<div class="hanja-card"><div class="hunum">오늘 몫은 다 익혔습니다.</div>
      <div class="hint">내일 다시 오세요.</div></div>
      <p class="note">진도는 엽전으로도 잎새로도 앞당길 수 없습니다. 익힌 만큼만 나아갑니다.</p>`;
    return;
  }
  const i=S.learned % CHEONJA.length, q=CHEONJA[i];
  const line=Math.floor(i/8), gu=CJ_RAW[line].split(' ').map(t=>t[0]);
  const guTxt=gu.slice(0,4).join('')+'   '+gu.slice(4).join('');
  const pool=CHEONJA.filter((_,k)=>k!==i).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[q,...pool].sort(()=>Math.random()-.5);
  sheetBody.innerHTML=`
    <div class="hanja-card">
      <div class="gu">${guTxt}</div>
      <div class="hanja">${q.c}</div>
      <div class="hunum">${q.hun} ${q.um}</div>
      <div class="hint">${i+1}번째 글자 · 오늘 ${S.todayLeft}자 남음</div>
    </div>
    <p class="note">뜻과 소리를 눈에 익힌 뒤 아래에서 골라보세요.</p>
    <div class="choices">${opts.map(o=>`<button class="choice" data-c="${o.c}">${o.hun} ${o.um}</button>`).join('')}</div>`;
  sheetBody.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const ok=btn.dataset.c===q.c;
      sheetBody.querySelectorAll('.choice').forEach(b=>{
        b.disabled=true; if(b.dataset.c===q.c) b.classList.add('right');
      });
      if(!ok) btn.classList.add('wrong');
      if(ok){ S.learned++; S.todayLeft--; S.coin+=120; save(); syncHUD(); }
      sheetBody.insertAdjacentHTML('beforeend',
        `<button class="bigbtn" id="nextBtn">${ok?'엽전 120냥 받고 이어하기':'다시 익히기'}</button>`);
      document.getElementById('nextBtn').addEventListener('click', renderStudy);
    });
  });
}

/* ── 상점 ───────────────────────────────── */
function openShop(){
  openSheetRaw('꽃전');
  const ids=Object.keys(ITEMS);
  sheetBody.innerHTML=`
    <div class="packhead">
      <div class="strip"><h2>매화 피는 서당 뒤뜰</h2></div>
      <div class="sub">봄 · ${ids.length}종 입고 · 보따리에 ${S.owned.length}종</div>
    </div>
    <div class="grid">${ids.map(id=>cellHTML(id,'shop')).join('')}</div>
    <p class="note">산 물건은 보따리에 들어갑니다. 정원에 놓는 것은 보따리에서 고르세요.</p>`;
  sheetBody.querySelectorAll('.cell').forEach(c=>c.addEventListener('click',()=>buy(c.dataset.id)));
}
function cellHTML(id,mode){
  const it=ITEMS[id], has=S.owned.includes(id), on=S.placed.includes(id);
  const [w,h]=it.box, m=Math.max(w,h);
  const foot = mode==='shop'
    ? (has ? '보유 중' : `<i style="background:${it.cur==='coin'?'#E8A33C':'#7FA9C9'}"></i>${it.amt}`)
    : (on ? '거두기' : '정원에 놓기');
  return `<button class="cell ${mode==='shop'&&has?'owned':''} ${mode==='bag'&&on?'placed':''}" data-id="${id}">
    <span class="rar" style="background:${RAR_COLOR[it.rar]}">${it.rar}</span>
    ${mode==='bag'&&on?'<span class="tag">놓임</span>':''}
    <svg class="thumb" viewBox="${(w-m)/2} ${(h-m)/2} ${m} ${m}">${it.svg}</svg>
    <div class="cname">${it.name}</div>
    <div class="cost">${foot}</div></button>`;
}
function buy(id){
  const it=ITEMS[id];
  if(S.owned.includes(id)) return toast('이미 보따리에 있습니다');
  const bag=it.cur==='coin'?S.coin:S.gem;
  if(bag<it.amt) return toast(it.cur==='coin'?'엽전이 모자랍니다':'잎새가 모자랍니다');
  if(it.cur==='coin') S.coin-=it.amt; else S.gem-=it.amt;
  S.owned.push(id); save(); syncHUD(); openShop();
  toast(`${it.name} — 보따리에 넣었습니다`);
}

/* ── 보따리 ─────────────────────────────── */
function openBag(){
  openSheetRaw('보따리');
  if(!S.owned.length){
    sheetBody.innerHTML=`<p class="note">아직 가진 물건이 없습니다. 저잣거리 꽃전에서 하나 골라보세요.</p>`; return;
  }
  sheetBody.innerHTML=`<p class="note" style="margin:0 2px 12px">${S.owned.length}종 보유 · ${S.placed.length}종 정원에 놓임</p>
    <div class="grid">${S.owned.map(id=>cellHTML(id,'bag')).join('')}</div>`;
  sheetBody.querySelectorAll('.cell').forEach(c=>{
    c.addEventListener('click',()=>{
      const id=c.dataset.id;
      if(S.placed.includes(id)){
        S.placed=S.placed.filter(x=>x!==id); save(); openBag();
        toast(`${ITEMS[id].name}을(를) 거두었습니다`);
      } else startPlacing(id);
    });
  });
}

/* ── 공용 ───────────────────────────────── */
function syncHUD(){
  document.getElementById('coinTxt').textContent=S.coin.toLocaleString();
  document.getElementById('gemTxt').textContent=S.gem.toLocaleString();
  document.getElementById('rankTxt').textContent=`천자문 ${S.learned}자 익힘`;
  document.getElementById('progBar').style.width=Math.min(100,(S.learned/1000)*100)+'%';
  document.getElementById('navDot').style.display=S.todayLeft>0?'block':'none';
}
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1800);
}
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; } }

syncHUD();
drawScene();
</script>
