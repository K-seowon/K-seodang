<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-서당 시제품</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E2; --paper-deep:#EAD9B8;
    --ink:#2E3A2C; --ink-soft:#6B7A63;
    --leaf:#7DA757; --leaf-deep:#4E7A3F;
    --dancheong:#C4392C; --gold:#E8B44A; --sky:#BFE3EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#CFE0C4;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
  #app{width:390px;max-width:100%;min-height:100vh;background:var(--paper);display:flex;flex-direction:column}

  header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 8px}
  header h1{font-family:"Gaegu",cursive;font-size:30px;line-height:1;color:var(--ink);
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,.10)}
  header h1 small{font-family:"Noto Sans KR";font-size:11px;color:var(--ink-soft);margin-left:6px;text-shadow:none}
  .points{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:5px 13px;
    font-family:"Gaegu",cursive;font-size:20px;line-height:1;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
  .points span.n{color:var(--dancheong)}
  .points span.u{font-family:"Noto Sans KR";font-size:11px;color:var(--ink-soft);margin-left:3px}

  main{flex:1;padding:6px 16px 92px;overflow:auto}
  .screen{display:none}.screen.active{display:block}

  nav{position:fixed;bottom:0;width:390px;max-width:100%;display:flex;background:#3E4A38;border-top:4px solid var(--gold)}
  nav button{flex:1;padding:12px 0 15px;background:none;border:0;color:#B9C6AE;font-family:"Gaegu",cursive;font-size:19px;cursor:pointer}
  nav button.active{color:#fff}
  nav button.active::before{content:"";display:block;width:26px;height:3px;background:var(--gold);margin:0 auto 4px;border-radius:2px}

  /* ---- 장면 ---- */
  .place{position:relative;height:300px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;touch-action:none;
    box-shadow:3px 3px 0 rgba(0,0,0,.15)}
  .place .scene{position:absolute;inset:0;width:100%;height:100%}
  .placed{position:absolute;font-size:42px;line-height:1;cursor:grab;user-select:none;touch-action:none;
    transform:translate(-50%,-90%);filter:drop-shadow(1px 2px 1px rgba(0,0,0,.25))}
  .placed.selected{filter:drop-shadow(0 0 5px var(--dancheong))}
  .hotspot{position:absolute;cursor:pointer;transform:translate(-50%,-100%)}
  .hotspot .cap{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);white-space:nowrap;
    font-family:"Gaegu",cursive;font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 8px;line-height:1.5}
  .avatar{position:absolute;width:52px;transform:translate(-50%,-100%);transition:left .6s linear,top .6s linear;pointer-events:none;
    filter:drop-shadow(1px 2px 2px rgba(0,0,0,.25))}
  .avatar.flip{transform:translate(-50%,-100%) scaleX(-1)}
  .avatar.walking{animation:bob .45s infinite}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:-3px}}
  @media (prefers-reduced-motion: reduce){.avatar{transition:none}.avatar.walking{animation:none}}
  .bubble{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);
    border-radius:14px;padding:3px 12px;font-family:"Gaegu",cursive;font-size:16px;pointer-events:none}
  .tip{font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:center}

  /* ---- 학습 ---- */
  .progress{font-size:12px;color:var(--ink-soft);margin:12px 0 10px;text-align:center}
  .gu-line{font-family:"Nanum Myeongjo",serif;font-size:21px;letter-spacing:9px;text-align:center;margin:4px 0 2px}
  .gu-line b{color:var(--dancheong)}
  .gu-line .done{color:var(--leaf-deep)}
  .gu-meaning{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:20px;text-align:center;box-shadow:3px 3px 0 rgba(0,0,0,.15)}
  .hanja{font-family:"Nanum Myeongjo",serif;font-size:104px;line-height:1}
  .reading{font-family:"Gaegu",cursive;font-size:28px;margin-top:8px}
  .reading em{font-style:normal;color:var(--dancheong)}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:6px}
  .btn{display:block;width:100%;margin-top:12px;padding:13px;border:3px solid var(--ink);border-radius:12px;
    background:var(--gold);color:var(--ink);font-family:"Gaegu",cursive;font-size:20px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.15)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.15)}
  .btn.ghost{background:#fff}
  .btn:disabled{background:#D6D2C6;color:#8B8B80;cursor:default;box-shadow:none;transform:none}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .choices button{padding:14px 8px;background:#fff;border:3px solid var(--ink);border-radius:12px;
    font-family:"Gaegu",cursive;font-size:21px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.12)}
  .choices button.right{background:var(--leaf)}
  .choices button.wrong{background:#F0C8C3}
  .feedback{text-align:center;margin-top:12px;font-family:"Gaegu",cursive;font-size:20px;min-height:26px}
  .feedback.good{color:var(--leaf-deep)}
  .feedback.bad{color:var(--dancheong)}

  /* ---- 저잣거리 좌판 ---- */
  .stall-name{font-family:"Gaegu",cursive;font-size:22px;text-align:center;margin:12px 0 4px}
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .shop-item{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px 6px 10px;text-align:center;box-shadow:3px 3px 0 rgba(0,0,0,.12)}
  .shop-item .icon{font-size:40px;line-height:1}
  .shop-item .name{font-family:"Gaegu",cursive;font-size:19px;margin-top:4px}
  .shop-item .price{font-family:"Gaegu",cursive;font-size:18px;color:var(--dancheong)}
  .shop-item button{margin-top:6px;width:100%;padding:6px;border:2px solid var(--ink);border-radius:9px;background:var(--gold);
    font-family:"Gaegu",cursive;font-size:16px;cursor:pointer}
  .shop-item button:disabled{background:#D6D2C6;color:#8B8B80}
  .shop-item .own{font-size:11px;color:var(--leaf-deep);min-height:14px;margin-top:2px}

  .inv-title{font-family:"Gaegu",cursive;font-size:20px;margin:12px 0 6px}
  .inv{display:flex;gap:8px;flex-wrap:wrap;min-height:52px}
  .inv button{width:56px;height:56px;background:#fff;border:3px solid var(--ink);border-radius:12px;font-size:28px;position:relative;cursor:pointer}
  .inv button i{position:absolute;right:2px;bottom:0;font-style:normal;font-family:"Gaegu",cursive;font-size:15px;color:var(--dancheong)}

  footer{padding:0 20px 8px;font-size:11px;color:var(--ink-soft)}
  footer button{background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:11px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>K-서당<small>시제품 0.4</small></h1>
    <div class="points"><span class="n" id="pt">0</span><span class="u">엽전</span></div>
  </header>

  <main>
    <section id="garden" class="screen active"></section>
    <section id="seodang" class="screen"></section>
    <section id="market" class="screen"></section>
  </main>

  <footer>저장은 이 기기에만 됩니다. <button id="reset">처음부터 다시</button></footer>

  <nav>
    <button data-tab="garden" class="active">나의 정원</button>
    <button data-tab="seodang">서당</button>
    <button data-tab="market">저잣거리</button>
  </nav>
</div>

<script>
/* ===================== 1. 마스터 데이터 ===================== */
const CHEONJAMUN = [
  { gu:"天地玄黃", meaning:"하늘은 검고 땅은 누렇다",
    chars:[{h:"天",hun:"하늘",eum:"천"},{h:"地",hun:"땅",eum:"지"},{h:"玄",hun:"검을",eum:"현"},{h:"黃",hun:"누를",eum:"황"}]},
  { gu:"宇宙洪荒", meaning:"우주는 넓고 거칠다",
    chars:[{h:"宇",hun:"집",eum:"우"},{h:"宙",hun:"집",eum:"주"},{h:"洪",hun:"넓을",eum:"홍"},{h:"荒",hun:"거칠",eum:"황"}]},
  { gu:"日月盈昃", meaning:"해와 달은 차고 기운다",
    chars:[{h:"日",hun:"날",eum:"일"},{h:"月",hun:"달",eum:"월"},{h:"盈",hun:"찰",eum:"영"},{h:"昃",hun:"기울",eum:"측"}]},
  { gu:"辰宿列張", meaning:"별자리는 벌여 있다",
    chars:[{h:"辰",hun:"별",eum:"진"},{h:"宿",hun:"잘",eum:"숙"},{h:"列",hun:"벌릴",eum:"렬"},{h:"張",hun:"베풀",eum:"장"}]},
];
const ALL_CHARS = CHEONJAMUN.flatMap(g=>g.chars);
const REWARD_CHAR = 10, REWARD_GU = 30;

/* 아이템 마스터 — stall로 좌판이 갈린다 */
const STALLS = [ {id:"kkot", name:"꽃전"}, {id:"seok", name:"석물전"}, {id:"mul", name:"물목전"} ];
const ITEMS = [
  {id:"flower",  name:"들꽃",   icon:"🌼", price:20,  stall:"kkot"},
  {id:"pine",    name:"소나무", icon:"🌲", price:50,  stall:"kkot"},
  {id:"bamboo",  name:"대나무", icon:"🎋", price:40,  stall:"kkot"},
  {id:"rock",    name:"괴석",   icon:"🪨", price:30,  stall:"seok"},
  {id:"lantern", name:"석등",   icon:"🏮", price:60,  stall:"seok"},
  {id:"pavilion",name:"정자",   icon:"⛩️", price:150, stall:"seok"},
  {id:"pond",    name:"연못",   icon:"🪷", price:80,  stall:"mul"},
  {id:"jar",     name:"장독",   icon:"🏺", price:35,  stall:"mul"},
  {id:"well",    name:"우물",   icon:"🪣", price:70,  stall:"mul"},
];

/* ===================== 2. 그림 조각 ===================== */
const SKIN="#F6DCC0", HAIR="#2B2118", CHEEK="#F0A0A0";

/* 학동 — 머리 크고 볼 붉은 그림책풍 */
function avatarSVG(seated){
  const jeogori="#F2F0E6", goreum="#C4392C", baji="#4A6FA5";
  const face = `
    <circle cx="26" cy="20" r="16" fill="${SKIN}"/>
    <path d="M10 19 a16 16 0 0 1 32 0 q-6 -9 -16 -9 t-16 9z" fill="${HAIR}"/>
    <path d="M11 19 q-2 8 1 12 q-4 -5 -1 -12z" fill="${HAIR}"/>
    <path d="M41 19 q2 8 -1 12 q4 -5 1 -12z" fill="${HAIR}"/>
    <path d="M26 6 q0 -5 0 -5" stroke="${HAIR}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="26" cy="4" r="3.4" fill="${HAIR}"/>
    <ellipse cx="17" cy="26" rx="3.4" ry="2.4" fill="${CHEEK}" opacity=".75"/>
    <ellipse cx="35" cy="26" rx="3.4" ry="2.4" fill="${CHEEK}" opacity=".75"/>
    <path d="M16.5 22 q3 -3.4 6 0" stroke="${HAIR}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M29.5 22 q3 -3.4 6 0" stroke="${HAIR}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M22 29 q4 4 8 0 q-4 1.5 -8 0z" fill="#B4544C"/>`;
  if(seated){
    return `<svg viewBox="0 0 52 62" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="26" cy="59" rx="19" ry="3.5" fill="#000" opacity=".12"/>
      <path d="M7 58 q19 -9 38 0 z" fill="${baji}" stroke="${HAIR}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M10 58 q16 -22 32 0 z" fill="${jeogori}" stroke="${HAIR}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M26 40 l-5 15 h4 z" fill="${goreum}"/>
      ${face}
    </svg>`;
  }
  return `<svg viewBox="0 0 52 74" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="26" cy="71" rx="15" ry="3" fill="#000" opacity=".12"/>
    <rect x="17" y="58" width="7" height="12" rx="3" fill="${baji}" stroke="${HAIR}" stroke-width="1.4"/>
    <rect x="28" y="58" width="7" height="12" rx="3" fill="${baji}" stroke="${HAIR}" stroke-width="1.4"/>
    <path d="M12 60 q14 5 28 0 l-3 -14 q-11 -4 -22 0 z" fill="${baji}" stroke="${HAIR}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M11 47 q15 5 30 0 l-3 -11 q-12 -5 -24 0 z" fill="${jeogori}" stroke="${HAIR}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M26 36 l-4 12 4 1 3 -1 z" fill="${goreum}"/>
    ${face}
  </svg>`;
}

/* 하늘 + 먼 산 — 모든 장면 공통 배경 */
function skyLayer(){
  return `
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDE8F0"/><stop offset="1" stop-color="#EAF3E2"/></linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA9A6"/><stop offset="1" stop-color="#A8BEA6"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9455"/><stop offset="1" stop-color="#8FB06A"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9C77E"/><stop offset="1" stop-color="#7EA65C"/></linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7A87A"/><stop offset="1" stop-color="#A98A5E"/></linearGradient>
  </defs>
  <rect width="390" height="300" fill="url(#sky)"/>
  <circle cx="330" cy="42" r="70" fill="#fff" opacity=".35"/>
  <path d="M-10 118 L60 58 L110 96 L160 52 L230 118 Z" fill="url(#far)"/>
  <path d="M150 122 L235 62 L300 104 L340 76 L400 122 Z" fill="url(#far)" opacity=".85"/>
  <path d="M-10 132 L48 92 L104 132 Z" fill="url(#near)"/>
  <path d="M250 134 L318 88 L400 134 Z" fill="url(#near)"/>`;
}
/* 기와집 한 채 */
function hanok(x,y,s,label){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-6 0 h92 v34 h-92 z" fill="#F0E4CB" stroke="#7A6547" stroke-width="2"/>
    <path d="M-22 2 L40 -26 L102 2 L92 8 L40 -16 L-12 8 Z" fill="#4A555B" stroke="#333C41" stroke-width="2" stroke-linejoin="round"/>
    <rect x="4" y="10" width="28" height="20" fill="#D8B98A" stroke="#7A6547" stroke-width="1.6"/>
    <rect x="48" y="10" width="28" height="20" fill="#D8B98A" stroke="#7A6547" stroke-width="1.6"/>
    <path d="M4 20 h28 M18 10 v20 M48 20 h28 M62 10 v20" stroke="#7A6547" stroke-width="1.2"/>
    ${label?`<rect x="22" y="-14" width="36" height="12" rx="2" fill="#C4392C"/><text x="40" y="-4.5" font-size="9" fill="#FBF3E2" text-anchor="middle" font-family="serif">${label}</text>`:""}
  </g>`;
}
/* 싸리 울타리 — 뒤쪽 가로줄 (gap 구간은 비워 사립문 자리) */
function fenceBack(y, gapA, gapB){
  let posts="", rails="";
  for(let x=-14; x<=404; x+=24){
    if(x>gapA-12 && x<gapB+12) continue;
    posts += `<rect x="${x}" y="${y-26}" width="6" height="34" rx="2" fill="#B08A5A" stroke="#7A5C36" stroke-width="1.6"/>`;
  }
  const seg=(a,b)=>`<path d="M${a} ${y-18} H${b} M${a} ${y-6} H${b}" stroke="#C9A470" stroke-width="5" stroke-linecap="round"/>
                    <path d="M${a} ${y-18} H${b} M${a} ${y-6} H${b}" stroke="#7A5C36" stroke-width="1.4"/>`;
  rails = seg(-14, gapA) + seg(gapB, 404);
  return rails + posts;
}
/* 옆쪽 울타리 — 원근으로 기울어 내려옴. dir: -1 왼쪽, 1 오른쪽 */
function fenceSide(dir){
  const x0 = dir<0 ? -6 : 396, x1 = dir<0 ? 46 : 344;
  const y0 = 300, y1 = 150;
  let g="";
  for(let t=0; t<=1.001; t+=0.2){
    const x = x0+(x1-x0)*t, y = y0+(y1-y0)*t, h = 46-24*t;
    g += `<rect x="${x-3}" y="${y-h}" width="${6-2*t}" height="${h}" rx="2" fill="#B08A5A" stroke="#7A5C36" stroke-width="1.4"/>`;
  }
  return `<path d="M${x0} ${y0-32} L${x1} ${y1-20}" stroke="#C9A470" stroke-width="5" stroke-linecap="round"/>
          <path d="M${x0} ${y0-14} L${x1} ${y1-8}" stroke="#C9A470" stroke-width="5" stroke-linecap="round"/>` + g;
}
/* 초가집 — 나의 집 */
function chogajip(x,y,s){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <rect x="0" y="0" width="86" height="38" fill="#F0E4CB" stroke="#7A6547" stroke-width="2"/>
    <path d="M-16 2 q43 -32 118 0 q-59 -14 -118 0z" fill="#D8B87E" stroke="#A98A5E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-8 0 q51 -26 102 0" fill="none" stroke="#C0A06C" stroke-width="2"/>
    <rect x="10" y="12" width="26" height="22" fill="#D8B98A" stroke="#7A6547" stroke-width="1.6"/>
    <rect x="52" y="12" width="26" height="22" fill="#D8B98A" stroke="#7A6547" stroke-width="1.6"/>
    <path d="M10 23 h26 M23 12 v22 M52 23 h26 M65 12 v22" stroke="#7A6547" stroke-width="1.1"/>
    <rect x="0" y="38" width="86" height="6" fill="#B9A98C" stroke="#7A6547" stroke-width="1.4"/>
  </g>`;
}
/* 좌판 (저잣거리) */
function stall(x,y,color){
  return `<g transform="translate(${x},${y})">
    <path d="M-4 0 h68 v6 h-68 z" fill="#8A6E4B" stroke="#5C4830" stroke-width="1.6"/>
    <rect x="4" y="6" width="6" height="22" fill="#8A6E4B"/><rect x="50" y="6" width="6" height="22" fill="#8A6E4B"/>
    <path d="M-10 0 q30 -22 80 0 z" fill="${color}" stroke="#5C4830" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M-10 0 q30 -22 80 0" fill="none" stroke="#fff" stroke-width="1" opacity=".4"/>
  </g>`;
}

/* ===================== 3. 상태 ===================== */
const KEY="k-seodang-v4";
let mem=null;
function load(){
  try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return mem || { points:0, learned:[], passedGu:[], inventory:{}, garden:[], nextUid:1,
    pos:{garden:{x:32,y:84}, seodang:{x:20,y:88}, market:{x:16,y:86}}, flip:false };
}
function save(){ mem=state; try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let state=load();
let selectedUid=null, quiz=null, atDesk=false, openStall="kkot";

/* ===================== 4. 화면 전환 ===================== */
function goTab(name){
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active", x.dataset.tab===name));
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===name));
  render();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
document.getElementById("reset").onclick=()=>{
  if(confirm("모든 진도와 정원을 지울까요?")){ try{localStorage.removeItem(KEY)}catch(e){}
    mem=null; quiz=null; atDesk=false; state=load(); goTab("garden"); }
};
function render(){
  document.getElementById("pt").textContent = state.points;
  renderGarden(); renderSeodang(); renderMarket();
}
function walkTo(node, place, x, y, done){
  const p=state.pos[place];
  node.classList.toggle("flip", x<p.x);
  node.classList.add("walking");
  p.x=x; p.y=y; node.style.left=x+"%"; node.style.top=y+"%"; save();
  clearTimeout(node._t);
  node._t=setTimeout(()=>{ node.classList.remove("walking"); if(done) done(); }, 620);
}
/* 장면 클릭 → 걷기 (공통) */
function bindWalk(scene, node, place, minY){
  scene.onclick=(e)=>{
    if(e.target.closest(".placed")||e.target.closest(".hotspot")) return;
    const r=scene.getBoundingClientRect();
    const x=Math.max(7, Math.min(93, (e.clientX-r.left)/r.width*100));
    const y=Math.max(minY, Math.min(95, (e.clientY-r.top)/r.height*100));
    state.flip = x<state.pos[place].x;
    walkTo(node, place, x, y);
  };
}

/* ===================== 5. 나의 정원 ===================== */
function renderGarden(){
  const el=document.getElementById("garden");
  const inv=ITEMS.filter(it=>(state.inventory[it.id]||0)>0);
  const p=state.pos.garden;
  el.innerHTML=`
    <div class="place" id="plot">
      <svg class="scene" viewBox="0 0 390 300" preserveAspectRatio="xMidYMid slice">
        ${skyLayer()}
        <path d="M0 128 h390 v172 h-390 z" fill="url(#ground)"/>
        ${hanok(292,86,.42,"書堂")}
        ${chogajip(24,104,.62)}
        ${fenceBack(150, 296, 352)}
        ${fenceSide(-1)}${fenceSide(1)}
        <path d="M150 300 q40 -80 168 -152" stroke="#C7A87A" stroke-width="16" fill="none" opacity=".65" stroke-linecap="round"/>
        <ellipse cx="195" cy="240" rx="160" ry="52" fill="#B8D191" opacity=".35"/>
        <path d="M20 200 q90 -10 180 4 M40 262 q120 -12 250 2" stroke="#6F9450" stroke-width="2" fill="none" opacity=".45"/>
      </svg>
      ${state.garden.length?"":`<div class="bubble">땅을 눌러 걸어 보세요</div>`}
      <div class="hotspot" id="gate" style="left:83%;top:54%">
        <svg width="74" viewBox="0 0 74 62"><path d="M4 20 h66 l-7 -9 h-52 z" fill="#8A6E4B" stroke="#5C4830" stroke-width="2" stroke-linejoin="round"/>
          <rect x="6" y="20" width="7" height="40" fill="#6E5638" stroke="#5C4830" stroke-width="1.6"/>
          <rect x="61" y="20" width="7" height="40" fill="#6E5638" stroke="#5C4830" stroke-width="1.6"/>
          <rect x="14" y="26" width="47" height="34" fill="#D8B98A" stroke="#8A6E4B" stroke-width="1.6"/>
          <path d="M14 26 v34 M37 26 v34 M61 26 v34" stroke="#8A6E4B" stroke-width="1.4"/></svg>
        <div class="cap">서당 가는 길</div>
      </div>
      ${state.garden.map(x=>{const it=ITEMS.find(i=>i.id===x.itemId);
        return `<div class="placed ${x.uid===selectedUid?"selected":""}" data-uid="${x.uid}" style="left:${x.x}%;top:${x.y}%">${it.icon}</div>`;}).join("")}
      <div class="avatar ${state.flip?"flip":""}" id="me" style="left:${p.x}%;top:${p.y}%">${avatarSVG(false)}</div>
    </div>
    <div class="tip">울타리 안이 나의 정원입니다. 아이템은 끌어서 옮기고, 사립문으로 서당에 갑니다</div>
    <div class="inv-title">보관함 ${inv.length?"":"— 비었어요. 저잣거리에 다녀오세요"}</div>
    <div class="inv">${inv.map(it=>`<button data-id="${it.id}" title="${it.name}">${it.icon}<i>${state.inventory[it.id]}</i></button>`).join("")}</div>
    <button class="btn ghost" id="remove" ${selectedUid?"":"disabled"}>선택한 것 치우기</button>`;

  const plot=el.querySelector("#plot"), me=el.querySelector("#me");
  bindWalk(plot, me, "garden", 56);
  el.querySelector("#gate").onclick=()=>walkTo(me,"garden",83,58,()=>{ state.pos.garden={x:32,y:84}; save(); goTab("seodang"); });
  el.querySelectorAll(".inv button").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    state.inventory[id]--; if(state.inventory[id]<=0) delete state.inventory[id];
    state.garden.push({uid:state.nextUid++, itemId:id, x:24+Math.random()*46, y:64+Math.random()*28});
    selectedUid=state.nextUid-1; save(); renderGarden();
  });
  el.querySelector("#remove").onclick=()=>{
    const i=state.garden.findIndex(x=>x.uid===selectedUid); if(i<0) return;
    const id=state.garden[i].itemId; state.garden.splice(i,1);
    state.inventory[id]=(state.inventory[id]||0)+1; selectedUid=null; save(); renderGarden();
  };
  el.querySelectorAll(".placed").forEach(node=>{
    node.onpointerdown=(e)=>{
      e.stopPropagation();
      const uid=+node.dataset.uid; selectedUid=uid;
      el.querySelectorAll(".placed").forEach(n=>n.classList.toggle("selected", n===node));
      el.querySelector("#remove").disabled=false;
      node.setPointerCapture(e.pointerId);
      const it=state.garden.find(x=>x.uid===uid), r=plot.getBoundingClientRect();
      node.onpointermove=(ev)=>{
        it.x=Math.max(5,Math.min(95,(ev.clientX-r.left)/r.width*100));
        it.y=Math.max(56,Math.min(97,(ev.clientY-r.top)/r.height*100));
        node.style.left=it.x+"%"; node.style.top=it.y+"%";
      };
      node.onpointerup=()=>{ node.onpointermove=null; save(); };
    };
  });
}

/* ===================== 6. 서당 ===================== */
function currentTarget(){
  for(let gi=0; gi<CHEONJAMUN.length; gi++){
    const g=CHEONJAMUN[gi];
    for(const c of g.chars) if(!state.learned.includes(c.h)) return {type:"char", gi, c};
    if(!state.passedGu.includes(gi)) return {type:"gu", gi};
  }
  return {type:"done"};
}
function shuffle(a){ return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]); }
function guLine(gi, blank){
  const g=CHEONJAMUN[gi];
  return `<div class="gu-line">${g.chars.map(c=>blank&&c.h===blank.h?"<b>▢</b>":
    `<span class="${state.learned.includes(c.h)?"done":""}">${c.h}</span>`).join("")}</div>
    <div class="gu-meaning">${g.meaning}</div>`;
}
function renderSeodang(){ const el=document.getElementById("seodang"); atDesk?renderDesk(el):renderYard(el); }

function renderYard(el){
  const p=state.pos.seodang;
  el.innerHTML=`
    <div class="place" id="yard">
      <svg class="scene" viewBox="0 0 390 300" preserveAspectRatio="xMidYMid slice">
        ${skyLayer()}
        <path d="M0 128 h390 v172 h-390 z" fill="url(#ground)"/>
        <ellipse cx="195" cy="250" rx="150" ry="46" fill="url(#dirt)" opacity=".8"/>
        ${hanok(112,84,1.05,"書堂")}
        <path d="M40 300 q30 -60 70 -78" stroke="#C7A87A" stroke-width="10" fill="none" opacity=".6"/>
      </svg>
      <div class="hotspot" id="door" style="left:50%;top:56%">
        <svg width="46" viewBox="0 0 46 40"><rect x="2" y="2" width="42" height="36" rx="3" fill="#8A6E4B" stroke="#5C4830" stroke-width="2"/>
          <path d="M23 2 v36" stroke="#5C4830" stroke-width="2"/></svg>
        <div class="cap">글방</div>
      </div>
      <div class="hotspot" id="home" style="left:12%;top:88%">
        <svg width="60" viewBox="0 0 74 62"><path d="M4 20 h66 l-7 -9 h-52 z" fill="#8A6E4B" stroke="#5C4830" stroke-width="2" stroke-linejoin="round"/>
          <rect x="6" y="20" width="7" height="40" fill="#6E5638"/><rect x="61" y="20" width="7" height="40" fill="#6E5638"/>
          <rect x="14" y="26" width="47" height="34" fill="#D8B98A" stroke="#8A6E4B" stroke-width="1.6"/></svg>
        <div class="cap">정원으로</div>
      </div>
      <div class="avatar ${state.flip?"flip":""}" id="me2" style="left:${p.x}%;top:${p.y}%">${avatarSVG(false)}</div>
    </div>
    <div class="progress">익힌 글자 ${state.learned.length} / ${ALL_CHARS.length} · 통과한 구 ${state.passedGu.length} / ${CHEONJAMUN.length}</div>
    <button class="btn" id="enter">글방에 들어가기</button>`;
  const yard=el.querySelector("#yard"), me=el.querySelector("#me2");
  bindWalk(yard, me, "seodang", 60);
  const enter=()=>walkTo(me,"seodang",50,62,()=>{ atDesk=true; renderSeodang(); });
  el.querySelector("#door").onclick=enter;
  el.querySelector("#enter").onclick=enter;
  el.querySelector("#home").onclick=()=>walkTo(me,"seodang",12,90,()=>{ state.pos.seodang={x:20,y:88}; save(); goTab("garden"); });
}

function renderDesk(el){
  const t=currentTarget();
  const seat=`<div class="place" style="height:150px">
      <svg class="scene" viewBox="0 0 390 150" preserveAspectRatio="xMidYMid slice">
        <rect width="390" height="150" fill="#EFE2C6"/>
        <path d="M0 0 h390 v40 h-390z" fill="#D9C39B"/>
        <path d="M0 40 h390" stroke="#B49A6E" stroke-width="3"/>
        <rect x="30" y="52" width="120" height="70" fill="#D8B98A" opacity=".5" stroke="#B49A6E" stroke-width="2"/>
        <rect x="240" y="52" width="120" height="70" fill="#D8B98A" opacity=".5" stroke="#B49A6E" stroke-width="2"/>
        <rect x="150" y="118" width="90" height="14" rx="3" fill="#8A6E4B" stroke="#5C4830" stroke-width="2"/>
        <rect x="168" y="106" width="30" height="12" fill="#FBF3E2" stroke="#8A6E4B" stroke-width="1.5"/>
      </svg>
      <div class="avatar" style="left:50%;top:96%;width:58px">${avatarSVG(true)}</div>
    </div>`;
  const prog=`<div class="progress">익힌 글자 ${state.learned.length} / ${ALL_CHARS.length} · 통과한 구 ${state.passedGu.length} / ${CHEONJAMUN.length}</div>`;
  const out=`<button class="btn ghost" id="leave">마당으로 나가기</button>`;

  if(t.type==="done"){
    el.innerHTML=seat+prog+`<div class="card"><div class="hanja" style="font-size:60px">畢</div>
      <div class="reading">네 구를 모두 마쳤어요</div><div class="hint">정원으로 돌아가 꾸며 보세요</div></div>`+out;
  } else if(quiz&&quiz.type==="char"){
    el.innerHTML=seat+prog+guLine(quiz.gi)+`<div class="card"><div class="hanja">${quiz.c.h}</div>
      <div class="hint">이 글자의 훈과 음은?</div></div>
      <div class="choices">${quiz.options.map(o=>`<button data-ans="${o}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`+out;
    el.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>answerChar(b));
  } else if(quiz&&quiz.type==="gu"){
    el.innerHTML=seat+prog+`<div class="card"><div class="hint" style="margin-bottom:8px">빈 자리에 들어갈 글자는?</div>
      ${guLine(quiz.gi, quiz.blank)}</div>
      <div class="choices">${quiz.options.map(o=>`<button data-ans="${o}">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`+out;
    el.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>answerGu(b));
  } else if(t.type==="char"){
    const c=t.c;
    el.innerHTML=seat+prog+guLine(t.gi)+`<div class="card"><div class="hanja">${c.h}</div>
      <div class="reading">${c.hun} <em>${c.eum}</em></div>
      <div class="hint">외우면 시험을 보고 엽전 ${REWARD_CHAR}냥을 받아요</div></div>
      <button class="btn" id="go">외웠어요, 시험 볼게요</button>`+out;
    el.querySelector("#go").onclick=()=>{
      const right=`${c.hun} ${c.eum}`;
      const pool=ALL_CHARS.filter(x=>x.h!==c.h).map(x=>`${x.hun} ${x.eum}`);
      quiz={type:"char", gi:t.gi, c, right, options:shuffle([right, ...shuffle(pool).slice(0,3)])};
      renderSeodang();
    };
  } else {
    el.innerHTML=seat+prog+guLine(t.gi)+`<div class="card"><div class="reading">네 글자를 다 익혔어요</div>
      <div class="hint">구 시험을 통과하면 엽전 ${REWARD_GU}냥</div></div>
      <button class="btn" id="go">구 시험 보기</button>`+out;
    el.querySelector("#go").onclick=()=>{
      const g=CHEONJAMUN[t.gi], blank=g.chars[Math.floor(Math.random()*4)];
      const pool=ALL_CHARS.filter(x=>x.h!==blank.h).map(x=>x.h);
      quiz={type:"gu", gi:t.gi, blank, options:shuffle([blank.h, ...shuffle(pool).slice(0,3)])};
      renderSeodang();
    };
  }
  const lv=el.querySelector("#leave");
  if(lv) lv.onclick=()=>{ atDesk=false; quiz=null; state.pos.seodang={x:50,y:80}; save(); renderSeodang(); };
}
function answerChar(btn){
  const fb=document.getElementById("fb");
  if(btn.dataset.ans===quiz.right){
    btn.classList.add("right"); fb.className="feedback good"; fb.textContent=`잘했어요! 엽전 ${REWARD_CHAR}냥`;
    state.learned.push(quiz.c.h); state.points+=REWARD_CHAR; save();
    document.getElementById("pt").textContent=state.points;
    setTimeout(()=>{ quiz=null; renderSeodang(); renderMarket(); }, 900);
  } else { btn.classList.add("wrong"); btn.disabled=true; fb.className="feedback bad"; fb.textContent="다시 골라 보세요"; }
}
function answerGu(btn){
  const fb=document.getElementById("fb");
  if(btn.dataset.ans===quiz.blank.h){
    btn.classList.add("right"); fb.className="feedback good"; fb.textContent=`통과! 엽전 ${REWARD_GU}냥`;
    state.passedGu.push(quiz.gi); state.points+=REWARD_GU; save();
    document.getElementById("pt").textContent=state.points;
    setTimeout(()=>{ quiz=null; renderSeodang(); renderMarket(); }, 900);
  } else { btn.classList.add("wrong"); btn.disabled=true; fb.className="feedback bad"; fb.textContent="다시 골라 보세요"; }
}

/* ===================== 7. 저잣거리 ===================== */
function renderMarket(){
  const el=document.getElementById("market");
  const p=state.pos.market;
  const list=ITEMS.filter(it=>it.stall===openStall);
  const stallName=STALLS.find(s=>s.id===openStall).name;
  el.innerHTML=`
    <div class="place" id="street">
      <svg class="scene" viewBox="0 0 390 300" preserveAspectRatio="xMidYMid slice">
        ${skyLayer()}
        <path d="M0 128 h390 v172 h-390 z" fill="url(#ground)"/>
        <path d="M-20 300 L120 140 h150 L410 300 z" fill="url(#dirt)"/>
        ${hanok(-10,92,.5,"")}${hanok(300,92,.5,"")}
        <path d="M120 150 h150 M100 190 h190 M70 240 h250" stroke="#B08F62" stroke-width="1.5" opacity=".5"/>
        ${stall(58,168,"#C4392C")}${stall(162,168,"#4E7A3F")}${stall(266,168,"#3E6B8C")}
        <circle cx="92" cy="160" r="7" fill="#E8B44A"/><circle cx="196" cy="160" r="7" fill="#E8B44A"/><circle cx="300" cy="160" r="7" fill="#E8B44A"/>
      </svg>
      ${STALLS.map((s,i)=>`<div class="hotspot" data-stall="${s.id}" style="left:${[23,50,77][i]}%;top:${56}%">
        <svg width="52" viewBox="0 0 52 30"><rect width="52" height="30" fill="transparent"/></svg>
        <div class="cap">${s.name}</div></div>`).join("")}
      <div class="hotspot" id="home3" style="left:11%;top:92%">
        <svg width="58" viewBox="0 0 74 62"><path d="M4 20 h66 l-7 -9 h-52 z" fill="#8A6E4B" stroke="#5C4830" stroke-width="2" stroke-linejoin="round"/>
          <rect x="6" y="20" width="7" height="40" fill="#6E5638"/><rect x="61" y="20" width="7" height="40" fill="#6E5638"/>
          <rect x="14" y="26" width="47" height="34" fill="#D8B98A" stroke="#8A6E4B" stroke-width="1.6"/></svg>
        <div class="cap">정원으로</div>
      </div>
      <div class="avatar ${state.flip?"flip":""}" id="me3" style="left:${p.x}%;top:${p.y}%">${avatarSVG(false)}</div>
    </div>
    <div class="tip">좌판을 누르면 학동이 그 앞으로 갑니다</div>
    <div class="stall-name">${stallName}</div>
    <div class="shop-grid">${list.map(it=>{
      const own=(state.inventory[it.id]||0)+state.garden.filter(g=>g.itemId===it.id).length;
      return `<div class="shop-item"><div class="icon">${it.icon}</div><div class="name">${it.name}</div>
        <div class="price">${it.price}냥</div>
        <button data-id="${it.id}" ${state.points<it.price?"disabled":""}>사기</button>
        <div class="own">${own?`정원에 ${own}`:""}</div></div>`;}).join("")}</div>`;

  const street=el.querySelector("#street"), me=el.querySelector("#me3");
  bindWalk(street, me, "market", 62);
  el.querySelectorAll("[data-stall]").forEach((h,i)=>h.onclick=()=>{
    openStall=h.dataset.stall;
    walkTo(me,"market",[23,50,77][i],72,()=>renderMarket());
  });
  el.querySelector("#home3").onclick=()=>walkTo(me,"market",11,92,()=>{ state.pos.market={x:16,y:86}; save(); goTab("garden"); });
  el.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{
    const it=ITEMS.find(x=>x.id===b.dataset.id);
    if(state.points<it.price) return;
    state.points-=it.price; state.inventory[it.id]=(state.inventory[it.id]||0)+1; save(); render();
  });
}

render();
</script>
</body>
</html>
