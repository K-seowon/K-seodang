    `"승상은 일찍 세상을 떠나시고 아들 셋은 다 벼슬길로 떠나 곁에 말벗이 없다. 네 신세를 생각하니 양반의 후예로 저렇듯 궁곤하니 어찌 아니 불쌍하랴. 내 수양딸이 되면 글과 바느질을 가르쳐 친딸같이 길러 말년의 재미를 보려 하는데, 네 뜻이 어떠하냐."`,
    `심청이 일어나 절하고 여쭈었다.`,
    `"부인께서 천한 줄을 헤아리지 않고 딸을 삼으려 하시니 황송하고 감격합니다. 그러나 제가 아버지 곁을 떠나면 아침저녁 공양과 사철 옷을 누가 이어 가겠습니까. 제 아버지가 아니시면 이제까지 살지 못하였을 것이요, 제가 없으면 아버지가 남은 해를 마치실 길이 없습니다. 서로 의지하여 이 몸이 다하도록 모시려 합니다."`,
    `말을 마치니 눈물이 얼굴을 적셨다. 부인도 가엾이 여겨 등을 어루만졌다.`,
    `"효녀로다, 네 말이여. 늙은 내 말이 미처 생각지 못하였다."`
  ],
  6: [
    `그날 심봉사는 홀로 앉아 딸을 기다렸다. 배는 고프고 방은 차며 새는 날아들고 먼 절의 쇠북 소리가 들리니, 날이 저문 줄을 짐작하고 혼잣말을 하였다.`,
    `"내 딸 심청이는 무슨 일에 골몰하여 날 저문 줄을 모르는고."`,
    `지팡이를 짚고 사립 밖에 나섰다가, 길 너머 개천에 밀치는 듯 떨어지고 말았다. 얼굴은 흙빛이 되고 옷은 젖었는데, 나오려 하면 미끄러지고 허우적거릴수록 더 빠져 아무리 소리를 질러도 건져 줄 사람이 없었다.`,
    `마침 그때 몽운사 화주승이 시주를 얻으러 내려오다가 바람결에 사람 구하라는 소리를 들었다. 급히 달려와 장삼과 짚신을 벗어 놓고 뛰어들어 심봉사를 건져 냈다.`,
    `방 안에 앉히고 빠진 까닭을 물으니, 심봉사가 신세를 한탄하며 앞뒤 사정을 다 말하였다. 중이 듣고 말하였다.`,
    `"딱하십니다. 우리 절 부처님은 영검이 많으시어 빌어 안 되는 일이 없습니다. 공양미 삼백 석을 부처님께 올리고 지성으로 불공하면 정녕 눈을 떠서 천지만물을 보시리다."`,
    `심봉사가 제 형편은 생각지 않고 눈 뜬다는 말에 혹하여`,
    `"그러면 삼백 석을 적어 가시오."`,
    `화주승이 웃으며 "댁의 가세를 보니 무슨 수로 삼백 석을 하겠소" 하니, 심봉사가 홧김에 말하였다.`,
    `"어느 쇠아들놈이 부처님께 적어 놓고 빈말을 하겠소. 염려 말고 적으시오."`,
    `중이 권선문을 펼쳐 '심학규 백미 삼백 석'이라 적고 하직하였다. 그가 간 뒤에 심봉사가 다시 생각하니, 쌀 삼백 석을 마련할 길이 없어 복을 빌려다 도리어 죄를 얻게 되었다. 이 설움 저 설움이 한꺼번에 일어나 울음이 터졌다.`
  ],
  7: [
    `심청이 돌아와 아버지의 모습을 보고 깜짝 놀라 온몸을 만지며 물었다. 사연을 듣고 나서 도리어 아버지를 위로하였다.`,
    `"아버지, 걱정 마시고 진지나 잡수십시오. 후회하시면 정성이 못 됩니다. 공양미 삼백 석은 아무쪼록 마련하여 몽운사로 올리겠습니다."`,
    `그날부터 심청은 목욕재계하고 뒤뜰에 단을 모아, 밤이면 정화수 한 그릇을 떠 놓고 빌었다.`,
    `"아비의 허물을 제 몸으로 대신하옵고, 아비의 눈을 밝혀 주옵소서."`,
    `그러던 어느 날, 남경 뱃사람들이 열다섯 살 처녀를 사려 한다는 말을 들었다. 까닭을 물으니 이러하였다.`,
    `"우리는 남경으로 다니는 장사꾼인데, 인당수를 지날 때 처녀를 제물로 바치면 무사히 건너고 큰 이익을 얻습니다. 몸을 팔려는 처녀가 있으면 값을 아끼지 않겠습니다."`,
    `심청이 반겨 듣고 말하였다.`,
    `"제 아버지가 눈이 어두우신데, 공양미 삼백 석을 불공하면 눈을 뜨신다 합니다. 집이 가난하여 마련할 길이 없으니 제 몸을 팔겠습니다."`,
    `뱃사람들이 그 효성을 가긍히 여겨 허락하고, 곧 쌀 삼백 석을 몽운사로 실어 보냈다. 떠나는 날은 삼월 십오일로 정하였다.`,
    `심청이 아버지께는 차마 바로 말하지 못하고, 장승상댁 수양딸로 팔렸다고 둘러대었다. 심봉사가 영문도 모르고 반겨 들으며 "그 일 매우 잘되었다" 하니, 심청의 가슴이 더욱 미어졌다.`,
    `그날부터 심청은 아버지의 사철 옷을 지어 농에 넣고, 갓끈을 접어 달아 벽에 걸고, 망건을 꾸며 두었다. 떠날 날을 손꼽아 세어 보니 하루가 남았을 뿐이었다.`
  ],
  8: [
    `이튿날 새벽, 심청이 눈물로 밥을 지어 아버지 앞에 올렸다. 아무쪼록 많이 잡수시게 하려고 자반을 떼어 입에 넣고 김쌈을 싸서 수저에 놓았다. 심봉사는 철도 모르고 말하였다.`,
    `"오늘은 반찬이 매우 좋구나. 뉘 집 제사를 지냈느냐."`,
    `그러더니 문득 덧붙였다.`,
    `"간밤에 꿈을 꾸니 네가 큰 수레를 타고 한없이 가 보이더구나. 수레라 하는 것은 귀한 사람이 타는 것이니, 우리 집에 좋은 일이 있을까 보다."`,
    `심청은 제가 죽을 꿈인 줄 짐작하면서도 "그 꿈 좋습니다" 하고 거짓으로 대답하였다. 상을 물린 뒤 사당에 하직하고 나와, 아버지의 두 손을 붙들고 기색하였다.`,
    `"아버지, 제가 아버지를 속였습니다. 공양미 삼백 석을 누가 저를 주겠습니까. 남경 뱃사람들에게 인당수 제물로 몸을 팔아, 오늘이 떠나는 날입니다."`,
    `심봉사가 이 말을 듣고 땅을 치며 통곡하였다.`,
    `"못 간다, 못 간다. 네가 살고 내가 눈을 뜨면 모르거니와, 자식 죽여 눈을 뜬들 그것이 차마 할 일이냐. 눈을 팔아 너를 살 수 있다면 모를까, 너를 팔아 눈을 뜬들 무엇을 보겠느냐."`,
    `그러나 이미 어찌할 수 없었다. 동네 사람들이 심봉사를 붙들고, 심청은 울며 뱃사람들을 따라갔다. 한 걸음에 돌아보고 두 걸음에 눈물지으며 강가에 이르러 배에 올랐다.`,
    `배는 여러 날을 물 위로 나아갔다. 마침내 인당수에 이르니 광풍이 크게 일어 바다가 뒤집히고 벼락이 치는 듯하였다. 도사공이 겁을 내어 고사를 지내고 북을 둥둥 치며 외쳤다.`,
    `"심청은 때가 급하니 어서 물에 들라."`,
    `심청이 두 손을 모아 하늘에 빌었다.`,
    `"제가 죽는 일은 조금도 섧지 않으나, 눈 어두운 아비의 깊은 한을 생전에 풀어 주옵소서."`,
    `그러고는 뱃전에 나서 치마폭을 뒤집어쓰고 물러섰다가,`,
    `"아이고 아버지, 저는 죽습니다."`,
    `한마디를 남기고 거꾸로 풍덩 빠졌다. 그러자 풍랑이 곧 가라앉고 안개가 걷히며 날이 밝아 왔다.`
  ],
  9: [
    `심청이 물에 잠겨 죽은 줄로만 알았더니, 오색 구름이 영롱하고 옥피리 소리가 은은히 들려왔다. 이는 옥황상제가 사해용왕에게 명을 내린 까닭이었다.`,
    `"내일 출천효녀 심청이 그곳을 지날 것이니, 몸에 물 한 점 묻지 않게 하라. 수정궁으로 모셔 들여 삼 년을 공궤한 뒤 세상으로 돌려보내라."`,
    `용왕과 수궁의 온갖 벼슬아치들이 황급히 나와 기다리다가, 심청이 물로 뛰어들자 선녀들이 받들어 백옥 가마에 올렸다. 심청이 사양하니 선녀들이 말하였다.`,
    `"상제의 분부가 지엄하시니 타지 않으시면 우리 용왕이 죄를 면치 못합니다."`,
    `풍악 속에 수정궁으로 드니 별천지가 따로 없었다. 사해용왕이 시녀를 보내어 아침저녁으로 문안하고 삼 일에 작은 잔치, 오 일에 큰 잔치를 베풀어 극진히 받들었다.`,
    `하루는 광한전 옥진부인이 오신다 하여 수궁이 뒤집히듯 하였다. 이 부인이 곧 죽은 곽씨부인이니, 딸이 수궁에 왔단 말을 듣고 상제께 여쭈어 만나러 온 길이었다.`,
    `"내 딸 심청아."`,
    `부르는 소리에 심청이 왈칵 뛰어 나서며 어머니를 안았다.`,
    `"어머니, 저를 낳고 이레 안에 돌아가셔서 열다섯 해를 얼굴도 모르고 지냈습니다. 오늘 이곳에서 뵈올 줄 알았더라면 아버지께 말씀이나 여쭙고 올 것을."`,
    `모녀가 붙들고 울다가, 부인이 얼굴을 대어 보고 손발을 만져 보며 말하였다.`,
    `"내 끼던 옥지환을 네가 지녔구나. 홍전 괴불주머니도 네가 찼구나."`,
    `그러나 광한전 맡은 일이 많아 오래 머물 수 없다 하며 떨치고 일어서니, 심청은 울며 하직할 수밖에 없었다.`,
    `삼 년이 차자 상제가 다시 명을 내렸다. 용왕이 큰 연꽃 봉오리 속에 심청을 모시고 시녀 둘을 딸려 인당수로 띄워 보냈다. 마침 남경 갔던 뱃사람들이 큰 이익을 얻어 돌아오다가 그 꽃을 발견하고 건져 실어 왔다. 도선주는 재물도 마다하고 그 꽃만 가져다 집에 두었는데, 향기가 온 집에 가득하고 서기가 감돌았다.`,
    `이때 송나라 천자는 황후를 여읜 뒤 화초를 모아 기르고 있었다. 도선주가 그 꽃을 바치니 천자가 크게 기뻐하여 '강선화'라 이름 짓고 뜰에 옮겨 두었다. 어느 달 밝은 밤, 꽃봉오리가 가만히 벌어지며 어여쁜 얼굴이 반쯤 내다보았다. 천자가 가까이 가 꽃을 벌리고 보니 소저 하나와 미인 둘이 있었다.`,
    `이는 하늘이 보내신 인연이라 하여 천자는 심청을 황후로 맞았다.`
  ],
  10: [
    `황후가 된 뒤에도 심청의 마음속에는 오직 아버지 생각뿐이었다. 하루는 수심을 이기지 못하여 난간에 기대었다가, 기러기가 울며 날아오는 것을 보고 편지를 써 보내려 하였다. 그러나 붓을 들자 눈물이 먼저 떨어져 글자가 먹물이 되고, 밖에 나와 보니 기러기는 간 데 없었다.`,
    `천자가 까닭을 묻자 황후가 무릎을 꿇고 지난 일을 아뢰었다. 천자가 곧 황주로 사람을 보냈으나, 심학규는 몇 해 전에 떠돌아 간 곳을 알 수 없다는 회답이 왔다. 황후가 망극하여 울자 천자가 위로하니, 황후가 한 가지 계책을 아뢰었다.`,
    `"백성 중에 가장 불쌍한 이가 병신이요, 그중에서도 맹인입니다. 천하의 맹인을 모아 잔치를 베풀어 그 원한을 풀어 주옵소서. 그 가운데 혹 아버지를 만날지도 모르며, 또한 나라가 화평해지는 일도 될 것입니다."`,
    `천자가 크게 칭찬하고 천하에 알리니, 각 고을이 맹인의 이름과 사는 곳을 적어 올려 보냈다.`,
    `이때 심봉사는 딸을 잃은 뒤 뺑덕어미라는 여인을 얻어 살다가 가산을 다 축내고, 황성으로 가는 길에 그마저 달아나 혼자 남았다. 옷과 짐을 도둑맞고 울다가 지나던 태수에게 사정을 아뢰어 의복과 노자를 얻고, 마을 여인들과 방아를 찧으며 점심을 얻어먹기도 하면서 겨우 황성에 이르렀다.`,
    `잔치는 여러 날 이어졌으나 명부에 심씨 맹인이 없었다. 마지막 날, 황후가 몸소 나와 앉아 잔치를 마친 뒤 명부에 없는 맹인 하나가 우두커니 서 있는 것을 보고 가까이 불렀다.`,
    `"처자가 있느냐."`,
    `심봉사가 엎드려 눈물을 흘리며 아뢰었다.`,
    `"이레도 못 되어 어미를 잃은 딸 하나가 있었는데, 눈먼 아비의 눈을 뜨게 하려고 남경 뱃사람들에게 삼백 석에 몸을 팔아 인당수에 빠져 죽었습니다. 그때 나이 열다섯이었습니다. 자식을 팔아먹은 놈이 살아 쓸데없으니 죽여 주옵소서."`,
    `황후가 그 말을 듣고 버선발로 뛰어 내려와 아버지를 안았다.`,
    `"아버지, 제가 인당수에 빠져 죽었던 심청입니다."`,
    `심봉사가 깜짝 놀라 "이게 웬 말이냐" 하더니, 하도 반가운 나머지 두 눈이 활짝 열려 앞이 밝아졌다. 그 소리에 자리에 모인 맹인들이 일시에 눈을 떴다. 집에 있던 맹인도, 길 가던 맹인도 모두 눈이 밝아지니 맹인들에게는 천지가 새로 열린 셈이었다.`,
    `심봉사가 좋아서 춤을 추며 노래하였다.`,
    `"얼씨구 절씨구 지화자 좋을시고. 죽은 딸 심청이를 다시 보니, 딸의 덕으로 어두운 눈을 뜨니 해와 달이 다시 밝았구나."`,
    `천자는 심학규를 부원군으로 봉하고, 도화동 사람들에게도 상을 내렸다. 그 뒤로 해마다 풍년이 들고 천하가 태평하니, 심황후의 어진 이름이 길이 전하였다.`
  ]
};
const SC_QUIZ = {

/* 낱말 끝 글자에 받침이 있으면 a(을·과), 없으면 b(를·와)를 고른다 */
function josa(word, a, b){
  const c = word.charCodeAt(word.length-1) - 0xAC00;
  return (c>=0 && c<=11171 && c%28) ? a : b;
}
function startStoryQuiz(id, n){
  const st = STORIES[id], prog = storyProg(st);
  const quiz = st.quiz[n];
  const order = shuffle(quiz.map((q,i)=>i));
  let qi=0, got=0;
  const draw=()=>{
    if(qi>=order.length) return finish();
    const q=quiz[order[qi]];
    sheetBody.innerHTML = resBarHTML() + `
      <div class="hanja-card">
        <div class="hint">${qi+1} / ${order.length}</div>
        <p style="margin:8px 0;font-size:18px;line-height:1.6;white-space:pre-line">${q.q}</p>
      </div>
      <div class="choices">${q.opts.map(o=>`<button class="choice" data-o="${o}">${o}</button>`).join('')}</div>
      <div id="after"></div>`;
    sheetBody.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
      const ok=b.dataset.o===q.answer;
      sheetBody.querySelectorAll('.choice').forEach(x=>{
        x.disabled=true; if(x.dataset.o===q.answer) x.classList.add('right');
      });
      if(ok){
        got++;
        setTimeout(()=>{ qi++; draw(); }, 500);
        return;
      }
      b.classList.add('wrong');
      document.getElementById('after').innerHTML = `
        <div class="verdict wrong">아닙니다 — 정답은 "${q.answer}"</div>
        <p class="note">${q.note}</p>
        <button class="bigbtn" id="nx">다음</button>`;
      document.getElementById('nx').addEventListener('click',()=>{ qi++; draw(); });
    }));
  };
  const finish=()=>{
    const passMark = order.length-1;
    const bonus = got>=passMark ? 1 : 0;
    const coin = GUJEOL_COIN + bonus;
    const firstTime = !prog.done.includes(n);
    S.coin += coin; S.growWater=(S.growWater||0)+GROW_PER_GUJEOL;
    let prizeMsg = '';
    if(firstTime){
      prog.done.push(n);
      const prizeIds = (st.prizes||{})[n]||[];
      prizeIds.forEach(pid=>{ S.owned[pid]=(S.owned[pid]||0)+1; });
      const names = prizeIds.map((pid,i)=>{
        const nm = ITEMS[pid].name, last = i===prizeIds.length-1;
        return `「${nm}」${last ? josa(nm,'을','를') : josa(nm,'과','와')}`;
      }).join(' ');
      if(names) prizeMsg = `<div class="hint">${names} 정원보따리에서 쓸 수 있습니다.</div>`;
      checkRankUp(); // 모든 대목을 다 마쳤으면 여기서 급수가 오른다
    }
    save(); syncHUD();
    queueReward({coin, grow:GROW_PER_GUJEOL});
    sheetBody.innerHTML = resBarHTML() + `
      <div class="hanja-card">
        <div class="hunum">${order.length}문제 중 ${got}개를 맞혔습니다.</div>
        <div class="hint">${coin}전${bonus?` (${passMark}개 이상 맞혀 1전 더)`:''} · 성장수 ${GROW_PER_GUJEOL}방울</div>
        ${prizeMsg}
      </div>
      <button class="bigbtn" id="again">다시 풀기</button>
      <button class="subbtn" id="bhBack2">대목 목록으로</button>`;
    document.getElementById('again').addEventListener('click', ()=>startStoryQuiz(id, n));
    document.getElementById('bhBack2').addEventListener('click', ()=>openStory(id));
  };
  draw();
}

/* ── 들이기 화면의 소리 내어 읽기 ─────────────
   발음의 정확함은 가리지 않는다. 마이크로 잠깐 들어서 소리를 냈는지만
   확인하고, 냈으면 전을 조금 더 준다. 마이크가 없는 기기에서는
   버튼 자체를 숨기고, 권한을 거부해도 학습은 그대로 이어진다. */
const MIC_BONUS = 1;
function micSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
const MIC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4M8 22h8"/></svg>';
function micRowHTML(){
  if(!micSupported() || studyMode==='review') return ''; // 복습에서는 전을 주지 않는다
  if(P.readAloudGu===P.gu)
    return `<button class="subbtn done" disabled>${MIC_ICON}소리 내어 읽었습니다 · ${MIC_BONUS}전 받음</button>`;
  return `<button class="subbtn" id="micBtn">${MIC_ICON}소리 내어 읽기</button>`;
}
let stopActiveMic=null;
/* stream을 짧게 듣다가, 소리가 문턱을 넘으면 true, 조용히 시간이
   다 차면 false, 마이크를 못 쓰거나 권한이 없으면 null을 준다. */
function listenForVoice(onResult){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const start = Date.now(), DURATION=3000, THRESHOLD=14;
    let done=false;
    stopActiveMic = (heard)=>{
      if(done) return; done=true;
      stopActiveMic=null;
      stream.getTracks().forEach(t=>t.stop());
      ctx.close().catch(()=>{});
      onResult(heard===undefined?false:heard);
    };
    (function tick(){
      if(done) return;
      analyser.getByteTimeDomainData(data);
      let sum=0;
      for(let i=0;i<data.length;i++) sum+=Math.abs(data[i]-128);
      if(sum/data.length>THRESHOLD) return stopActiveMic(true);
      if(Date.now()-start>DURATION) return stopActiveMic(false);
      requestAnimationFrame(tick);
    })();
  }).catch(()=>onResult(null));
}
function bindMicBtn(){
  const btn=document.getElementById('micBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    btn.disabled=true; btn.classList.add('listening');
    btn.innerHTML = MIC_ICON+'듣는 중…';
    listenForVoice(heard=>{
      if(heard===true){
        S.coin+=MIC_BONUS; P.readAloudGu=P.gu; save(); syncHUD();
        toast(`소리 내어 읽었습니다 · ${MIC_BONUS}전`);
        renderStudy();
      } else {
        toast(heard===null ? '마이크를 쓸 수 없습니다. 그냥 넘어가도 됩니다.'
                            : '소리가 들리지 않았어요. 다시 눌러 보세요.');
        btn.disabled=false; btn.classList.remove('listening');
        btn.innerHTML = MIC_ICON+'소리 내어 읽기';
      }
    });
  });
}

function stGeulja(g){
  const o=g.chars[curCi()];
  sheetBody.innerHTML=stepBar()+`
    <div class="hanja-card">
      <div class="hint">${curCi()+1} / 8</div>
      <div class="hanja">${o.c}</div>
      <div class="hunum">${o.hun} □</div>
    </div>
    <p class="note">이 글자의 음을 적어 보세요.</p>
    <div class="answer"><input id="um" type="text" inputmode="text" maxlength="2"
      autocomplete="off" autocapitalize="off" aria-label="음">
      <button class="bigbtn" id="ck" style="margin:0;width:auto;padding:14px 22px">확인</button></div>
    <div id="after"></div>`;
  bindStepBar();
  const inp=document.getElementById('um');
  inp.focus();
  const check=()=>{
    const v=(inp.value||'').trim();
    if(!v) return;
    if(v===o.um){ markChar(P,o.c,true); save(); reveal(true); }
    else { markChar(P,o.c,false); save(); reveal(false); }
  };
  document.getElementById('ck').addEventListener('click',check);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });

  function reveal(ok){
    inp.disabled=true;
    document.getElementById('ck').disabled=true;
    const after=document.getElementById('after');
    if(ok){
      after.innerHTML=`<div class="verdict right">${o.hun} ${o.um}</div>`;
      setTimeout(next, 500);
      return;
    }
    const opts=shuffle([o, ...shuffle(CHEONJA.filter(x=>x.um!==o.um)).slice(0,3)]);
    after.innerHTML=`<div class="verdict wrong">아직입니다. 보기에서 골라 보세요.</div>
      <div class="choices">${opts.map(x=>
        `<button class="choice" data-u="${x.um}">${o.hun} ${x.um}</button>`).join('')}</div>`;
    after.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
      const okPick=b.dataset.u===o.um;
      if(!okPick){ b.disabled=true; b.classList.add('wrong'); return; } // 틀리면 남은 보기에서 다시 고른다
      after.querySelectorAll('.choice').forEach(x=>x.disabled=true);
      b.classList.add('right');
      after.insertAdjacentHTML('beforeend', `<div class="verdict right">${o.hun} ${o.um}</div>`);
      setTimeout(next, 500);
    }));
  }
  function next(){
    setCi(curCi()+1);
    if(curCi()>=8){ setCi(0); passStage(g, STAGES[1].coin); }
    else { save(); renderStudy(); }
  }
}

/* 3 소리 — 여덟 자를 다 보여주고 그중 한 자만 가려 맞힌다.
   앞 넉 자를 맞히면 곧장 뒤 넉 자로, 뒤 넉 자까지 맞히면 곧장 다음 단계로 넘어간다.
   틀렸을 때만 "다시" 버튼을 보여주고 같은 문제를 다시 낸다. */
function stSori(g){
  const draw=(half)=>{
    const k=Math.floor(Math.random()*4);
    const blankIndex=(half?4:0)+k;
    const ans=g.chars[blankIndex];
    const opts=shuffle([ans, ...shuffle(CHEONJA.filter(x=>x.c!==ans.c)).slice(0,3)]);
    render(half, blankIndex, ans, opts);
  };
  const render=(half, blankIndex, ans, opts)=>{
    sheetBody.innerHTML=stepBar()+`
      <div class="hanja-card">
        <div class="grid8">${g.chars.map((o,n)=>
          `<div class="ja ${n===blankIndex?'blank':''}"><b>${n===blankIndex?'□':o.c}</b></div>`).join('')}</div>
        <div class="hunum">${ans.hun} ${ans.um}</div>
      </div>
      <p class="note">빈자리에 들어갈 글자를 고르세요.</p>
      <div class="choices">${opts.map(x=>`<button class="choice ja-opt" data-c="${x.c}">${x.c}</button>`).join('')}</div>
      <div id="after"></div>`;
    bindStepBar();
    sheetBody.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
      const ok=b.dataset.c===ans.c;
      sheetBody.querySelectorAll('.choice').forEach(x=>{
        x.disabled=true; if(x.dataset.c===ans.c) x.classList.add('right');
      });
      if(!ok) b.classList.add('wrong');
      markChar(P,ans.c,ok); save();
      if(ok){
        document.getElementById('after').innerHTML=`<div class="verdict right">맞혔습니다</div>`;
        setTimeout(()=>{
          if(half){ setCi(0); passStage(g, STAGES[2].coin); }
          else { setCi(1); save(); draw(1); }
        }, 500);
      } else {
        document.getElementById('after').innerHTML=
          `<div class="verdict wrong">아닙니다</div><button class="bigbtn" id="nx">다시</button>`;
        document.getElementById('nx').addEventListener('click',()=>render(half, blankIndex, ans, opts));
      }
    }));
  };
  draw(curCi()<1?0:1);
}

/* 4 뜻 — 여덟 자 한 마디의 풀이를 고른다 */
function stTteut(g){
  const others=shuffle(GUJEOL.filter(x=>x.g!==g.g)).slice(0,3);
  const opts=shuffle([g,...others]);
  sheetBody.innerHTML=stepBar()+`
    <div class="hanja-card">${guTitle(g)}
      <div class="grid8 small">${g.chars.map(o=>

    </div>

    <div class="choices">${opts.map(x=>
      `<button class="choice" data-g="${x.g}">${x.mean}</button>`).join('')}</div>
    <div id="after"></div>`;
  bindStepBar();
  sheetBody.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{

    });

/* 5 배송 — 책을 덮고 여덟 자를 차례대로 놓는다 */
function stBaesong(g){
  let put=[];
  const pool=shuffle(g.chars);
  const draw=()=>{
    sheetBody.innerHTML=stepBar()+`
      <div class="hanja-card">
        <div class="hint">책을 덮고 차례대로 놓으세요</div>
        <div class="slots">${Array.from({length:8},(_,n)=>
          `<span class="${n<put.length?'on':''}">${n<put.length?put[n]:'□'}</span>`
          + (n===3?'<em></em>':'')).join('')}</div>
      </div>
      <div class="pick">${pool.map(o=>
        `<button class="ja-opt" data-c="${o.c}" ${put.includes(o.c)?'disabled':''}>${o.c}</button>`).join('')}</div>
      <div id="after"></div>`;
    bindStepBar();
    sheetBody.querySelectorAll('.pick button').forEach(b=>
      b.addEventListener('click',()=>tap(b.dataset.c)));
  };
  const tap=(c)=>{
    const want=g.chars[put.length].c;
    if(c===want){
      put.push(c);
      markChar(P,c,true);
      if(put.length===8){ save(); return done(true); }
      draw();
    } else {
      markChar(P,c,false); save(); done(false);
    }
  };
  const done=(ok)=>{
    draw();
    document.getElementById('after').innerHTML= ok
      ? `<div class="verdict right">외웠습니다.</div>
         <div class="mean">${g.mean}</div>
         <button class="bigbtn" id="nx">다음 마디로</button>`
      : `<div class="verdict wrong">차례가 어긋났습니다. 다시 해 보세요.</div>
         <div class="gu">${g.gu1}   ${g.gu2}</div>
         <button class="bigbtn" id="nx">다시</button>`;
    sheetBody.querySelectorAll('.pick button').forEach(b=>b.disabled=true);
    document.getElementById('nx').addEventListener('click',()=>{
      if(ok) passStage(g, STAGES[4].coin);
      else { put=[]; draw(); }
    });
  };
  draw();
}

const DUE_CHAR_GROW=1;   // 되짚기에서 한 글자를 맞힐 때마다 즉시 주는 성장수
const DUE_TALLY_GOAL=5;  // 다섯 글자를 맞힐 때마다 전 하나로 바꿔 준다(0.2전씩 대신)
function runReview(list){
  let n=0, got=0, earnedCoin=0;
  const step=()=>{
    if(n>=list.length){
      sheetBody.innerHTML=`<div class="hanja-card">
          <div class="hunum">${list.length}자 되짚었습니다.</div>
          <div class="hint">맞힌 것 ${got}자${earnedCoin?` · ${earnedCoin}전`:''} · 성장수 ${got}방울</div></div>
        <button class="bigbtn" id="bk">글자 익힘책으로</button>`;
      document.getElementById('bk').addEventListener('click',renderJok);
      return;
    }
    const o=list[n];
    sheetBody.innerHTML= resBarHTML() + `
      <div class="hanja-card">
        <div class="hint">되짚기 ${n+1} / ${list.length}</div>
        <div class="hanja">${o.c}</div>
        <div class="hunum">${o.hun} □</div>
      </div>
      <p class="note">음을 적어 보세요.</p>
      <div class="answer"><input id="um" type="text" maxlength="2" autocomplete="off" aria-label="음">
        <button class="bigbtn" id="ck" style="margin:0;width:auto;padding:14px 22px">확인</button></div>
      <div id="after"></div>`;
    const inp=document.getElementById('um'); inp.focus();
    const check=()=>{
      const v=(inp.value||'').trim(); if(!v) return;
      const ok=v===o.um;
      if(ok){
        got++;
        S.growWater=(S.growWater||0)+DUE_CHAR_GROW;
        const reward={grow:DUE_CHAR_GROW};
        S.dueTally=(S.dueTally||0)+1;
        if(S.dueTally>=DUE_TALLY_GOAL){
          S.dueTally=0; S.coin+=1; earnedCoin+=1; reward.coin=1;
        }
        queueReward(reward);
      }
      markChar(P,o.c,ok); save(); syncHUD();
      inp.disabled=true; document.getElementById('ck').disabled=true;
      const goNext=()=>{ n++; step(); };
      if(ok){
        document.getElementById('after').innerHTML=`<div class="verdict right">맞혔습니다 — ${o.hun} ${o.um}</div>`;
        setTimeout(goNext, 500);
      } else {
        document.getElementById('after').innerHTML=
          `<div class="verdict wrong">아니요 — ${o.hun} ${o.um}</div>
           <button class="bigbtn" id="nx">다음</button>`;
        document.getElementById('nx').addEventListener('click', goNext);
      }
    };
    document.getElementById('ck').addEventListener('click',check);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
  };
  step();
}

/* ── 상점 ───────────────────────────────── */

function placeAt(o){
  const it=o.it, [w,h]=it.box; let [x,y]=it.at;
  if(it.anchor==='bc'){ x-=footX(it, w); y-=h; } else y-=h;
  return `<g transform="translate(${x},${y})">${itemMedia(it)}</g>`;
}
/* 가게 머리 그림: 그 테마 물건을 모두 제자리(it.at)에 놓아 본 모습 */
function themeItemIds(key){ return Object.keys(ITEMS).filter(id=>ITEMS[id].theme===key && !ITEMS[id].quest); }
function packPreview(key){
  const list=themeItemIds(key).map(id=>({id,it:ITEMS[id]}));
  const ground=list.filter(o=>o.it.slot==='ground')
    .sort((a,b)=>(a.it.gkind==='cover'?0:1)-(b.it.gkind==='cover'?0:1));
  const body=list.filter(o=>o.it.slot==='mid'||o.it.slot==='front')
    .sort((a,b)=>a.it.at[1]-b.it.at[1]);
  const airHtml=list.filter(o=>o.it.slot==='air').map(placeAt).join('');
  return `<svg class="preview" viewBox="0 264 400 336" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="${(THEMES[key]||{}).name||''} 꾸민 모습">
    <rect x="0" y="258" width="400" height="40" fill="#C6D89C"/>${emptyLand()}${ground.map(placeAt).join('')}${body.map(placeAt).join('')}${airHtml}</svg>`;
}
/* 목록·읽기·퀴즈 등 여러 화면 위쪽에 늘 붙는 재화 표시(전·성장수).
   덮개(overlay)가 떠 있을 때 보상이 이 자리로 날아가는 기준점이 된다. */
function resBarHTML(){
  return `<div class="studyhead">
    <span class="coin">${COIN_SVG}<span data-num="coin">${shownCoin().toLocaleString()}</span></span>
    <span class="coin">${GROW_SVG}<span data-num="grow">${shownGrow().toLocaleString()}</span></span>
  </div>`;
}
function bindShopCells(){

}
let shopTab=Object.keys(THEMES)[0]||'';

function ownedCount(id){ return (S.owned && S.owned[id]) || 0; }
function placedInstances(id){ return S.placed.filter(iid=>typeOf(iid)===id); }
function placedCount(id){ return placedInstances(id).length; }

    <p class="note">성장수는 서당에서 글을 익혀야만 모입니다.</p>`;

function cellHTML(id,mode){
  const it=ITEMS[id], cnt=ownedCount(id), onCnt=placedCount(id);
  const [w,h]=it.box, m=Math.max(w,h);
  const tag = mode==='shop'
    ? (cnt?`<span class="tag">보유 ${cnt}</span>`:'')
    : (cnt?`<span class="tag">${onCnt}/${cnt}</span>`:'');
  const body = `<span class="rar" style="background:${RAR_COLOR[it.rar]}">${it.rar}</span>
    ${tag}
    <svg class="thumb" viewBox="${(w-m)/2} ${(h-m)/2} ${m} ${m}">${itemMedia(it)}</svg>
    <div class="cname">${it.name}</div>`;
  const foot = mode==='shop'
    ? `${COIN_SVG}${it.amt.toLocaleString()}전${it.pack?` · ${it.pack}개`:''}`
    : (onCnt<cnt?'정원에 놓기':'거두기');
  return `<button class="cell ${mode==='bag'&&onCnt?'placed':''}" data-id="${id}">
    ${body}
    <div class="cost">${foot}</div></button>`;
}
function buy(id){
  const it=ITEMS[id];
  if(S.coin<it.amt) return toast('전이 모자랍니다');
  S.coin-=it.amt;
  S.owned[id]=(S.owned[id]||0)+(it.pack||1);
  save(); syncHUD();
  if(activeShopRender) activeShopRender();
  toast(`${it.name} — 정원보따리에 넣었습니다 (${S.owned[id]}개)`);
}

    }
    sheetBody.innerHTML = tabs +
      `<p class="note" style="margin:0 2px 4px">${ownedIds.length}종 보유 · ${S.placed.length}개 정원에 놓임</p>` + body;
  }

  sheetBody.querySelectorAll('.tabs button').forEach(b=>
    b.addEventListener('click',()=>{ bagTab=b.dataset.bag; renderBag(); sheetBody.scrollTop=0; }));
  sheetBody.querySelectorAll('.cell[data-hak]').forEach(c=>

  sheetBody.querySelectorAll('.cell[data-id]').forEach(c=>{

      if(placedCount(id)<ownedCount(id)){

      } else {

        if(!last) return;

        toast(`${ITEMS[id].name}을(를) 거두었습니다`);
      }
    });
  });
  const sb=document.getElementById('sampleBtn');
  if(sb) sb.addEventListener('click',()=>{
    S.spot={...SAMPLE_SPOT};
    S.placed=SAMPLE_PLACED.filter(id=>ownedCount(id)>0);

    save(); renderBag(); toast('샘플 배치로 되돌렸습니다');

/* ── 재화 얻음 표시 ─────────────────────────
   화면 가운데에 얻은 것이 글자로 잠깐 뜨고, 엽전(또는 물방울)이 몇
   흩어져 나와 위쪽 표시 자리까지 곡선을 그리며 날아간다. 위쪽 숫자는
   그 마지막 하나가 닿는 순간에야 세어 올라간다. 받았지만 아직 닿지 않은
   양은 heldCoin/heldGrow로 들고 있다가, 위쪽 줄이든 펼친 창의 전·성장수
   표시든 모든 숫자에서 빼고 보여준다(shownCoin/shownGrow). 닿으면 그만큼
   풀어 주며 세어 올린다. 엽전이 다 날아간 뒤에야 물방울 차례가 와서
   둘이 겹치지 않는다. 눈으로 좇을 수 있게 조금 여유 있게 날아간다.
   움직임을 줄이는 설정에서는 particle 없이 글자만 옅게 보여주고
   숫자도 그 자리에서 곧장 바뀐다(움직임 요소만 뺀다). */
const rewardQueue=[];
let rewardBusy=false;
let heldCoin=0, heldGrow=0;
function shownCoin(){ return S.coin - heldCoin; }
function shownGrow(){ return (S.growWater||0) - heldGrow; }
/* 받은 것을 곧장 날리지 않고 나중에 날릴 때(물 준 뒤, 급이 오른 창을 닫은 뒤)는
   받는 순간 holdReward로 들고 있다가 queueReward(parts, {held:true})로 날린다. */
function holdReward(parts){
  heldCoin+=parts.coin||0; heldGrow+=parts.grow||0;
  refreshNumbers(false);
}
function releaseReward(kind, amount){
  if(kind==='coin') heldCoin=Math.max(0, heldCoin-amount);
  else heldGrow=Math.max(0, heldGrow-amount);
  refreshNumbers(true, kind);
}
/* 화면에 있는 전·성장수 숫자(위쪽 줄 + 펼친 창의 표시)를 보이는 값으로 맞춘다 */
function refreshNumbers(animate, only){
  [['coin', shownCoin()], ['grow', shownGrow()]].forEach(([k,v])=>{
    if(only && only!==k) return;
    document.querySelectorAll(`[data-num="${k}"]`).forEach(el=> animate ? animateNumber(el, v) : setNumber(el, v));
  });
}
function queueReward(parts, opts){
  if(!parts || (!parts.coin && !parts.grow)) return;
  if(!(opts && opts.held)) holdReward(parts);
  rewardQueue.push(parts);
  if(!rewardBusy) playNextReward();
}
function playNextReward(){
  const parts=rewardQueue.shift();
  if(!parts){ rewardBusy=false; return; }
  rewardBusy=true;
  runRewardFlight(parts).then(playNextReward);
}
function appPoint(el){
  const appRect=document.getElementById('app').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  return { x:r.left+r.width/2-appRect.left, y:r.top+r.height/2-appRect.top };
}
/* #rewardPop은 뜨고 지며 스스로 옮겨 다니므로(transform으로 가운데 맞춤),
   그 살아있는 자리 대신 원래 자리(left:50%;top:42%)를 그대로 계산해 쓴다. */
function rewardOrigin(){
  const appRect=document.getElementById('app').getBoundingClientRect();
  return { x:appRect.width*0.5, y:appRect.height*0.42 };
}
/* 글자만(움직임 줄이기): 둘을 한 번에 보여주고 곧장 숫자를 바꾼다 */
function reducedMotionReward(parts){
  return new Promise(resolve=>{
    const pop=document.getElementById('rewardPop');
    pop.innerHTML=[
      parts.coin?`<span class="rw-item">${COIN_SVG}+${parts.coin.toLocaleString()}전</span>`:'',
      parts.grow?`<span class="rw-item">${GROW_SVG}+${parts.grow.toLocaleString()}방울</span>`:''
    ].join('');
    pop.getAnimations().forEach(a=>a.cancel());
    pop.animate([{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.8},{opacity:0}],
      {duration:900, easing:'ease', fill:'forwards'});
    setTimeout(()=>{
      if(parts.coin) releaseReward('coin', parts.coin);
      if(parts.grow) releaseReward('grow', parts.grow);
      resolve();
    }, 900);
  });
}
const REWARD_UNIT={coin:'전', grow:'방울'};
const REWARD_TARGET={coin:'coinPlate', grow:'growPlate'};
/* 가게·서당 화면이 덮개(overlay)로 떠 있을 때는 맨 위 진짜 표시가 그
   덮개에 가려 안 보인다. 그럴 때는 지금 펼쳐진 화면 자기 것(.studyhead
   안의 전·성장수 표시)으로 날아가게 하고, 덮개가 없을 때만(정원에서
   물 줄 때 등) 진짜 위쪽 표시로 날아가게 한다. */
function rewardTargetEl(kind){
  if(overlay.classList.contains('on')){
    const spans=sheetBody.querySelectorAll('.studyhead .coin');
    if(spans.length>=2) return kind==='coin' ? spans[0] : spans[1];
  }
  return document.getElementById(REWARD_TARGET[kind]);
}
/* 엽전(또는 물방울) 한 번의 오고 감: 가운데 글자 → 흩어져 날아감 → 마지막이
   닿으면 위쪽 숫자가 세어 오른다. */
function flightPhase(kind, amount){
  return new Promise(resolve=>{
    const pop=document.getElementById('rewardPop');
    const n = kind==='coin' ? 4 : 3;
    const dur = kind==='coin' ? 600 : 850;
    const stagger = kind==='coin' ? 90 : 120;
    const startDelay = kind==='coin' ? 250 : 200;
    const total = startDelay + (n-1)*stagger + dur;

    pop.innerHTML=`<span class="rw-item">${kind==='coin'?COIN_SVG:GROW_SVG}+${amount.toLocaleString()}${REWARD_UNIT[kind]}</span>`;
    pop.getAnimations().forEach(a=>a.cancel());
    pop.animate([
      {opacity:0, transform:'translate(-50%,-42%)', offset:0},
      {opacity:1, transform:'translate(-50%,-50%)', offset:Math.min(.3, 120/total)},
      {opacity:1, transform:'translate(-50%,-50%)', offset:Math.max(.6, 1-180/total)},
      {opacity:0, transform:'translate(-50%,-62%)', offset:1}
    ], {duration:total, easing:'ease', fill:'forwards'});

    const fx=document.getElementById('rewardFX');
    const origin=rewardOrigin();
    const target=appPoint(rewardTargetEl(kind));
    const dx=target.x-origin.x, dy=target.y-origin.y;
    let lastDone;
    for(let i=0;i<n;i++){
      const el=document.createElement('div');
      el.className='fx-particle';
      el.style.left=origin.x+'px'; el.style.top=origin.y+'px';
      el.innerHTML = kind==='coin' ? COIN_SVG : GROW_SVG;
      fx.appendChild(el);
      const side = i%2===0 ? 1 : -1;
      const keyframes = kind==='coin' ? [
        { transform:'translate(0,0) scale(1)', opacity:1, offset:0 },
        { transform:`translate(${dx*.5+side*18}px, ${dy*.5-30}px) scale(.7)`, opacity:1, offset:.55 },
        { transform:`translate(${dx}px, ${dy}px) scale(.3)`, opacity:.85, offset:1 }
      ] : [
        { transform:'translate(0,4px) scale(1)', opacity:1, offset:0 },
        { transform:`translate(${dx*.35+side*10}px, ${dy*.4+10}px) scale(.85)`, opacity:1, offset:.4 },
        { transform:`translate(${dx*.75+side*4}px, ${dy*.75-8}px) scale(.55)`, opacity:.95, offset:.75 },
        { transform:`translate(${dx}px, ${dy}px) scale(.3)`, opacity:.85, offset:1 }
      ];
      const anim=el.animate(keyframes, {
        duration:dur, delay:startDelay+i*stagger,
        easing: kind==='coin' ? 'ease-in' : 'ease-in-out', fill:'forwards'
      });
      const done=anim.finished.then(()=>el.remove()).catch(()=>el.remove());
      if(i===n-1) lastDone=done;
    }
    // 탭이 뒤로 밀려 애니메이션이 멈추더라도(예: 다른 창으로 전환) 숫자가
    // 영영 안 바뀌는 일이 없도록, 다 날아갈 시간이 지나면 그냥 넘어간다.
    lastDone=Promise.race([lastDone, new Promise(res=>setTimeout(res, total+250))]);
    lastDone.then(()=>{
      releaseReward(kind, amount);
      resolve();
    });
  });
}
async function runRewardFlight(parts){
  if(prefersReducedMotion()) return reducedMotionReward(parts);
  if(parts.coin) await flightPhase('coin', parts.coin);
  if(parts.grow) await flightPhase('grow', parts.grow);
}

/* 위쪽 숫자를 한 번에 바꾸지 않고 짧게 세어 올라가듯(또는 내려가듯)
   바꾸고, 그 자리를 잠깐 밝혔다 되돌린다. */
function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function setNumber(el, to){ el._numTok=(el._numTok||0)+1; el.textContent=to.toLocaleString(); }
function animateNumber(el, to){
  const from=parseInt((el.textContent||'0').replace(/,/g,''),10) || 0;
  if(from===to) return;
  const tok = el._numTok = (el._numTok||0)+1; // 더 새로 세기 시작하면 이 세기는 멈춘다
  const plate=el.closest('.plate');
  if(plate){ plate.classList.remove('flash'); void plate.offsetWidth; plate.classList.add('flash'); }
  if(prefersReducedMotion()){ el.textContent=to.toLocaleString(); return; }
  const dur=500, start=performance.now();
  // 탭이 뒤로 밀려 화면이 안 그려지는 동안은 requestAnimationFrame이 멈추므로,
  // 그래도 값은 맞게 끝나도록 타이머로 최종값을 한 번 더 못박아 둔다.
  setTimeout(()=>{ if(el._numTok===tok) el.textContent=to.toLocaleString(); }, dur);
  (function tick(now){
    if(el._numTok!==tok) return;
    const t=Math.min(1, (now-start)/dur);
    const eased=1-Math.pow(1-t,3);
    el.textContent=Math.round(from+(to-from)*eased).toLocaleString();
    if(t<1) requestAnimationFrame(tick); else el.textContent=to.toLocaleString();
  })(start);
}

/* 저장은 늘 이 기기(localStorage)에 곧장 하고, 로그인 중이면 계정에는
   모아서 올린다(scheduleCloudPush). 기기 저장이 곧 「올릴 것」 줄이므로,
   올리기 전에 앱이 닫혀도 다음에 켤 때 올라간다. */
function save(){ S.updatedAt=Date.now(); persistLocal(); scheduleCloudPush(); }
function persistLocal(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; } }

/* ── 계정 ─────────────────────────────────────
   위쪽 줄 급수 표시 오른쪽 끝의 동그라미(#acctBtn)를 누르면 계정 창이 뜬다.
   로그인은 맨 아래 Firebase 모듈 스크립트가 맡고, 이 스크립트와는
   window.cloud 하나로만 이어진다. 모듈은 이 스크립트가 다 돈 뒤에
   불러와지므로, window.cloud가 아직 없을 수도 있다고 보고 쓴다.
   로그인 팝업은 반드시 단추를 누른 그 자리에서 열어야 한다(다른 동작
   뒤에 미뤄 열면 브라우저가 팝업을 막는다). */

/* 위쪽 줄 계정 동그라미 옆의 호 — 로그인했고 호를 정했을 때만 */
function syncNickTxt(){

function syncAcctBtn(){
  syncNickTxt();

  btn.classList.toggle('in', !!user);

    const img = new Image();
    img.alt=''; img.referrerPolicy='no-referrer';
    img.onload = ()=>{ face.textContent=''; face.appendChild(img); };
    img.src = user.photoURL;

}

      <div class="hanja-card" style="text-align:left">
        <div class="hint">호</div>
        <div class="hunum">${S.nick ? escHTML(S.nick) : '아직 정하지 않았습니다'}</div>
        <div class="hint">${S.nick ? '이웃들이 내 정원을 구경할 수 있습니다.' : '호를 정하면 내 정원이 이웃들에게 공개됩니다.'}</div>

    document.getElementById('nickBtn').addEventListener('click', ()=>openNickSheet(false));
    document.getElementById('signOutBtn').addEventListener('click', signOutAndReset);

  sheetBody.innerHTML = `

  const signInWith = fn=>async ()=>{

  addTestTools();
}
/* 시험용 도구 — 이 컴퓨터에서 localhost로 열 때만 계정 창 맨 아래에 보인다 */
const TEST_GROW_AMOUNT = 100;
const TEST_COIN_AMOUNT = 100;
function addTestTools(){
  if(!isLocalTest()) return;
  sheetBody.insertAdjacentHTML('beforeend', `
    <div class="hanja-card" style="text-align:left;margin-top:16px">
      <div class="hint">시험용 도구 (localhost에서만 보입니다)</div>
      <button class="subbtn" id="testGrowBtn" style="margin-top:8px">성장수 ${TEST_GROW_AMOUNT}방울 넣기</button>
      <button class="subbtn" id="testCoinBtn" style="margin-top:8px">전 ${TEST_COIN_AMOUNT}닢 넣기</button>
    </div>`);
  document.getElementById('testGrowBtn').addEventListener('click', ()=>{
    S.growWater=(S.growWater||0)+TEST_GROW_AMOUNT; save(); syncHUD();
    toast(`성장수 ${TEST_GROW_AMOUNT}방울을 넣었습니다 · 지금 ${S.growWater}방울`);
  });
  document.getElementById('testCoinBtn').addEventListener('click', ()=>{
    S.coin=(S.coin||0)+TEST_COIN_AMOUNT; save(); syncHUD();
    toast(`전 ${TEST_COIN_AMOUNT}닢을 넣었습니다 · 지금 ${S.coin}전`);
  });
}
/* 이 컴퓨터에서 시험하는 중인가 (localhost로 연 경우만). 시험용 단추는 이때만 보인다. */
function isLocalTest(){ return ['localhost','127.0.0.1'].includes(location.hostname); }
/* 로그인 상태가 바뀔 때마다 모듈 스크립트가 부른다 (앱을 켤 때도 한 번) */
function onCloudAuth(user, prev){
  if(user && !prev && window.cloud.signedInNow) toast(`${user.displayName||'학동'}님, 어서 오세요`);
  syncAcctBtn();
  if(user) cloudSync(user);
  else { syncState='off'; clearTimeout(pushTimer); pushTimer=null; }
  if(overlay.classList.contains('on') && sheetTitle.textContent===ACCOUNT_TITLE) renderAccount();
}

/* ── 계정에 저장하고 불러오기 ───────────────────
   계정 문서 users/{uid} = { data: S를 JSON 문자열로, updatedAt, v }.
   S 안에 두 가지를 적어 둔다.
     S.ownerUid  이 기기의 기록이 어느 계정 것인지 (없으면 손님 기록)
     S.syncBase  이 기기가 마지막으로 계정과 맞춘 때의 계정 쪽 updatedAt
   로그인하면(앱을 켤 때 자동 로그인 포함) 계정 문서를 한 번 읽어 맞춘다.
     계정에 기록이 없다          → 이 기기 기록을 올린다 (처음 로그인)
     손님 기록 / 다른 계정 기록  → 계정 기록을 받는다 (새 기기에서 비어 있던
                                  기록이 계정 기록을 덮지 않게)
     계정이 그대로다             → 이 기기에서 바뀐 게 있으면 올린다
     이 기기는 그대로, 계정은 바뀜 → 계정 기록을 받는다
     둘 다 바뀜                  → 나중에 저장한 쪽을 쓴다
   받을 때는 기기 저장을 바꾼 뒤 새로고침한다(앱이 켜질 때 한 번에 S를
   만드는 지금 구조를 그대로 쓰기 위해). 올리기는 30초씩 모아서 하고,
   화면을 벗어날 때는 곧장 올린다. */
function scheduleCloudPush(){
  if(syncState!=='ready' || pushTimer) return;
  pushTimer = setTimeout(cloudPushNow, CLOUD_PUSH_DELAY);
}
async function cloudPushNow(){
  clearTimeout(pushTimer); pushTimer=null;
  const user = window.cloud && window.cloud.user;
  if(syncState!=='ready' || !user || S.ownerUid!==user.uid) return;
  if((S.updatedAt||0) > (S.syncBase||0)){
    const at = S.updatedAt;
    try{
      await window.cloud.push({ data: JSON.stringify(S), updatedAt: at, v: 1 });
      S.syncBase = at; persistLocal(); // updatedAt은 건드리지 않는다
    }catch(e){ console.warn('계정에 올리지 못함', e); return; }
  }
  await publishGardenIfChanged();
}

/* ── 공개 정원 gardens/{uid} ───────────────────
   이웃이 구경하는 내 정원. 호를 정해야 공개된다. 정원·옷·호·급·익힌 글자 수
   가운데 하나라도 바뀌었을 때만 올린다(학습만 했을 때는 올리지 않는다). */
function gardenSnapshot(){
  const placed = S.placed.filter(iid=>IID_RE.test(iid)).slice(0,200);
  const spot={}, growth={};
  placed.forEach(iid=>{
    // 좌우로 뒤집은 것은 셋째 칸에 1을 붙여 싣는다(보안 규칙이 칸 수를 따지지 않는다)
    if(Array.isArray(S.spot[iid])) spot[iid] = S.flip[iid] ? [S.spot[iid][0], S.spot[iid][1], 1] : S.spot[iid];
    if(S.growth[iid]) growth[iid]=S.growth[iid];
  });
  // wear 칸에는 옷 대신 고른 학동을 싣는다(게시된 보안 규칙이 wear를 맵으로 요구한다)
  const wear={ hakdong:S.hakdong };
  // likes는 없앤 「좋구나」 칸이다. 지금 게시된 보안 규칙이 이 칸을 요구해서 빈 칸으로 보낸다
  // (규칙에서 likes를 빼고 다시 게시할 때 여기서도 뺀다).
  return { nick:S.nick, rankIdx:curRankIdx(), chars:metCount(), placed, spot, growth, likes:{}, wear };
}
async function publishGardenIfChanged(){
  if(!S.nick) return;
  const g=gardenSnapshot(), sig=JSON.stringify(g);
  if(sig===S.gardenSig) return;
  try{ await window.cloud.publishGarden(g); S.gardenSig=sig; persistLocal(); }
  catch(e){ console.warn('공개 정원을 올리지 못함', e); }
}
/* 이웃이 내 정원에 남긴 물(visits)을 받아 온다. 앱을 켤 때 한 번, 그 뒤로는
   내 정원에 돌아올 때 VISIT_CHECK_MS에 한 번씩. 받은 것은 서버에서 지운다. */
const VISIT_CHECK_MS = 2*60*1000;
let lastVisitCheck = 0;
async function checkVisits(force){
  if(syncState!=='ready') return;
  if(!force && Date.now()-lastVisitCheck < VISIT_CHECK_MS) return;
  lastVisitCheck = Date.now();
  try{
    const visits = (await window.cloud.takeVisits())
      .filter(v=>typeof v.iid==='string' && typeof v.from==='string')
      .map(v=>({ from:v.from.trim().slice(0,8)||'이웃', iid:v.iid, at:v.at }));
    if(visits.length) receiveVisits(visits);
  }catch(e){ console.warn('다녀간 이웃을 받지 못함', e); }
}

/* ── 호 ───────────────────────────────────
   이름 팻말과 위쪽 줄에 나오는 이름. 호를 정해야 내 정원이 이웃에게 공개된다.
   로그인한 뒤 호가 없으면 한 번 묻는다(나중에 계정 창에서 바꿀 수 있다). */
const NICK_RE = /^[가-힣A-Za-z0-9]{2,8}$/;
function promptNickIfNeeded(){
  if(S.nick || sessionStorage.getItem('kseodang_nick_asked')) return;
  if(overlay.classList.contains('on')) return; // 다른 창을 보고 있으면 끼어들지 않는다
  sessionStorage.setItem('kseodang_nick_asked','1');
  openNickSheet(true);
}
function openNickSheet(first){
  openSheetRaw('호 정하기');
  sheetBody.innerHTML = `
    <p class="note" style="margin:0 2px 12px">서당에서 불릴 이름(호)을 정합니다. 이름 팻말에 나오고, 이웃들이 내 정원을 구경할 때 보입니다.
      한글·영문·숫자로 2~8자.</p>
    <input id="nickInput" maxlength="8" value="${escHTML(S.nick||'')}" autocomplete="off"
      style="width:100%;box-sizing:border-box;font-family:inherit;font-size:20px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:6px">
    <div class="hint" id="nickMsg" style="min-height:20px;margin:0 2px 10px"></div>
    <button class="bigbtn" id="nickOk">정하기</button>
    ${first?'<button class="subbtn" id="nickLater">나중에</button>':'<button class="subbtn" id="nickLater">돌아가기</button>'}`;
  const input=document.getElementById('nickInput');
  document.getElementById('nickOk').addEventListener('click', ()=>{
    const v=input.value.trim();
    if(!NICK_RE.test(v)) { document.getElementById('nickMsg').textContent='한글·영문·숫자로 2~8자를 적어 주세요 (띄어쓰기·기호는 안 됩니다)'; return; }
    S.nick=v; save(); syncHUD(); drawScene();
    toast(`이제 「${v}」(으)로 불립니다`);
    if(first) closeSheet(); else openAccount();
  });
  document.getElementById('nickLater').addEventListener('click', ()=> first ? closeSheet() : openAccount());
}
async function cloudSync(user){
  syncState='syncing';
  let remote;
  try{ remote = await window.cloud.pull(); }
  catch(e){
    console.warn('계정 기록을 읽지 못함', e);
    syncState='error';
    return toast('계정 기록을 불러오지 못했습니다. 이 기기에만 저장합니다');
  }
  const mine = S.ownerUid===user.uid, guest = !S.ownerUid;
  if(!remote){
    if(mine || guest){
      S.ownerUid=user.uid; S.syncBase=0; S.updatedAt=S.updatedAt||Date.now(); persistLocal();
      syncReady();
      await cloudPushNow();
      if(guest) toast('이 기기의 기록을 계정에 담았습니다');
      return;
    }
    return adoptRemote(null, user, '새 계정이라 처음부터 시작합니다');
  }
  if(!mine) return adoptRemote(remote, user, '계정의 기록을 불러왔습니다');
  const localChanged = (S.updatedAt||0) > (S.syncBase||0);
  if(remote.updatedAt===S.syncBase || (localChanged && S.updatedAt>=remote.updatedAt)){
    syncReady();
    return cloudPushNow();
  }
  return adoptRemote(remote, user, '다른 기기에서 한 것을 불러왔습니다');
}
function syncReady(){
  syncState='ready';
  sessionStorage.removeItem(ADOPTED_KEY);
  neighborCache = null;
  if(overlay.classList.contains('on') && sheetTitle.textContent===ACCOUNT_TITLE) renderAccount();
  setTimeout(()=>{ checkVisits(true); promptNickIfNeeded(); }, 800);
}
function adoptRemote(remote, user, note){
  // 같은 것을 두 번 받으려 하면(무엇인가 어긋난 경우) 새로고침을 되풀이하지 않는다
  const mark = `${user.uid}:${remote ? remote.updatedAt : 'fresh'}`;
  if(sessionStorage.getItem(ADOPTED_KEY)===mark){ syncState='error'; return; }
  sessionStorage.setItem(ADOPTED_KEY, mark);
  try{
    if(remote){
      const next = JSON.parse(remote.data);
      next.ownerUid=user.uid; next.syncBase=remote.updatedAt; next.updatedAt=remote.updatedAt;
      localStorage.setItem(SAVE_KEY, JSON.stringify(next));
    } else localStorage.removeItem(SAVE_KEY);
    sessionStorage.setItem(SYNC_NOTE_KEY, note);
  }catch(e){ console.warn('계정 기록을 받지 못함', e); syncState='error'; return; }
  location.reload();
}
async function signOutAndReset(){
  await cloudPushNow();             // 남은 것을 올리고
  syncState='off';
  sessionStorage.removeItem(ADOPTED_KEY);
  await window.cloud.signOut();
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  sessionStorage.setItem(SYNC_NOTE_KEY, '로그아웃했습니다');
  location.reload();                // 이 기기는 처음 상태(손님)로
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') cloudPushNow(); });
window.addEventListener('pagehide', ()=>{ cloudPushNow(); });
{
  const note = sessionStorage.getItem(SYNC_NOTE_KEY);
  if(note){ sessionStorage.removeItem(SYNC_NOTE_KEY); setTimeout(()=>toast(note), 400); }
}

syncHUD();
drawScene();
if(where==='garden') setTimeout(showVisitNotice, 600);
</script>
<script type="module">
/* ── Firebase: 로그인 ───────────────────────────
   아래 설정값은 공개돼도 되는 값이다(어느 프로젝트인지 알려 줄 뿐).
   데이터를 지키는 것은 Firestore 보안 규칙이 맡는다.
   버전은 고정해 둔다. 올릴 때는 숫자만 바꾼다. */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, getDocs,
         addDoc, writeBatch, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBqZ_hdLPrEnPA7YHTV3H3cQ0sU7bhJKJs",
  authDomain: "k-seodang.firebaseapp.com",
  projectId: "k-seodang",
  storageBucket: "k-seodang.firebasestorage.app",
  messagingSenderId: "390746632752",
  appId: "1:390746632752:web:25e37147f9fe5959dcb3f5"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = 'ko';
const db = getFirestore(app);
const myDoc = ()=>doc(db, 'users', auth.currentUser.uid); // 내 기록 문서 users/{uid}

const cloud = window.cloud = {
  user: null,
  ready: false,        // 처음 로그인 상태를 확인했는지
  signedInNow: false,  // 이번에 단추를 눌러 들어왔는지(앱을 켤 때 자동 로그인과 구별)
  async signIn(){
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt:'select_account' });
    cloud.signedInNow = true;
    try{ return await signInWithPopup(auth, provider); }
    catch(e){ cloud.signedInNow = false; throw e; }
  },
  // 시험용 익명 로그인 — 앱에서는 localhost로 열 때만 단추가 보인다(isLocalTest)
  async signInAnon(){
    cloud.signedInNow = true;
    try{ return await signInAnonymously(auth); }
    catch(e){ cloud.signedInNow = false; throw e; }
  },
  signOut(){ return signOut(auth); },
  // 계정 기록 읽기: 없으면 null, 있으면 { data, updatedAt, v }
  async pull(){
    const snap = await getDoc(myDoc());
    return snap.exists() ? snap.data() : null;
  },
  // 계정 기록 쓰기 (통째로 바꾼다)
  push(payload){ return setDoc(myDoc(), payload); },
  // 내 공개 정원 쓰기 gardens/{uid}
  publishGarden(g){
    return setDoc(doc(db, 'gardens', auth.currentUser.uid), { ...g, updatedAt: serverTimestamp() });
  },
  // 공개 정원 최근 순 20곳. 걸러 쓰는 것은 앱 쪽(sanitizeGarden)이 맡는다
  async listGardens(){
    const snap = await getDocs(query(collection(db, 'gardens'), orderBy('updatedAt', 'desc'), limit(20)));
    return snap.docs.map(d=>{
      const v = d.data();
      return { ...v, id: d.id, updatedAtMs: v.updatedAt && v.updatedAt.toMillis ? v.updatedAt.toMillis() : 0 };
    });
  },
  // 이웃 정원에 물 준 것을 남긴다 gardens/{이웃uid}/visits/{자동}
  sendVisit(ownerUid, { from, iid }){
    return addDoc(collection(db, 'gardens', ownerUid, 'visits'),
      { fromUid: auth.currentUser.uid, from, iid, at: serverTimestamp() });
  },
  // 내 정원에 남은 visits를 모두 읽고 지운다
  async takeVisits(){
    // 한 번에 지울 수 있는 수(500)보다 적게 받는다. 남은 것은 다음 번에
    const snap = await getDocs(query(collection(db, 'gardens', auth.currentUser.uid, 'visits'), limit(400)));
    if(snap.empty) return [];
    const batch = writeBatch(db);
    const list = snap.docs.map(d=>{
      batch.delete(d.ref);
      const v = d.data();
      return { from: v.from, iid: v.iid, at: v.at && v.at.toMillis ? v.at.toMillis() : Date.now() };
    });
    await batch.commit();
    return list;
  }
};
onAuthStateChanged(auth, user=>{
  const prev = cloud.user;
  cloud.user = user; cloud.ready = true;
  window.onCloudAuth(user, prev);
  cloud.signedInNow = false;
});
</script>
