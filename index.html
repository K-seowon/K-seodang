<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>운교서당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3D3A36; --hanji:#FBF3E4; --hanji-2:#F2E4CB;
  --maehwa:#F0A8BE; --maehwa-d:#D9718F;
  --leaf:#6E9A50; --wood:#B08F6A; --wood-d:#7A5F45;
  --coin:#E8A33C; --coin-d:#C9832A; --gem:#D9A03C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2B2620}
body{font-family:'Gaegu',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;background:#FDF3E9;overflow:hidden}

#hud{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;gap:6px;align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
.plate{background:var(--hanji);border:2.5px solid var(--ink);border-radius:14px;padding:4px 10px;
  display:flex;align-items:center;gap:6px;font-size:17px;line-height:1.1;box-shadow:0 2px 0 rgba(61,58,54,.25)}
.plate .num{font-weight:700;font-size:19px}
#who{flex-direction:column;align-items:flex-start;gap:1px;padding:5px 12px}
#who .nameRow{display:flex;align-items:center;gap:6px}
#who .name{font-weight:700;font-size:18px}
.grade{font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;border:2px solid var(--ink);color:#fff}
#rankDemoBtn{pointer-events:auto;cursor:pointer;margin-left:auto;color:var(--ink)}
.pip{width:22px;height:22px;flex:0 0 auto;display:block}
.cost .pip{width:17px;height:17px}
#topupBtn{pointer-events:auto;cursor:pointer;color:var(--ink)}
#bgmBtn,#helpBtn{display:none;pointer-events:auto;cursor:pointer;color:var(--ink)}
#bgmBtn.on,#helpBtn.on{display:flex}
#bgmBtn.muted{opacity:.5}
#bgmBtn svg,#helpBtn svg{width:20px;height:20px}

#stage{flex:1;position:relative;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tapzone{cursor:pointer}
.dragging{opacity:.85}

#lockBtn{position:absolute;left:10px;bottom:10px;z-index:26;display:none;align-items:center;gap:6px;
  background:var(--hanji);border:2.5px solid var(--ink);border-radius:14px;padding:6px 12px;
  font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(61,58,54,.25)}
#lockBtn.on{display:flex}
#lockBtn.locked{background:var(--hanji-2);color:#8A7D6B}
#lockBtn svg{width:18px;height:18px}

#waterBtn{position:absolute;right:10px;bottom:10px;z-index:26;display:none;align-items:center;gap:6px;
  background:var(--hanji);border:2.5px solid var(--ink);border-radius:14px;padding:6px 12px;
  font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(61,58,54,.25)}
#waterBtn.on{display:flex}
#waterBtn.active{background:#BFE3F5;color:#1B5E82}
#waterBtn svg{width:18px;height:18px}

#placeBar{position:absolute;left:0;right:0;bottom:0;z-index:27;display:none;
  background:var(--hanji);border-top:3px solid var(--ink);padding:8px 12px;
  font-size:17px;align-items:center;gap:10px}
#placeBar.on{display:flex}
#placeBar button{margin-left:auto;border:2.5px solid var(--ink);border-radius:12px;background:var(--hanji-2);
  font-family:inherit;font-size:17px;padding:5px 14px;cursor:pointer}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.badge-bob{animation:bob 1.6s ease-in-out infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}10%{opacity:.9}100%{transform:translate(var(--dx),660px) rotate(340deg);opacity:0}}
.petal{opacity:0;animation:fall linear infinite}
@keyframes kettleTilt{0%{transform:rotate(22deg);opacity:0}12%{opacity:1;transform:rotate(0deg)}
  88%{transform:rotate(0deg);opacity:1}100%{transform:rotate(22deg);opacity:0}}
.can{opacity:0;animation:kettleTilt 3.2s ease-in-out forwards;transform-origin:0 0}
@keyframes waterdrop2{0%{opacity:0;transform:translate(0,0) scale(1)}10%{opacity:1}85%{opacity:.4}
  100%{opacity:0;transform:translate(var(--ddx),var(--ddy)) scale(.2)}}
.drop2{opacity:0;animation:waterdrop2 .55s ease-in infinite}
@keyframes plantShakeLR{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}
  50%{transform:translateX(0)}75%{transform:translateX(3px)}}
.plant-shake{animation:plantShakeLR .5s ease-in-out infinite;animation-delay:.4s}
@media (prefers-reduced-motion:reduce){
  .petal,.badge-bob{animation:none}
  .can,.drop2{animation:none;opacity:1}
  .plant-shake{animation:none}
  .plate.flash{animation:none}
}

/* ── 재화 얻음 표시 ─────────────────────────
   화면 가운데에 얻은 것이 글자로 잠깐 떴다가, 엽전(또는 물방울)이
   몇 개 흩어져 나와 위쪽 표시 자리까지 곡선을 그리며 날아간다.
   실제 움직임은 JS(Web Animations API)가 맡고, 여기서는 생김새만
   정한다. 움직임을 줄이는 설정에서는 particle을 만들지 않고
   글자만 옅게 나타났다 사라진다(공용.js가 갈라 처리). */
#rewardPop{position:absolute;left:50%;top:42%;z-index:70;display:flex;gap:8px;
  opacity:0;pointer-events:none;white-space:nowrap}
.rw-item{display:inline-flex;align-items:center;gap:6px;background:var(--hanji);
  border:1.5px solid #8A7D6B;border-radius:14px;padding:8px 16px;
  font-size:21px;font-weight:700;color:var(--ink);box-shadow:0 3px 10px rgba(61,58,54,.2)}
#rewardFX{position:absolute;inset:0;z-index:71;pointer-events:none;overflow:hidden}
.fx-particle{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;will-change:transform,opacity}
.fx-particle svg{width:100%;height:100%;display:block}
@keyframes plateFlash{0%{background:var(--hanji)}30%{background:#FBE7A8}100%{background:var(--hanji)}}
.plate.flash{animation:plateFlash .7s ease}

#nav{position:relative;z-index:20;display:flex;background:var(--hanji);
  border-top:3px solid var(--ink);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
#nav button{flex:1;background:none;border:0;padding:4px 0 2px;font-family:inherit;font-size:16px;
  color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  border-radius:10px;position:relative;opacity:.55}
#nav button.here{opacity:1;font-weight:700}
#nav button:focus-visible{outline:3px solid var(--maehwa-d);outline-offset:-2px}
#nav button svg{width:26px;height:26px}
#nav button .dot{position:absolute;top:2px;right:calc(50% - 18px);width:9px;height:9px;
  border-radius:50%;background:#D9463F;border:2px solid var(--hanji)}

#overlay{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;background:var(--hanji)}
#overlay.on{display:flex}
.sheet-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  border-bottom:3px solid var(--ink);background:var(--hanji-2)}
.sheet-top h1{margin:0;font-size:22px;font-weight:700;flex:1}
.iconbtn{width:38px;height:38px;flex:0 0 auto;border:2.5px solid var(--ink);border-radius:12px;
  background:var(--hanji);font-family:inherit;font-size:20px;cursor:pointer;line-height:1}
.sheet-body{flex:1;overflow-y:auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 20px)}

.hanja-card{background:var(--hanji-2);border:3px solid var(--ink);border-radius:18px;padding:20px 16px;text-align:center}
.gu{font-size:20px;color:#8A7D6B;letter-spacing:.12em}
.hanja{font-size:92px;line-height:1.05;font-weight:700}
.hunum{font-size:26px;margin-top:6px}
.hint{font-size:17px;color:#7A6E5E;margin-top:4px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji);padding:12px;
  font-family:inherit;font-size:20px;cursor:pointer;text-align:left}
.choice.right{background:#CFE7BE} .choice.wrong{background:#F3CFCF}
.bigbtn{width:100%;margin-top:16px;padding:14px;border:3px solid var(--ink);border-radius:16px;
  background:var(--maehwa);font-family:inherit;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.subbtn{width:100%;margin-top:12px;padding:11px;border:2.5px solid var(--ink);border-radius:14px;
  background:var(--hanji-2);font-family:inherit;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px}
.subbtn svg{width:19px;height:19px;flex:0 0 auto}
.subbtn.listening{background:#BFE3F5;color:#1B5E82}
.subbtn.done{background:#DCEAC8;cursor:default}
.subbtn:disabled{cursor:default}
.note{font-size:17px;color:#7A6E5E;margin:10px 2px 0;line-height:1.5}
.studyhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:15px}
.studyhead .coin{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps span{flex:1;text-align:center;font-size:15px;padding:5px 0;border-radius:10px;
  border:2px solid #D6C7AC;color:#A99E8B;background:var(--hanji)}
.steps span.past{background:#DCEAC8;border-color:var(--ink);color:#5C5346;cursor:pointer}
.steps span.now{background:var(--maehwa);border-color:var(--ink);color:var(--ink);font-weight:700}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 6px}
.grid8 .ja{background:var(--hanji);border:2px solid var(--ink);border-radius:10px;padding:6px 2px}
.grid8 .ja b{display:block;font-size:32px;line-height:1.1;font-weight:700}
.grid8 .ja span{display:block;font-size:14px;color:#7A6E5E;white-space:nowrap;overflow:hidden}
.grid8.small .ja b{font-size:26px}
.grid8 .ja.blank{background:var(--maehwa)}
.mean{font-size:19px;margin-top:10px;line-height:1.5}
.answer{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.answer input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:16px;background:var(--hanji);
  font-family:inherit;font-size:30px;text-align:center;padding:8px}
.verdict{font-size:20px;font-weight:700;margin-top:14px;padding:10px 14px;border-radius:14px;
  border:2.5px solid var(--ink)}
.verdict.right{background:#CFE7BE} .verdict.wrong{background:#F3CFCF}
.ja-opt{font-size:34px;font-weight:700;text-align:center;padding:10px 0}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pick button{border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji);
  font-family:inherit;font-size:32px;font-weight:700;padding:8px 0;cursor:pointer}
.pick button:disabled{background:var(--hanji-2);color:#C4B8A2}
.slots{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;margin:10px 0}
.slots span{width:36px;font-size:30px;font-weight:700;color:#C4B8A2}
.slots span.on{color:var(--ink)}
.slots em{width:12px}
.jokrow{border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji-2);padding:9px 11px;margin-top:10px}
.jokhead{display:flex;justify-content:space-between;font-size:18px}
.jokhead span{color:#7A6E5E}
.jokbar{height:7px;background:var(--hanji);border:2px solid var(--ink);border-radius:5px;overflow:hidden;margin:5px 0 6px}
.jokbar>i{display:block;height:100%;background:var(--leaf)}
.jokchars{font-size:22px;letter-spacing:.08em;color:#C4B8A2;word-break:break-all}
.jokchars .met{color:var(--ink);font-weight:700}

.gugroup{margin-bottom:10px}
.grouphead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji-2);
  padding:10px 12px;font-family:inherit;cursor:pointer;margin-bottom:8px}
.grouphead.open{background:var(--hanji)}
.grouphead .grouptitle{font-size:17px;font-weight:700}
.grouphead .groupsub{flex:1;text-align:right;font-size:14px;color:#7A6E5E}
.grouphead .chev{width:18px;height:18px;flex:0 0 auto;transition:transform .15s ease}
.grouphead.open .chev{transform:rotate(180deg)}
.gulist{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.gurow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji-2);
  padding:9px 12px;font-family:inherit;cursor:pointer}
.gurow .gunum{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--hanji);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700}
.gurow .gutext{flex:1;font-size:16px;line-height:1.4;min-width:0}
.gurow .gutext small{display:block;color:#7A6E5E;font-size:13px;font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gurow.current{background:var(--maehwa)}
.gurow.done{background:#DCEAC8}
.gurow.locked{opacity:.55;cursor:default}
.badge2{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;
  border:2px solid var(--ink);background:var(--hanji)}
.badge2.now{background:#fff}
.badge2.done{background:#8AB566;color:#fff}
.bhword{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
  text-decoration-color:var(--maehwa-d);cursor:pointer;color:var(--maehwa-d);font-weight:700}

/* 낱말 뜻 풍선 — 누른 낱말 바로 옆(위/아래)에 뜬다. 위치는 JS가 매번
   계산해 top/left/--tail-x로 넣어 준다. 저절로 사라지지 않고, 다른
   곳을 누르거나 같은 낱말을 다시 누르면 사라진다. */
.word-bubble{position:absolute;z-index:45;max-width:min(280px,78%);background:var(--ink);color:var(--hanji);
  padding:8px 13px;border-radius:12px;font-size:15px;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.28);
  opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;pointer-events:none}
.word-bubble.on{opacity:1;transform:translateY(0);pointer-events:auto}
.word-bubble::after{content:'';position:absolute;left:var(--tail-x,20px);width:12px;height:12px;
  background:var(--ink);transform:rotate(45deg)}
.word-bubble.below::after{top:-5px}
.word-bubble.above::after{bottom:-5px}

.packhead{border:3px solid var(--ink);border-radius:16px;overflow:hidden;margin-bottom:14px;position:relative}
.packhead .strip{padding:10px 14px;background:var(--maehwa);border-bottom:3px solid var(--ink)}
.packhead h2{margin:0;font-size:22px;font-weight:700}
.packhead .sub{padding:8px 14px;font-size:17px;background:var(--hanji-2);color:#6B6154}
.packhead .preview{display:block;width:100%;background:#FDF3E9}
.packhead .art{position:relative;line-height:0}
.packhead.banner .strip{position:absolute;left:0;right:0;bottom:0;border:0;
  background:linear-gradient(to top, rgba(61,58,54,.85), rgba(61,58,54,0));padding:20px 14px 12px}
.packhead.banner .strip h2{color:var(--hanji);text-shadow:0 2px 3px rgba(0,0,0,.4)}
.packhead.banner .sub{border-top:3px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji-2);padding:6px;
  position:relative;font-family:inherit;text-align:center}
button.cell{cursor:pointer}
.cell .thumb{width:100%;aspect-ratio:1;display:block;background:#FBF0E6;border-radius:9px}
.cell .cname{font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cost{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}

.cell.owned{opacity:.55;cursor:default}
.cell.placed{background:#DCEAC8}
.rar{position:absolute;top:3px;right:3px;min-width:22px;height:22px;border-radius:50%;
  border:2.5px solid var(--ink);color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 3px}
.tag{position:absolute;top:3px;left:3px;background:var(--leaf);color:#fff;border:2.5px solid var(--ink);
  border-radius:9px;font-size:13px;padding:0 5px;height:20px;display:flex;align-items:center}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:2.5px solid var(--ink);border-radius:12px;background:var(--hanji);
  font-family:inherit;font-size:17px;padding:5px 13px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--maehwa);font-weight:700}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);z-index:50;
  background:var(--ink);color:var(--hanji);padding:9px 18px;border-radius:20px;font-size:18px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#visitBar{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 74px);z-index:28;
  display:none;align-items:center;gap:8px;background:var(--hanji);border:2.5px solid var(--ink);
  border-radius:14px;padding:6px 8px 6px 14px;box-shadow:0 2px 0 rgba(61,58,54,.25)}
#visitBar.on{display:flex}
#visitBar #visitName{flex:1;font-size:17px;font-weight:700}
#visitBar button{border:2.5px solid var(--ink);border-radius:10px;background:var(--hanji-2);
  font-family:inherit;font-size:15px;padding:6px 12px;cursor:pointer}

.neighbor-row{width:100%;text-align:left;display:flex;align-items:center;gap:10px;
  border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji-2);
  padding:10px 12px;margin-bottom:10px;font-family:inherit;cursor:pointer}
.neighbor-row:last-child{margin-bottom:0}
.neighbor-row .nname{font-size:19px;font-weight:700;flex:1}
.neighbor-row .nchars{font-size:15px;color:#7A6E5E}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="plate" id="who">
      <span class="nameRow"><span class="name">푸믹</span><span class="grade" id="gradeTxt"></span></span>
    </div>
    <div class="plate" id="coinPlate"><svg class="pip" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#E8A33C" stroke="#3D3A36" stroke-width="2.4"/><rect x="8.6" y="8.6" width="6.8" height="6.8" rx="1.2" fill="#FBF3E4" stroke="#3D3A36" stroke-width="2"/></svg><span class="num" id="coinTxt">0</span></div>
    <button class="plate" id="topupBtn" aria-label="전 충전">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <div class="plate" id="growPlate" aria-label="성장수"><svg class="pip" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 C8 9 5 13 5 16.5 A7 7 0 0 0 19 16.5 C19 13 16 9 12 3 Z" fill="#7FC4EA" stroke="#3D3A36" stroke-width="2"/><ellipse cx="9.5" cy="14" rx="2" ry="3" fill="#BEE6F7"/></svg><span class="num" id="growTxt">0</span></div>
    <button class="plate" id="bgmBtn" aria-label="배경음악 켜고 끄기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="bgmIcon">
        <path d="M4 9v6h4l5 5V4L8 9H4Z"/><path d="M16.5 8a5 5 0 0 1 0 8"/>
      </svg>
    </button>
    <button class="plate" id="helpBtn" aria-label="글방 안내 다시 보기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9 C6 4 8 2 12 2 C16 2 18 4 18 9 Z" fill="#3D3A36"/>

/* ── 되짚기(간격 반복) ─────────────────────
   맞힌 횟수가 이어질수록 다시 만나는 날이 멀어진다.
   틀리면 처음으로 돌아간다.
   ---------------------------------------- */
const SRS_DAYS = [1, 3, 7, 16, 35, 90];
function nextDue(streak, now){
  const d = SRS_DAYS[Math.min(streak, SRS_DAYS.length - 1)];
  return (now || Date.now()) + d * 864e5;
}

  .map((t, i) => ({
    i,
    c: t[0],
    hun: t.slice(1, -1),
    um: t.slice(-1),
    gu: Math.floor(i / 8)          // 몇 번째 마디에 속하는가
  }));

const CHAR_INDEX = {};
CHEONJA.forEach(o => { CHAR_INDEX[o.c] = o; });

});

/* 글자 하나를 채점한 뒤 기록을 고쳐 준다. 급수는 이제 글자 하나가
   아니라 콘텐츠 완주로만 오르므로(checkRankUp 참고), 여기서는 급수를
   건드리지 않는다. */
function markChar(prog, ch, correct, now) {
  const r = prog.char[ch] || { n: 0, ok: 0, streak: 0, due: 0 };
  r.n++;
  if (correct) { r.ok++; r.streak++; }
  else { r.streak = 0; }
  r.due = correct ? nextDue(r.streak, now) : (now || Date.now()) + 864e5;
  prog.char[ch] = r;
  return r;
}

/* 오늘 되짚을 글자들. 익힌 적 있는 글자 중 기한이 찬 것만. */
function dueChars(prog, now, limit) {
  const t = now || Date.now();
  return Object.keys(prog.char)
    .filter(c => prog.char[c].due <= t)
    .sort((a, b) => prog.char[a].due - prog.char[b].due)
    .slice(0, limit || 12)
    .map(c => CHAR_INDEX[c]);
}

/* 한 족 안에서 이미 만난 글자만 추린다 (글자 축 화면용) */
function jokProgress(prog, jokId) {
  const j = JOK.find(x => x.id === jokId);
  const all = [...j.chars].filter(c => CHAR_INDEX[c]);
  const met = all.filter(c => prog.char[c]);
  return { jok: j, all, met, ratio: met.length / all.length };
}

/* ── 아이템 그림 ─────────────────────────
   media 항목이 없거나 'svg'면 지금처럼 it.svg 코드를 그대로 그린다.
   media가 'img'면 it.src 그림 파일을 it.box 크기에 맞춰 불러온다.
   그림 파일을 못 찾으면(아직 items 폴더에 넣지 않은 경우 등) 빈 칸 대신
   점선 칸과 "그림 없음" 글자를 보여준다. ------------------------------- */
function itemMedia(it){
  if(it.media!=='img') return it.svg;
  const [w,h]=it.box;
  return `<image href="${it.src}" xlink:href="${it.src}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"
      onerror="this.style.display='none';this.nextElementSibling.style.display=''"></image>
    <g style="display:none">
      <rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="#F3D9C4" stroke="#D9463F" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="${w/2}" y="${h/2}" text-anchor="middle" dominant-baseline="middle" font-family="Gaegu, sans-serif" font-size="13" fill="#D9463F">그림 없음</text>
    </g>`;
}

/* ── 학동의 급 ───────────────────────────
   정원이 자라는 모습에 빗댄 이름. 마디·대목 하나가 아니라 콘텐츠를
   통째로 마쳐야 배움 점수를 받고, 그 점수로 급이 오른다(익힌 글자
   수는 더 이상 급수에 쓰지 않는다). 급이 오르면 축하와 함께 전을 준다.
   ------------------------------------- */
const RANKS = [
  {name:'씨앗', min:0,  color:'#8B6A4E', bonus:0},
  {name:'새싹', min:7,  color:'#6FAE55', bonus:5},
  {name:'떡잎', min:15, color:'#3F9142', bonus:10},
  {name:'연두', min:25, color:'#9CB93C', bonus:20},
  {name:'초록', min:40, color:'#2A6B33', bonus:30},
  {name:'열매', min:60, color:'#C0392B', bonus:50}
];
/* 배움 점수: 콘텐츠 하나를 끝까지 마쳐야만 오른다.
   명심보감은 아직 열리지 않았으니 지금은 0점만 더한다(열리면 15점). */
function learnScore(){
  let s = 0;
  if(P.gu>=GUJEOL.length) s += 10;      // 천자문 125마디 완주
  if(P.hb.done.length>=10) s += 7;      // 박흥보전 10대목 완주
  return s;
}
function effScore(){ return learnScore() + (S.demoBoost||0); }
function rankOf(n){ let idx=0; for(let i=0;i<RANKS.length;i++) if(n>=RANKS[i].min) idx=i; return idx; }
/* 이미 쌓인 진도가 있으면(옛 글자 수 기준 급수였던 P.rankSeen) 급수가
   초기화되지 않도록, 화면에 보이는 급은 실제 점수와 P.rankSeen 중 더
   높은 쪽을 쓴다. */
function curRankIdx(){ return Math.max(rankOf(effScore()), P.rankSeen||0); }
function rankInfo(idx){
  const cur=RANKS[idx], next=RANKS[idx+1];
  return { idx, name:cur.name, color:cur.color, next: next?next.name:null };
}
if(S.demoBoost===undefined) S.demoBoost=0;
if(P.rankSeen===undefined) P.rankSeen=rankOf(learnScore());
let pendingRankUp=null;
function checkRankUp(){
  const idx=rankOf(learnScore());
  if(idx>(P.rankSeen||0)){
    let bonus=0;
    for(let i=(P.rankSeen||0)+1;i<=idx;i++) bonus+=RANKS[i].bonus;
    P.rankSeen=idx;
    if(bonus) S.coin+=bonus;
    save(); syncHUD();
    // 문제 풀이 화면을 덮어쓰지 않도록, 지금 펼친 창을 닫을 때 보여준다
    pendingRankUp={rank:RANKS[idx], bonus};
  }
}
function showRankUp(rank, bonus){
  openSheetRaw('급이 올랐습니다!');
  sheetBody.innerHTML = resBarHTML() + `
    <div class="hanja-card" style="padding:30px 16px">
      <div class="hint" style="margin-top:0">학동의 급이 올랐습니다</div>
      <div style="display:inline-block;padding:9px 26px;border-radius:16px;border:3px solid #3D3A36;
        background:${rank.color};color:#fff;font-size:30px;font-weight:700;margin:10px 0 12px">${rank.name}</div>
      ${bonus?`<div class="hint">축하 <b>${bonus.toLocaleString()}</b>전을 받았습니다</div>`:''}
    </div>`;
  if(bonus) queueReward({coin:bonus});
}
/* 발표용: 실제 배움 점수는 그대로 두고 화면에 보이는 급만 잠깐 올린다 */
function openRankDemo(){ openSheetRaw('급수 시험 (발표용)'); renderRankDemo(); }
function renderRankDemo(){
  sheetBody.innerHTML = `
    <p class="note">실제로 쌓인 배움 점수는 바뀌지 않습니다. 화면에 보이는 급만 잠깐 올려서 확인합니다.</p>
    <p class="note" style="font-weight:700">지금 표시되는 배움 점수: ${effScore()}점 (실제 ${learnScore()}점 + 시험 ${S.demoBoost}점)</p>
    <div class="choices">
      ${RANKS.map((r,i)=>`<button class="choice" data-rank="${i}">${r.name}급으로 (${r.min}점)</button>`).join('')}
      <button class="choice" data-rank="-1">시험 끄기(실제 값으로)</button>
    </div>`;
  sheetBody.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.rank;
    if(i<0){ S.demoBoost=0; save(); syncHUD(); renderRankDemo(); return; }
    S.demoBoost=Math.max(0, RANKS[i].min-learnScore());
    save(); syncHUD();
    showRankUp(RANKS[i], RANKS[i].bonus);
    if(RANKS[i].bonus){ S.coin+=RANKS[i].bonus; save(); syncHUD(); }
  }));
}

function fallSVG(kind){
  const f=FALL[kind]||FALL.petal; let out='<g>';
  for(let i=0;i<f.n;i++){
    const x=Math.round(Math.random()*400);
    const dur=(f.dur[0]+Math.random()*(f.dur[1]-f.dur[0])).toFixed(1);
    const delay=(Math.random()*16).toFixed(1);
    const dx=Math.round(Math.random()*80-40);
    const r=f.rmin+Math.random()*(f.rmax-f.rmin);

    out+=`<ellipse class="petal" cx="${x}" cy="0" rx="${r.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${c}"
      style="--dx:${dx}px;animation-duration:${dur}s;animation-delay:-${delay}s"/>`;

}

   굵은 검정 선 + 단색 면, 명암은 짙은 색을 겹쳐서, 발치에 타원 그림자.

const LINE = '#2B2620';
function shade(hex, amt){
  const n=parseInt(hex.replace('#',''),16);
  const clamp=v=>Math.max(0,Math.min(255,Math.round(v)));
  const r=clamp((n>>16&255)+amt), g=clamp((n>>8&255)+amt), b=clamp((n&255)+amt);
  return '#'+(0x1000000+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function woodLine(d,w,color){
  return `<path d="${d}" fill="none" stroke="${LINE}" stroke-width="${w+2.6}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function leafBlob(cx,cy,r,color){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="${LINE}" stroke-width="2.6"/>
    <circle cx="${(cx+r*0.28).toFixed(1)}" cy="${(cy+r*0.3).toFixed(1)}" r="${(r*0.55).toFixed(1)}" fill="${shade(color,-28)}"/>`;
}
function plantShadow(w,h){
  return `<ellipse cx="${w/2}" cy="${h}" rx="${(w*0.32).toFixed(1)}" ry="${Math.max(3,h*0.045).toFixed(1)}" fill="rgba(43,36,28,.28)"/>`;

   씨앗·새싹은 다른 화초와 비슷해도 되고, 떡잎부터 잎 모양(들쭉날쭉한
   국화잎)을 살리고, 봉오리·꽃은 뚜렷이 구별한다. 시든 모습은 줄기가
   처지고 색이 누렇게 빠진다. 크기는 씨앗 30x20 ~ 꽃 60x72(나무보다
   작음) — 앞서 정한 화초 크기 기준을 그대로 따름. -------------- */
function gukLeaf(cx,cy,rot,scale,color){
  const sw=(2.4/scale).toFixed(2), sw2=(1.3/scale).toFixed(2);
  return `<g transform="translate(${cx},${cy}) rotate(${rot}) scale(${scale})">
    <path d="M0 0 Q-8 -4 -10 -12 Q-3 -9 0 -15 Q3 -9 10 -12 Q8 -4 0 0 Z" fill="${color}" stroke="${LINE}" stroke-width="${sw}" stroke-linejoin="round"/>
    <path d="M0 -1 Q-2 -7 0 -13" fill="none" stroke="${shade(color,-30)}" stroke-width="${sw2}"/>
  </g>`;
}
function petalRing(cx,cy,n,rx,ry,color){
  let s='';
  for(let i=0;i<n;i++) s+=`<ellipse cx="${cx}" cy="${(cy-ry).toFixed(1)}" rx="${rx}" ry="${ry}" fill="${color}" stroke="${LINE}" stroke-width="1.7" transform="rotate(${(360/n*i).toFixed(1)} ${cx} ${cy})"/>`;
  return s;
}

  return plantShadow(30,20)

       <path d="M15 13 v-4" stroke="${LINE}" stroke-width="2" stroke-linecap="round"/>
       <circle cx="15" cy="8" r="3" fill="#F2C43C" stroke="${LINE}" stroke-width="1.8"/>`;

function nameplateScene(name, rk){

/* 정원에 놓인 것 하나하나를 「자리표(iid)」로 구별한다.
   자리표는 "물건종류__번호" 모양이고, 옛 저장 자료처럼 번호가 없으면
   물건종류 그 자체를 자리표로 본다 (깔개·길 등 한 개만 놓는 것들). */
function typeOf(iid){ return String(iid).split('__')[0]; }
function newIid(id){ S.seq=(S.seq||0)+1; return `${id}__${S.seq}`; }
function drawGarden(){
  const src = visiting ? visiting.placed : S.placed;
  const list = src.map(iid=>({iid,id:typeOf(iid),it:ITEMS[typeOf(iid)]})).filter(o=>o.it);
  const ground = list.filter(o=>o.it.slot==='ground')
    .sort((a,b)=>(a.it.gkind==='cover'?0:1)-(b.it.gkind==='cover'?0:1));
  const mid    = list.filter(o=>o.it.slot==='mid'||o.it.slot==='front');
  const air    = list.filter(o=>o.it.slot==='air');
  const p = posFor('garden');
  const pool = mid.map(o=>({y:spotOf(o.iid)[1], html:place(o)}))
    .concat([{y:p.y, html:avatarSVG(p.x,p.y)}])
    .concat(visiting ? [{y:545, html:avatarSVG(200,545,visiting.wear,false)}] : [])
    .sort((a,b)=>a.y-b.y);
  scene.innerHTML = village()
    + ground.map(place).join('')
    + pool.map(o=>o.html).join('')
    + air.map(o=> o.it.fall ? fallSVG(o.it.fall) : place(o)).join('')
    + (visiting
        ? nameplateScene(visiting.name, {color:RANKS[visiting.rankIdx].color, name:RANKS[visiting.rankIdx].name})
        : nameplateScene());
}
function spotOf(iid){
  const store = visiting ? (visiting.spot||{}) : S.spot;
  return store[iid] || ITEMS[typeOf(iid)].at;
}
function posFor(w){ return (visiting && w==='garden') ? visitPos : S.pos[w]; }
/* 물건은 바닥 기준점(spot)을 고정한 채 그 자리에서 SIZE_SCALE만큼
   커지거나 작아진다. ground(깔개·길)만은 화면을 꽉 채워야 하므로
   배율에서 뺀다. */
/* 씨앗·묘목은 물을 줄수록 자라서 그림과 크기가 바뀐다. 아직 국화
   (씨앗 대표)와 매화나무(묘목 대표)만 제 그림이 있어서, 나머지
   다섯 씨앗은 국화 단계를, 나머지 밤/감나무 묘목은 매화나무 단계를
   임시로 함께 쓴다(나중에 각자 그림이 생기면 이 표만 바꾸면 됨). */
function growStageIdx(iid){ return Math.min(4, Math.floor((S.growth[iid]||0)/3)); }
function growVisual(iid, growType){
  const table = growType==='seed' ? GUK_STAGES : PLUM_STAGES;
  const s = table[growStageIdx(iid)];
  return { box:[s.w,s.h], svg:s.draw(), name:s.name };
}
function placedTransform(iid){
  const it=ITEMS[typeOf(iid)], [sx,sy]=spotOf(iid);
  const [w,h] = it.grow ? growVisual(iid, it.grow).box : it.box;
  const ax = it.anchor==='bc' ? w/2 : 0;
  const s = it.slot==='ground' ? 1 : SIZE_SCALE;
  return `translate(${sx},${sy}) scale(${s}) translate(${-ax},${-h})`;
}
function place(o){
  const gv = o.it.grow ? growVisual(o.iid, o.it.grow) : null;
  const media = gv ? gv.svg : itemMedia(o.it);
  if(o.iid===waterFX){
    const [w,h] = gv ? gv.box : o.it.box;
    return `<g data-iid="${o.iid}" data-id="${o.id}" transform="${placedTransform(o.iid)}">
      <g class="plant-shake">${media}</g>${waterFxSVG(w,h)}</g>`;
  }
  return `<g data-iid="${o.iid}" data-id="${o.id}" transform="${placedTransform(o.iid)}">${media}</g>`;
}
/* 물조리개 — 둥근 몸통(놋쇠빛), 위로 굽은 손잡이, 앞으로 길게 뻗은
   주둥이, 끝에 구멍 뚫린 둥근 물뿌리개 머리. 붓는 자세 그대로를
   그려두고, 애니메이션은 이 자세 앞뒤로 살짝 들었다 내리는 정도만
   더한다(회전 기준점은 몸통 중심 = 이 그림의 (0,0)). */
function waterCanSVG(cx,cy){
  const brass='#C9A24A';
  return `<g transform="translate(${cx},${cy})"><g class="can">
    <ellipse cx="0" cy="0" rx="10" ry="8" fill="${brass}" stroke="${LINE}" stroke-width="2.6"/>
    <ellipse cx="2" cy="2" rx="7" ry="5" fill="${shade(brass,-30)}"/>
    <path d="M-8 -6 q-1 -14 8 -14 q9 0 7 9" fill="none" stroke="${LINE}" stroke-width="3" stroke-linecap="round"/>
    <path d="M-9 3 q-15 5 -23 17" fill="none" stroke="${LINE}" stroke-width="6.6" stroke-linecap="round"/>
    <path d="M-9 3 q-15 5 -23 17" fill="none" stroke="${brass}" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-32" cy="20" rx="6" ry="4.4" fill="${brass}" stroke="${LINE}" stroke-width="2.4" transform="rotate(28 -32 20)"/>
    <g fill="${LINE}">
      <circle cx="-34" cy="18.4" r=".7"/><circle cx="-31" cy="17.6" r=".7"/>
      <circle cx="-34.6" cy="21.4" r=".7"/><circle cx="-31.4" cy="22" r=".7"/><circle cx="-29" cy="19.4" r=".7"/>
    </g>
  </g></g>`;
}
function waterFxSVG(w,h){
  // 물뿌리개 주둥이(물이 실제로 떨어지는 자리)를 식물 너비의 한가운데(w/2)에
  // 맞춘다. 몸통(waterCanSVG의 translate 기준점)은 그 그림 그대로 주둥이보다
  // 오른쪽 위로 32,20만큼 물러나 있으므로, 몸통 자리를 주둥이 자리 + (32,20)로
  // 잡아주면 주둥이가 언제나 식물 크기와 상관없이 한가운데로 온다.
  const sx=(w/2).toFixed(1), sy='0';
  const cx=w/2+32, cy=-20;
  // 거의 수직으로 떨어지되, 안쪽/바깥쪽으로 살짝씩 퍼지도록 물방울마다
  // 다른 각도(fx: -1 안쪽 ~ 1 바깥쪽)를 준다
  const baseDdy=h*0.58, spread=w*0.16;
  const drop=(delay,jx,fx)=>{
    const ddx=(fx*spread).toFixed(1);
    const ddy=(baseDdy + Math.abs(fx)*h*0.05).toFixed(1);
    return `<ellipse class="drop2" cx="${(+sx+jx).toFixed(1)}" cy="${sy}" rx="3" ry="4.2"
      fill="#7FC4EA" stroke="${LINE}" stroke-width="1.3" style="--ddx:${ddx}px;--ddy:${ddy}px;animation-delay:${delay}s"/>`;
  };
  return `<g class="water-fx">${waterCanSVG(cx,cy)}${drop(.40,-3,-1)}${drop(.55,-1,-.35)}${drop(.70,1,.35)}${drop(.85,3,1)}</g>`;
}

/* ── 손가락 처리: 걷기 · 끌기 · 놓기 · 물주기 ───── */
let ptr=null, drag=null, watering=false, waterFX=null;
scene.addEventListener('pointerdown', e=>{
  const item = e.target.closest('[data-iid]');
  const act  = e.target.closest('[data-act]');
  ptr = { x:e.clientX, y:e.clientY, act, item, moved:false };
  if(where==='garden' && !S.locked && !placingId && !watering && !visiting && item && !ITEMS[item.dataset.id].fixed){
    const p=svgPoint(e), [ix,iy]=spotOf(item.dataset.iid);
    drag = { id:item.dataset.iid, g:item, ox:p.x-ix, oy:p.y-iy };
    item.classList.add('dragging');
    scene.setPointerCapture(e.pointerId);
  }
});
scene.addEventListener('pointermove', e=>{
  if(!ptr) return;
  if(!ptr.moved && Math.hypot(e.clientX-ptr.x, e.clientY-ptr.y)>6) ptr.moved=true;
  if(!drag || !ptr.moved) return;
  const p=svgPoint(e);
  S.spot[drag.id] = [Math.round(clamp(p.x-drag.ox,16,384)), Math.round(clamp(p.y-drag.oy,200,596))];
  drag.g.setAttribute('transform', placedTransform(drag.id));
});
scene.addEventListener('pointerup', e=>{
  const P=ptr, D=drag; ptr=null; drag=null;
  if(!P) return;
  if(D){
    D.g.classList.remove('dragging');
    if(P.moved){ save(); drawScene(); }
    return;
  }
  if(P.moved || walking) return;
  const p=svgPoint(e);
  if(watering && where==='garden'){
    const iid=P.item&&P.item.dataset.iid, it=iid&&ITEMS[typeOf(iid)];
    if(it && (it.plant || it.grow)){
      if(visiting) waterNeighborPlant(visiting, iid, it.name);
      else waterPlant(iid, it.name);
    } else toast('화초나 나무를 눌러 물을 주세요');
    return;
  }
  if(placingId){ dropItem(p.x, p.y); return; }
  if(P.act){
    const ax=+P.act.dataset.ax, ay=+P.act.dataset.ay, act=P.act.dataset.act;
    return walkTo(ax, ay, ()=>setTimeout(()=>doAct(act),180));
  }
  const [y0,y1,x0,x1]=FLOOR[where];
  walkTo(clamp(p.x,x0,x1), clamp(p.y,y0,y1));
});
scene.addEventListener('pointercancel', ()=>{
  if(drag) drag.g.classList.remove('dragging');
  ptr=null; drag=null;
});

function walkTo(x,y,done){
  const g=document.getElementById('hakdong'); if(!g){ done&&done(); return; }
  const p=posFor(where), sx=p.x, sy=p.y;
  const dx=x-sx, dist=Math.hypot(dx,y-sy);
  if(dist<3){ done&&done(); return; }
  const dur=Math.max(240,dist*9), flip=dx<0?-1:1, legs=document.getElementById('hakLegs');
  walking=true;
  const t0=performance.now();
  const tick=(t)=>{
    const k=Math.min(1,(t-t0)/dur);
    g.setAttribute('transform',`translate(${sx+(x-sx)*k},${sy+(y-sy)*k}) scale(${SIZE_SCALE*flip},${SIZE_SCALE})`);
    if(legs) legs.setAttribute('transform',`translate(0,${Math.abs(Math.sin((t-t0)/90))*-2.2})`);
    if(k<1) requestAnimationFrame(tick);
    else {
      if(legs) legs.setAttribute('transform','');
      walking=false;
      if(visiting && where==='garden') visitPos={x,y};
      else { S.pos[where]={x,y}; save(); }
      done&&done();
    }
  };
  requestAnimationFrame(tick);
}
function svgPoint(e){
  const pt=scene.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(scene.getScreenCTM().inverse());
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

});
const WATER_MS = 3200; // 물조리개가 기울었다 돌아오기까지 걸리는 시간
const GROW_BONUS = { seed:3, sapling:5 }; // 씨앗이 꽃을 피우면(3전)/묘목이 열매를 맺으면(5전) 주는 전
function waterPlant(iid, name){
  if(!(S.growWater>0)) return toast('성장수가 없습니다. 서당에서 익혀서 모으세요.');
  S.growWater--;
  waterFX=iid; drawScene();
  toast(`${name}에 물을 주었습니다 · 성장수 ${S.growWater}방울 남음`);
  if(!S.growth) S.growth={};
  const oldCnt=S.growth[iid]||0, newCnt=oldCnt+1;
  S.growth[iid]=newCnt;
  const it=ITEMS[typeOf(iid)];
  let laterMsg='', laterBonus=0;
  if(it.grow){
    const oldStage=Math.min(4,Math.floor(oldCnt/3)), newStage=Math.min(4,Math.floor(newCnt/3));
    if(newStage>oldStage){
      const table = it.grow==='seed' ? GUK_STAGES : PLUM_STAGES;
      laterMsg = `${name} — ${table[newStage].name} 단계가 되었습니다`;
      if(newStage===4){
        laterBonus=GROW_BONUS[it.grow];
        S.coin+=laterBonus; laterMsg += ` · ${laterBonus}전`;
      }
    }
  } else if(newCnt%3===0){
    laterMsg='무럭무럭 자랐습니다!'; // 기존 장식용 나무·화초는 그림은 안 바뀌고 알림만
  }
  save(); syncHUD();
  setTimeout(()=>{
    if(waterFX===iid){ waterFX=null; drawScene(); }
    if(laterMsg) toast(laterMsg);
    if(laterBonus) queueReward({coin:laterBonus});
  }, WATER_MS);
}
/* 이웃의 화초·나무는 자라지 않지만, 하루 한 번 물을 주면 답례로
   전을 받는다. 자리표(iid)별로 오늘 날짜를 적어 두어, 이웃마다
   화초마다 하루 한 번만 답례를 받게 한다. */
function waterNeighborPlant(nb, iid, name){
  if(!S.neighborWater) S.neighborWater={};
  const today=new Date().toISOString().slice(0,10);
  const done=S.neighborWater[nb.id]||{};
  if(done[iid]===today){ toast('오늘은 이미 물을 주었습니다'); return; }
  done[iid]=today; S.neighborWater[nb.id]=done;
  waterFX=iid; drawScene();
  const bonus=1;
  S.coin+=bonus; save(); syncHUD();
  queueReward({coin:bonus});
  toast(`${name}에 물을 주었습니다 · 답례로 ${bonus}전을 받았습니다`);
  setTimeout(()=>{ if(waterFX===iid){ waterFX=null; drawScene(); } }, WATER_MS);
}

/* ── 낱말 뜻 풍선 ───────────────────────────
   누른 낱말 바로 아래(모자라면 위)에 뜬다. 화면 좌우로는 넘치지 않게
   자리를 맞추고, 꼬리는 늘 그 낱말을 가리키게 --tail-x로 옮긴다.
   다른 곳을 누르거나 같은 낱말을 다시 누르면 사라진다(저절로는 안 사라짐). */
const wordBubble = document.getElementById('wordBubble');
let activeWordEl = null;
function hideWordBubble(){
  wordBubble.classList.remove('on');
  activeWordEl = null;
}
function showWordBubble(el, text){
  wordBubble.textContent = text;
  wordBubble.classList.add('on');
  const oRect = overlay.getBoundingClientRect();
  const wRect = el.getBoundingClientRect();
  const margin = 8;
  const bw = wordBubble.offsetWidth, bh = wordBubble.offsetHeight;
  let left = (wRect.left - oRect.left) + wRect.width/2 - bw/2;
  left = Math.max(margin, Math.min(left, oRect.width - bw - margin));
  const spaceBelow = oRect.bottom - wRect.bottom;
  const spaceAbove = wRect.top - oRect.top;
  const below = spaceBelow >= bh + 14 || spaceBelow >= spaceAbove;
  const top = below
    ? (wRect.bottom - oRect.top) + 8
    : (wRect.top - oRect.top) - bh - 8;
  wordBubble.style.left = `${left}px`;
  wordBubble.style.top = `${top}px`;
  wordBubble.classList.toggle('below', below);
  wordBubble.classList.toggle('above', !below);
  const tailX = (wRect.left - oRect.left) + wRect.width/2 - left - 6;
  wordBubble.style.setProperty('--tail-x', `${Math.max(10, Math.min(bw-22, tailX))}px`);
  activeWordEl = el;
}
/* 낱말이 아닌 다른 곳을 누르면 닫는다. 낱말 자체를 누른 클릭은 각
   낱말의 click 핸들러가 열고 닫는 것을 직접 맡으므로 여기서는 건드리지 않는다. */
document.addEventListener('click', e=>{
  if(!wordBubble.classList.contains('on')) return;
  if(e.target.closest('.bhword')) return;
  hideWordBubble();
});

document.getElementById('helpBtn').addEventListener('click', ()=>openSeodangIntro(true));

/* ── 지금 익히는 중 / 복습 중 ─────────────────
   복습은 이미 마친 마디를 다시 풀어 보는 것이라, 지금 진도(P)는
   조금도 건드리지 않는다. RV가 복습 중의 임시 자리다(저장하지 않음).
   틀린 글자의 되짚기 기록만은 진짜 자료(P.char)에 그대로 남긴다. */
let studyMode = 'normal'; // 'normal' | 'review'
let RV = { gu:0, stage:0, ci:0 };
function curGu(){ return studyMode==='review' ? RV.gu : P.gu; }
function curStage(){ return studyMode==='review' ? RV.stage : P.stage; }
function curCi(){ return studyMode==='review' ? RV.ci : P.ci; }
function setStage(v){ if(studyMode==='review') RV.stage=v; else P.stage=v; }
function setCi(v){ if(studyMode==='review') RV.ci=v; else P.ci=v; }

function stepBar(){
  const rk = rankInfo(curRankIdx());
  const modeBadge = studyMode==='review'
    ? `<span class="grade" style="background:#8AB566">복습</span>`
    : `<span class="grade" style="background:${rk.color}">${rk.name}</span>`;
  return `<div class="studyhead">
      ${modeBadge}
      <span class="coin">${COIN_SVG}${S.coin.toLocaleString()}</span>
      <span class="coin">${GROW_SVG}${(S.growWater||0).toLocaleString()}</span>
    </div>
    <div class="steps">${STAGES.map((s,k)=>
      `<span class="${k<curStage()?'past':k===curStage()?'now':''}" ${k<curStage()?`data-stage="${k}"`:''}>${s.name}</span>`).join('')}</div>`;
}
/* 지나온 단계를 누르면 그 단계로 돌아간다(앞으로는 못 건너뜀) */
function bindStepBar(){
  sheetBody.querySelectorAll('.steps span.past').forEach(el=>{
    el.addEventListener('click', ()=>{
      setStage(+el.dataset.stage);
      setCi(0);
      save(); renderStudy();
    });
  });
}
function guTitle(g){ return `<div class="gu">${g.gu1}   ${g.gu2}</div>`; }

function renderStudy(){
  if(studyMode==='review'){
    const g=GUJEOL[RV.gu];
    const fn=[stSeongdok, stGeulja, stSori, stTteut, stBaesong][RV.stage];
    return fn(g);
  }
  if(P.gu>=GUJEOL.length){
    sheetBody.innerHTML=`<div class="hanja-card"><div class="hanja">終</div>
      <div class="hunum">천자문 백스물다섯 마디를 다 마쳤습니다.</div></div>
      <p class="note">익힌 글자는 글자 익힘책에서 계속 되짚을 수 있습니다. 마디 목록에서
      아무 마디나 다시 복습할 수도 있습니다.</p>
      <button class="subbtn" id="toList">마디 목록으로</button>
      <button class="subbtn" id="resetStudy">처음 마디부터 다시</button>`;
    document.getElementById('toList').addEventListener('click', openGujeolList);
    document.getElementById('resetStudy').addEventListener('click',()=>{
      P.gu=0; P.stage=0; P.ci=0; save(); syncHUD(); renderStudy();
    });
    return;
  }
  const g=GUJEOL[P.gu];
  const fn=[stSeongdok, stGeulja, stSori, stTteut, stBaesong][P.stage];
  fn(g);
}
const GROW_PER_GUJEOL = 3; // 한 마디를 배송까지 마치면 받는 성장수
const GUJEOL_COIN = 1;     // 한 마디를 배송까지 마치면 받는 전(단계별로는 안 준다)
const REVIEW_GROW = 2;     // 복습에서 배송까지 마치면 받는 성장수(전은 안 줌)
function passStage(g, coin){
  if(studyMode==='review'){
    setStage(curStage()+1);
    if(curStage()>=STAGES.length){
      S.growWater=(S.growWater||0)+REVIEW_GROW;
      save(); syncHUD();
      queueReward({grow:REVIEW_GROW});
      toast(`복습을 마쳤습니다 · 성장수 ${REVIEW_GROW}방울`);
      return renderReviewDone(g);
    }
    save(); syncHUD(); renderStudy();
    return;
  }
  const msg=[]; const reward={};
  if(coin){ S.coin+=coin; msg.push(`${coin}전`); reward.coin=(reward.coin||0)+coin; }
  P.stage++;
  if(P.stage>=STAGES.length){
    if(!P.done.includes(P.gu)) P.done.push(P.gu);
    P.gu++; P.stage=0; P.ci=0;
    S.coin+=GUJEOL_COIN;
    S.growWater=(S.growWater||0)+GROW_PER_GUJEOL;
    msg.push(`${GUJEOL_COIN}전 · 성장수 ${GROW_PER_GUJEOL}방울`);
    reward.coin=(reward.coin||0)+GUJEOL_COIN;
    reward.grow=GROW_PER_GUJEOL;
    checkRankUp(); // 125마디를 다 마쳤으면 여기서 급수가 오른다
  }
  if(msg.length) toast(msg.join(' · '));
  queueReward(reward);
  save(); syncHUD(); renderStudy();
}

/* ── 마디 목록 ────────────────────────────
   천자문 두루마리를 누르면 여기부터 보여준다. 마친 마디는 복습으로
   다시 들어갈 수 있고, 지금 마디는 눈에 띄게 보이며, 아직 안 간
   마디는 잠겨 있다. 열 마디씩 묶어 스크롤로 내려볼 수 있다. */
let openGroups=new Set();
function openGujeolList(){
  studyMode='normal';
  const curGroup = P.gu<GUJEOL.length ? Math.floor(P.gu/10) : -1;
  openGroups = new Set(curGroup>=0 ? [curGroup] : []);
  openSheetRaw('천자문');
  renderGujeolList();
}
function gujeolStatus(g){
  if(P.done.includes(g)) return 'done';
  if(g===P.gu) return 'current';
  return 'locked';
}
const LOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex:0 0 auto;color:#9C917F"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const CHEV_SVG='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function gujeolRowHTML(g){
  const st=gujeolStatus(g.g);
  const badge = st==='current' ? '<span class="badge2 now">지금</span>'
    : st==='done' ? '<span class="badge2 done">복습</span>' : LOCK_SVG;
  return `<button class="gurow ${st}" data-g="${g.g}" ${st==='locked'?'disabled':''}>
    <span class="gunum">${g.g+1}</span>
    <span class="gutext"><b>${g.gu1} ${g.gu2}</b><br><small>${g.mean}</small></span>
    ${badge}</button>`;
}
function renderGujeolList(){
  const finished = P.gu>=GUJEOL.length;
  const groups=[];
  for(let i=0;i<GUJEOL.length;i+=10) groups.push(GUJEOL.slice(i,i+10));
  sheetBody.innerHTML = `
    <p class="note" style="margin:0 2px 12px">${finished
      ? '백스물다섯 마디를 다 마쳤습니다. 아무 마디나 다시 복습할 수 있습니다.'
      : `${P.done.length}마디 마침 · 지금 ${P.gu+1}번째 마디를 익히는 중`}</p>
    ${groups.map((grp,gi)=>{
      const startNum=gi*10+1, endNum=Math.min((gi+1)*10, GUJEOL.length);
      const isOpen=openGroups.has(gi);
      const hasCurrent=grp.some(g=>g.g===P.gu) && !finished;
      const doneCount=grp.filter(g=>P.done.includes(g.g)).length;
      const groupSub = hasCurrent ? '지금 익히는 중' : `${doneCount}/${grp.length}마침`;
      return `<div class="gugroup">
        <button class="grouphead ${isOpen?'open':''}" data-gi="${gi}">
          <span class="grouptitle">${startNum}~${endNum}마디</span>
          <span class="groupsub">${groupSub}</span>
          ${CHEV_SVG}
        </button>
        ${isOpen?`<div class="gulist">${grp.map(gujeolRowHTML).join('')}</div>`:''}
      </div>`;
    }).join('')}`;
  sheetBody.querySelectorAll('.grouphead').forEach(el=>
    el.addEventListener('click',()=>{
      const gi=+el.dataset.gi;
      if(openGroups.has(gi)) openGroups.delete(gi); else openGroups.add(gi);
      renderGujeolList();
    }));
  sheetBody.querySelectorAll('.gurow:not([disabled])').forEach(el=>
    el.addEventListener('click',()=>enterGujeol(+el.dataset.g)));
}
function enterGujeol(g){
  const st=gujeolStatus(g);
  if(st==='locked') return;
  if(st==='current'){ studyMode='normal'; return renderStudy(); }
  studyMode='review';
  RV={gu:g, stage:0, ci:0};
  renderStudy();
}
function renderReviewDone(g){
  sheetBody.innerHTML=`
    <div class="hanja-card">
      <div class="hunum">복습을 마쳤습니다.</div>
      ${guTitle(g)}
      <div class="mean">${g.mean}</div>
      <div class="hint">성장수 ${REVIEW_GROW}방울을 받았습니다</div>
    </div>
    <button class="bigbtn" id="again">이 마디 다시 복습</button>
    <button class="subbtn" id="toList">마디 목록으로</button>`;
  document.getElementById('again').addEventListener('click',()=>{
    RV={gu:g.g, stage:0, ci:0}; renderStudy();
  });
  document.getElementById('toList').addEventListener('click', openGujeolList);
}

    `"그 일 되게 해 주십시오."`,
    `흥보가 선금으로 닷 냥을 받아 집에 돌아와 자랑하니, 아내가 펄쩍 뛰며 말했다.`,
    `"남의 죄로 매를 맞다니요. 가지 마오, 가지 마오."`,
    `"여보게, 볼기짝을 어디에 쓰겠는가. 정승이 되었으면 가마에 앉아 볼까, 판서가 되었으면 수레에 앉아 볼까. 이 몸이 곤궁하니 매품이나 팔아야지."`,
    `흥보가 대지팡이를 짚고 이틀을 걸어 병영에 이르러, 갓을 벗어 놓고 제 상투를 제가 잡고 미리 엎드리며 말했다.`,
    `"여보시오, 이 볼기를 살펴보시고 가만가만 때려 주시오."`,
    `사령들이 기가 막혀 물었다.`,
    `"이놈, 너는 웬 놈이냐?"`,
    `"좌수 대신 매를 맞으러 왔소."`,
    `"아뿔싸, 늦었구나. 아까 어떤 놈이 곤장 열 대를 얼른 맞고 삼십 냥을 받아 갔다. 벌써 이삼십 리는 갔을 것이다."`,
    `흥보가 하늘을 우러러 탄식하고는, 갓을 벗어 등에 지고 울며 돌아왔다.`
  ],
  5: [
    `흥보 부부가 서로 붙들고 울고 있을 때, 어디선가 노스님 한 분이 내려왔다. 누비장삼에 띠를 두르고 송낙을 눌러쓴 채 붉은 지팡이를 흔들며 내려오더니, 문 앞에 이르러 말했다.`,
    `"소승 문안드립니다. 이 댁은 어이하여 우십니까?"`,
    `흥보가 노스님을 보고 공손히 대답했다.`,
    `"부모를 일찍 여의고 살림이 빈곤하여 조상의 제사도 지내지 못합니다. 그것이 서러워 웁니다."`,
    `스님이 공손히 말했다.`,
    `"착한 일을 쌓는 집에는 반드시 경사가 남습니다. 악한 일을 쌓는 집에는 반드시 재앙이 남습니다. 마음을 옳게 먹고 그른 일을 하지 않으면 뒷날 좋은 때를 볼 것입니다. 소승을 따라오십시오. 집터 하나를 잡아 드리겠습니다."`,
    `흥보가 반겨 듣고 뒤를 따라가니, 스님이 지팡이로 이리 짚고 저리 짚다가 한 곳을 덜컥 짚으며 말했다.`,
    `"여기에 집을 지으면 부귀영화가 날 것입니다. 글 잘하는 자손도 날 자리입니다."`,
    `그러고는 두어 걸음 걷더니 홀연히 사라졌다. 흥보가 공중을 향해 여러 번 절을 하고, 움막을 뜯어다가 그 터에 옮겨 지었다.`
  ],
  6: [
    `이듬해 봄, 제비 한 쌍이 흥보의 집을 찾아 펄펄 날아들었다. 흥보가 좋아하며 말했다.`,
    `"얼씨구나 저 제비야. 우리 집이 가난하여 찾아오는 이가 없더니 네가 나를 찾아왔구나. 어찌 아니 기특하랴."`,
    `제비가 처마에 집을 짓고 새끼를 까서 나는 법을 익힐 무렵이었다. 뜻밖에 구렁이 한 마리가 기어들어 새끼를 하나 둘 셋 모두 삼키는데, 그때 한 마리가 둥지에서 뚝 떨어져 두 다리가 부러지고 말았다. 거의 죽게 된 것이었다.`,
    `흥보가 어진 마음으로 제비를 두 손에 받쳐 들고 말했다.`,
    `"주인이 잘못한 것이냐, 네 신수가 사나운 것이냐. 뱀의 밥이 될 뻔하였으니 어찌 아니 가엾으랴."`,
    `약을 개어 다리에 고루 바르고 오색 실로 곱게 감아 제 집에 넣어 주었더니, 며칠이 지나자 부러진 다리가 감쪽같이 붙었다. 제비가 다시 날아오르니 흥보가 좋아하며 말했다.`,
    `"얼씨구 좋을시고. 죽게 되었던 것이 봄을 만나 살아가는구나."`,
    `구월 구일이 되어 제비가 강남으로 돌아가게 되니, 흥보가 서운하여 몇 마디 일러 보냈다.`,
    `"부러졌던 다리가 시원찮다고 한하지 마라. 멀고 먼 강남길에 부디 조심해서 잘 가거라."`
  ],
  7: [
    `제비가 강남에 이르러 옥황상제 앞에 나아가니, 상제가 물었다.`,
    `"네 두 다리가 어이하여 성하지 않고 저 모양이 되었느냐?"`,
    `제비가 여쭈었다.`,
    `"조선의 박흥보를 주인 삼아 오 형제가 잘 지냈습니다. 그런데 뜻밖에 난을 만나 삼 형제는 죽고, 저도 두 다리가 부러져 거의 죽게 되었습니다. 주인 흥보가 어진 사람이라 부러진 다리를 이어 주어 살아왔습니다. 부디 그 은혜를 갚게 해 주십시오."`,
    `옥황상제가 듣고 칭찬하며 말했다.`,
    `"박흥보의 어진 명망이 온 세상에 퍼졌다더니 헛말이 아니로구나. 이듬해 봄에 박씨 하나를 물어다가 그 은혜를 갚아 주어라."`,
    `제비가 분부를 받고 물러나 봄을 기다렸다. 겨울이 가고 삼월이 되자 온갖 제비가 다 나오는데, 저 제비도 박씨 하나를 물고 구름을 헤치며 날아올랐다. 압록강을 얼른 건너고 대동강 위를 높이 떠서 개성을 지나, 마침내 흥보의 집을 찾아들었다.`,
    `제비가 이리저리 날다가 물었던 박씨를 데구루루 굴려 놓으니, 흥보 아내가 반겨 집어 들고 말했다.`,
    `"여보세요, 우리 제비가 박씨를 물어 왔어요."`,
    `흥보가 살펴보니 '은혜를 갚는다'는 글자가 뚜렷이 새겨져 있었다. 거름을 섞은 좋은 흙에 정성껏 심었더니, 사월 남풍이 부는 좋은 철이 되자 박이 점점 자라 세 통이 열렸는데, 어찌나 큰지 배를 엎어 놓은 것 같았다.`
  ],
  8: [
    `박 세 통을 따다 놓으니 어찌나 소담한지 보기만 해도 배가 불렀다. 흥보 부부가 큰 톱을 걸고 박을 타는데`,
    `"시르렁 시르렁 톱질이야, 어여라 톱질이야."`,
    `흥보 아내가 노래를 부르며 말했다.`,
    `"이 박에서 돈도 말고 쌀도 말고 밥 한 섬만 나오면 좋겠네. 우리 자식들 배불리 먹인 뒤에 남은 밥은 내가 다 먹어 보면, 그날로 죽어도 남은 한이 없겠네."`,
    `이렇게 한참 흥에 겨워 톱질을 하다가`,
    `"아이고, 배고파라."`,
    `소리 한 번 내고는 톱 잡은 손이 스르르 풀리더니 그대로 쓰러지는 것이었다. 흥보가 기가 막혀 흔들어 보니 참으로 죽은 듯하였다. 흥보가 목을 놓아 울고 있을 때, 이웃에 사는 부인이 미음 한 그릇을 보내 주었다. 그것을 아내의 입에 조금씩 흘려 넣었더니, 기절했던 사람이라 이윽고 숨을 쉬며 도로 살아났다.`,
    `"얼씨구나 잘되었네. 여보, 전보다 더 예뻐졌구나."`,
    `정신을 차려 다시 박을 타니, 박이 쩍 갈라지며 상자 둘이 나왔다. 하나를 열어 보니 쌀이 가득하고, 또 하나를 열어 보니 돈이 가득했다. 쌀도 비우고 돈도 비우고 톡톡 털었는데, 다시 열어 보니 쌀도 도로 가득 돈도 도로 가득 차 있었다. 부어 내고 또 부어 내어 세어 보니 쌀이 일만 팔천 섬, 돈이 일만 팔천 냥이었다.`,
    `둘째 박을 타니 온갖 비단이 쏟아졌다. 그 뒤로 금과 은과 진주와 산호가 여드레 동안 계속 나왔다. 흥보 아내가 붉은 비단으로 옷을 지어 입고 물었다.`,
    `"자, 어떠합니까?"`,
    `"영락없이 고추잠자리가 되었구나."`,
    `셋째 박을 타니 푸른 옷을 입은 아이 둘이 나와 절을 하고, 죽은 사람을 살리는 약과 늙지 않는 풀을 내어 놓고는 홀연히 사라졌다. 그 뒤로 목수들이 줄지어 나오더니, 터를 다듬고 기둥을 세워 눈 깜짝할 사이에 육십여 간이나 되는 큰 집을 지어 놓았다.`,
    `흥보는 새집에 세간을 들이고, 동쪽에는 소나무를 심고 서쪽에는 대나무를 심었다. 헐벗은 사람에게 옷을 주고 굶주린 사람에게 밥을 주니, 어진 명망이 온 세상에 퍼졌다.`
  ],
  9: [
    `놀보가 아우 잘되었다는 말을 듣고 밤낮으로 속을 끓였다.`,
    `"이놈의 재물을 어떻게 빼앗을까. 내가 가 보아서 내 말을 듣지 않으면 세간을 다 부수고 오겠다."`,
    `놀보가 흥보의 집을 찾아가니, 움막은 간데없고 큰 기와집이 찬란하게 서 있었다. 사랑으로 들어가며 말했다.`,
    `"허허 그놈, 사랑을 매우 잘 꾸며 놓았구나."`,
    `거드름을 잔뜩 피우며 한 발 썩 걸어가다가 장판방에 미끄러져 뒤통수가 터지게 자빠졌다. 흥보의 자식들이 나와 인사를 하니 놀보가 말했다.`,
    `"야, 그놈들 눈꼴을 보니 도적질은 잘하겠다."`,
    `흥보가 술상을 들이니 놀보가 말했다.`,
    `"여봐라, 네 아내더러 권주가 한 마디 부르라고 해라."`,
    `흥보 아내가 이 말을 듣고 말했다.`,
    `"아이고, 이게 웬 말입니까. 온 세상을 다 다녀도 제수더러 권주가를 시킨다는 말은 못 들었습니다. 굶어 죽게 되었을 때는 아주버님도 헛것이더니. 어서 가세요. 무슨 낯으로 오셨습니까."`,
    `놀보가 분을 내다가 방 안을 둘러보았다.`,
    `"저 윗목에 있는 저것은 무엇이냐?"`,
    `"그것은 화초장입니다."`,
    `"야, 그것 나를 다오."`,
    `놀보가 화초장을 얻어 지고 좋아하며 걸어가는데`,
    `"화초장, 화초장."`,
    `그러다 도랑을 건너뛰는 사이에 이름을 깜박 잊고는 뒤죽박죽으로 외기 시작했다.`,
    `"배장화, 초장화."`,
    `아무리 생각해도 알 수가 없어 그대로 집에 들어가니, 아내가 물었다.`,
    `"그것이 무엇입니까?"`,
    `"알록달록하니 이것 얼쑹장이오."`,
    `"옳지 옳지, 얼쑹장이라고 하더라."`,
    `놀보는 흥보에게서 부자가 된 내력을 듣고, 제비 새끼를 잡으려고 집에 그물을 둘러쳤다. 이듬해 봄에 제비 한 쌍이 놀보 집을 찾아드니, 놀보가 기뻐 날뛰며 새끼가 자라기를 기다렸다. 그러다 새끼의 다리를 두 손으로 잡아 무릎에 대고 뚝 부러뜨렸다.`,
    `"우리 제비 다리가 부러졌네."`,
    `찰밥에 된장을 섞어 실로 칭칭 감아 제 집에 넣어 두고 말했다.`,
    `"여봐라 저 제비야. 내년 봄에 부디 좋은 박씨로 골라 오너라."`
  ],
  10: [
    `이듬해 봄, 제비가 박씨 하나를 물어다 놓으니 놀보가 반겨 주워 들었다. 놀보 아내가 씨에 새겨진 글자를 보고 말했다.`,
    `"여덟 팔 자에 바람 풍 자를 새겼습니다. 팔풍이 일어나면 집안이 망할 테니 내다 버리세요."`,
    `"방정맞은 사람 같으니. 바람 풍 자가 얼마나 좋은 글자인 줄 아느냐. 잔말 말고 심어나 보세."`,
    `심었더니 박이 무성하게 열려 일만 사천 통이나 되었는데, 놀보가 손질을 잘못하여 다 떨어지고 다섯 통만 남았다.`,
    `놀보가 일꾼 여남은 명을 사서 박을 타는데, 첫째 통을 타니 양반 하나가 튀어나오며 소리쳤다.`,
    `"이놈 놀보야. 네 할아버지와 할머니가 모두 우리 댁 종이었다. 상전을 몰라보느냐. 속전을 바쳐라."`,
    `놀보가 천 냥을 바치니 홀연히 사라졌다. 둘째 통을 타니 수염이 허연 영감이 나와 주머니를 벌렸다.`,
    `"무엇이든 내 주머니에 채워 다오."`,
    `한 냥을 넣어도 간데없고 백 냥을 넣어도 간데없어, 오백 냥을 넣고서야 겨우 보냈다. 셋째 통에서는 사당패 수십 명이 나와 노래하고 춤을 추니, 놀보가 삼십 냥 오십 냥씩 주어 보냈다. 넷째 통에서는 상여꾼들이 상여를 메고 나오며 외쳤다.`,
    `"이놈 놀보야. 어서 몸채를 뜯어라. 우리 댁 산소를 모시겠다."`,
    `놀보가 가진 돈을 모두 털어 바쳤으나 그것도 간데없이 사라졌다.`,
    `마지막 통을 끌로 뚫어 보니 금가락지가 보이거늘, 놀보가 좋아하는 그 순간 박통이 쩍 벌어지며 장수 하나가 긴 창을 들고 나왔다.`,
    `"이놈 놀보야. 탁군 땅의 장익덕을 아느냐 모르느냐."`,
    `우레 같은 소리에 산천이 무너지는 듯하니, 놀보가 넋을 잃고 엎드려 빌었다.`,
    `"비나이다, 비나이다. 장군님 전에 비나이다. 부모의 도리를 몰라보고 형제의 정을 저버렸습니다. 이제 뉘우쳤으니 살려 주십시오."`,
    `이때 흥보가 이 말을 듣고 급히 건너와, 형의 목을 안고 울며 말했다.`,
    `"장군님, 살려 주십시오. 부모 대신 모실 형입니다. 형을 죽이실 테면 저를 죽여 주십시오."`,
    `장수가 말했다.`,
    `"네 죄를 네가 이미 안다고 하고, 또 네 아우를 보아 살려 주는 것이다. 앞으로는 명심하여라."`,
    `그러고는 홀연히 사라졌다. 놀보는 흥보를 따라 건너가 마음을 고쳐먹고, 그 뒤로 형제가 우애 있게 지내니 세상 사람이 모두 칭찬하였다.`
  ]
};

/* 낱말마다 본문에서 맨 처음 나오는 자리 하나에만 밑줄을 건다 */
function bhAnnotate(paragraphs, glossary){
  const used = new Set();
  return paragraphs.map(p=>{
    let html = p;
    glossary.forEach((g, gi)=>{
      if(used.has(gi)) return;
      const idx = html.indexOf(g.match);
      if(idx<0) return;
      used.add(gi);
      html = html.slice(0,idx) + `<span class="bhword" data-gi="${gi}">${g.match}</span>` + html.slice(idx+g.match.length);
    });
    return html;
  });
}
let bhReading = null; // 지금 줄글을 읽고 있는 대목 번호(안 읽는 중이면 null)
function leaveBhReading(){
  if(bhReading==null) return;
  sheetBody.onscroll = null;
  save();
  bhReading = null;
}
function renderBhSection(n){
  const s=BH_SECTIONS.find(x=>x.n===n);
  openSheetRaw(`박흥보전 · ${s.title}`);
  bhReading = n;
  const rp = P.hb.read[n] || (P.hb.read[n] = {scroll:0, reachedEnd:false});
  const body = bhAnnotate(BH_TEXT[n], BH_GLOSSARY[n]).map(p=>`<p style="margin:0 0 16px;font-size:18px;line-height:1.8">${p}</p>`).join('');
  sheetBody.innerHTML = resBarHTML() + `
    ${body}
    <button class="bigbtn" id="bhQuizBtn" ${rp.reachedEnd?'':'hidden'}>퀴즈 풀기</button>
    <button class="subbtn" id="bhBack">대목 목록으로</button>`;
  sheetBody.querySelectorAll('.bhword').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    if(activeWordEl===el){ hideWordBubble(); return; }
    const g=BH_GLOSSARY[n][+el.dataset.gi];
    showWordBubble(el, `${g.label} — ${g.mean}`);
  }));
  document.getElementById('bhBack').addEventListener('click', ()=>{
    leaveBhReading(); openBakheungbo();
  });
  document.getElementById('bhQuizBtn').addEventListener('click', ()=>{
    leaveBhReading();
    startBhQuiz(n);
  });
  sheetBody.onscroll = ()=>{
    rp.scroll = sheetBody.scrollTop;
    if(!rp.reachedEnd && sheetBody.scrollTop + sheetBody.clientHeight >= sheetBody.scrollHeight - 24){
      rp.reachedEnd = true;
      document.getElementById('bhQuizBtn').hidden = false;
      save();
    }
  };
  sheetBody.scrollTop = rp.scroll; // 읽던 자리로 곧장 돌아간다
  // 짧은 대목은 스크롤할 것이 없어 스크롤 이벤트가 아예 안 일어나므로,
  // 처음부터 다 보이는 경우 곧장 다 읽은 것으로 친다.
  if(!rp.reachedEnd && sheetBody.scrollHeight <= sheetBody.clientHeight + 24){
    rp.reachedEnd = true;
    document.getElementById('bhQuizBtn').hidden = false;
    save();
  }
}

const BH_PRIZES = {
  1: ['hb_grudgepouch'],
  2: ['hb_strawhut'],
  3: ['hb_oldhat'],
  4: ['hb_cane'],
  5: ['hb_monkstaff'],
  6: ['hb_swallownest'],
  7: ['hb_seedpouch'],
  8: ['hb_gourdvine','hb_silkscroll'],
  9: ['hb_flowerchest'],
  10: ['hb_pavilion']
};
function startBhQuiz(n){
  const quiz = BH_QUIZ[n];
  const order = shuffle(quiz.map((q,i)=>i));
  let qi=0, got=0;
  const draw=()=>{
    if(qi>=order.length) return finish();
    const q=quiz[order[qi]];
    sheetBody.innerHTML = resBarHTML() + `
      <div class="hanja-card">
        <div class="hint">${qi+1} / ${order.length}</div>
        <p style="margin:8px 0;font-size:18px;line-height:1.6;white-space:pre-line">${q.q}</p>
      </div>
      <div class="choices">${q.opts.map(o=>`<button class="choice" data-o="${o}">${o}</button>`).join('')}</div>
      <div id="after"></div>`;
    sheetBody.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
      const ok=b.dataset.o===q.answer;
      sheetBody.querySelectorAll('.choice').forEach(x=>{
        x.disabled=true; if(x.dataset.o===q.answer) x.classList.add('right');
      });
      if(ok){
        got++;
        setTimeout(()=>{ qi++; draw(); }, 500);
        return;
      }
      b.classList.add('wrong');
      document.getElementById('after').innerHTML = `
        <div class="verdict wrong">아닙니다 — 정답은 "${q.answer}"</div>
        <p class="note">${q.note}</p>
        <button class="bigbtn" id="nx">다음</button>`;
      document.getElementById('nx').addEventListener('click',()=>{ qi++; draw(); });
    }));
  };
  const finish=()=>{
    const passMark = order.length-1;
    const bonus = got>=passMark ? 1 : 0;
    const coin = GUJEOL_COIN + bonus;
    const firstTime = !P.hb.done.includes(n);
    S.coin += coin; S.growWater=(S.growWater||0)+GROW_PER_GUJEOL;
    let prizeMsg = '';
    if(firstTime){
      P.hb.done.push(n);
      const prizeIds = BH_PRIZES[n]||[];
      prizeIds.forEach(id=>{ S.owned[id]=(S.owned[id]||0)+1; });
      const names = prizeIds.map(id=>`「${ITEMS[id].name}」`).join('과 ');
      if(names) prizeMsg = `<div class="hint">${names}을 정원보따리에서 쓸 수 있습니다.</div>`;
      checkRankUp(); // 10대목을 다 마쳤으면 여기서 급수가 오른다
    }
    save(); syncHUD();
    queueReward({coin, grow:GROW_PER_GUJEOL});
    sheetBody.innerHTML = resBarHTML() + `
      <div class="hanja-card">
        <div class="hunum">${order.length}문제 중 ${got}개를 맞혔습니다.</div>
        <div class="hint">${coin}전${bonus?` (${passMark}개 이상 맞혀 1전 더)`:''} · 성장수 ${GROW_PER_GUJEOL}방울</div>
        ${prizeMsg}
      </div>
      <button class="bigbtn" id="again">다시 풀기</button>
      <button class="subbtn" id="bhBack2">대목 목록으로</button>`;
    document.getElementById('again').addEventListener('click', ()=>startBhQuiz(n));
    document.getElementById('bhBack2').addEventListener('click', openBakheungbo);
  };
  draw();
}

/* ── 들이기 화면의 소리 내어 읽기 ─────────────
   발음의 정확함은 가리지 않는다. 마이크로 잠깐 들어서 소리를 냈는지만
   확인하고, 냈으면 전을 조금 더 준다. 마이크가 없는 기기에서는
   버튼 자체를 숨기고, 권한을 거부해도 학습은 그대로 이어진다. */
const MIC_BONUS = 1;
function micSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
const MIC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4M8 22h8"/></svg>';
function micRowHTML(){
  if(!micSupported() || studyMode==='review') return ''; // 복습에서는 전을 주지 않는다
  if(P.readAloudGu===P.gu)
    return `<button class="subbtn done" disabled>${MIC_ICON}소리 내어 읽었습니다 · ${MIC_BONUS}전 받음</button>`;
  return `<button class="subbtn" id="micBtn">${MIC_ICON}소리 내어 읽기</button>`;
}
let stopActiveMic=null;
/* stream을 짧게 듣다가, 소리가 문턱을 넘으면 true, 조용히 시간이
   다 차면 false, 마이크를 못 쓰거나 권한이 없으면 null을 준다. */
function listenForVoice(onResult){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const start = Date.now(), DURATION=3000, THRESHOLD=14;
    let done=false;
    stopActiveMic = (heard)=>{
      if(done) return; done=true;
      stopActiveMic=null;
      stream.getTracks().forEach(t=>t.stop());
      ctx.close().catch(()=>{});
      onResult(heard===undefined?false:heard);
    };
    (function tick(){
      if(done) return;
      analyser.getByteTimeDomainData(data);
      let sum=0;
      for(let i=0;i<data.length;i++) sum+=Math.abs(data[i]-128);
      if(sum/data.length>THRESHOLD) return stopActiveMic(true);
      if(Date.now()-start>DURATION) return stopActiveMic(false);
      requestAnimationFrame(tick);
    })();
  }).catch(()=>onResult(null));
}
function bindMicBtn(){
  const btn=document.getElementById('micBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    btn.disabled=true; btn.classList.add('listening');
    btn.innerHTML = MIC_ICON+'듣는 중…';
    listenForVoice(heard=>{
      if(heard===true){
        S.coin+=MIC_BONUS; P.readAloudGu=P.gu; save(); syncHUD();
        toast(`소리 내어 읽었습니다 · ${MIC_BONUS}전`);
        renderStudy();
      } else {
        toast(heard===null ? '마이크를 쓸 수 없습니다. 그냥 넘어가도 됩니다.'
                            : '소리가 들리지 않았어요. 다시 눌러 보세요.');
        btn.disabled=false; btn.classList.remove('listening');
        btn.innerHTML = MIC_ICON+'소리 내어 읽기';
      }
    });
  });
}

      <div class="hunum">${o.hun} □</div>
    </div>
    <p class="note">이 글자의 음을 적어 보세요.</p>
    <div class="answer"><input id="um" type="text" inputmode="text" maxlength="2"
      autocomplete="off" autocapitalize="off" aria-label="음">
      <button class="bigbtn" id="ck" style="margin:0;width:auto;padding:14px 22px">확인</button></div>
    <div id="after"></div>`;
  bindStepBar();
  const inp=document.getElementById('um');
  inp.focus();
  const check=()=>{
    const v=(inp.value||'').trim();
    if(!v) return;
    if(v===o.um){ markChar(P,o.c,true); save(); reveal(true); }
    else { markChar(P,o.c,false); save(); reveal(false); }
  };
  document.getElementById('ck').addEventListener('click',check);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });

  function reveal(ok){
    inp.disabled=true;
    document.getElementById('ck').disabled=true;
    const after=document.getElementById('after');
    if(ok){
      after.innerHTML=`<div class="verdict right">${o.hun} ${o.um}</div>`;
      setTimeout(next, 500);
      return;
    }
    const opts=shuffle([o, ...shuffle(CHEONJA.filter(x=>x.um!==o.um)).slice(0,3)]);
    after.innerHTML=`<div class="verdict wrong">아직입니다. 보기에서 골라 보세요.</div>
      <div class="choices">${opts.map(x=>
        `<button class="choice" data-u="${x.um}">${o.hun} ${x.um}</button>`).join('')}</div>`;
    after.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
      const okPick=b.dataset.u===o.um;
      if(!okPick){ b.disabled=true; b.classList.add('wrong'); return; } // 틀리면 남은 보기에서 다시 고른다
      after.querySelectorAll('.choice').forEach(x=>x.disabled=true);
      b.classList.add('right');
      after.insertAdjacentHTML('beforeend', `<div class="verdict right">${o.hun} ${o.um}</div>`);
      setTimeout(next, 500);
    }));
  }
  function next(){
    setCi(curCi()+1);
    if(curCi()>=8){ setCi(0); passStage(g, STAGES[1].coin); }
    else { save(); renderStudy(); }
  }
}

/* 3 소리 — 여덟 자를 다 보여주고 그중 한 자만 가려 맞힌다.
   앞 넉 자를 맞히면 곧장 뒤 넉 자로, 뒤 넉 자까지 맞히면 곧장 다음 단계로 넘어간다.
   틀렸을 때만 "다시" 버튼을 보여주고 같은 문제를 다시 낸다. */
function stSori(g){
  const draw=(half)=>{
    const k=Math.floor(Math.random()*4);
    const blankIndex=(half?4:0)+k;
    const ans=g.chars[blankIndex];
    const opts=shuffle([ans, ...shuffle(CHEONJA.filter(x=>x.c!==ans.c)).slice(0,3)]);
    render(half, blankIndex, ans, opts);
  };
  const render=(half, blankIndex, ans, opts)=>{
    sheetBody.innerHTML=stepBar()+`
      <div class="hanja-card">
        <div class="grid8">${g.chars.map((o,n)=>
          `<div class="ja ${n===blankIndex?'blank':''}"><b>${n===blankIndex?'□':o.c}</b></div>`).join('')}</div>
        <div class="hunum">${ans.hun} ${ans.um}</div>
      </div>
      <p class="note">빈자리에 들어갈 글자를 고르세요.</p>
      <div class="choices">${opts.map(x=>`<button class="choice ja-opt" data-c="${x.c}">${x.c}</button>`).join('')}</div>
      <div id="after"></div>`;
    bindStepBar();
    sheetBody.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
      const ok=b.dataset.c===ans.c;
      sheetBody.querySelectorAll('.choice').forEach(x=>{
        x.disabled=true; if(x.dataset.c===ans.c) x.classList.add('right');
      });
      if(!ok) b.classList.add('wrong');
      markChar(P,ans.c,ok); save();
      if(ok){
        document.getElementById('after').innerHTML=`<div class="verdict right">맞혔습니다</div>`;
        setTimeout(()=>{
          if(half){ setCi(0); passStage(g, STAGES[2].coin); }
          else { setCi(1); save(); draw(1); }
        }, 500);
      } else {
        document.getElementById('after').innerHTML=
          `<div class="verdict wrong">아닙니다</div><button class="bigbtn" id="nx">다시</button>`;
        document.getElementById('nx').addEventListener('click',()=>render(half, blankIndex, ans, opts));
      }
    }));
  };
  draw(curCi()<1?0:1);
}

/* 4 뜻 — 여덟 자 한 마디의 풀이를 고른다 */
function stTteut(g){
  const others=shuffle(GUJEOL.filter(x=>x.g!==g.g)).slice(0,3);
  const opts=shuffle([g,...others]);
  sheetBody.innerHTML=stepBar()+`
    <div class="hanja-card">${guTitle(g)}
      <div class="grid8 small">${g.chars.map(o=>

    </div>
    <p class="note">이 마디의 풀이로 알맞은 것을 고르세요.</p>
    <div class="choices">${opts.map(x=>
      `<button class="choice" data-g="${x.g}">${x.mean}</button>`).join('')}</div>
    <div id="after"></div>`;
  bindStepBar();
  sheetBody.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{

    });

/* 5 배송 — 책을 덮고 여덟 자를 차례대로 놓는다 */
function stBaesong(g){
  let put=[];
  const pool=shuffle(g.chars);
  const draw=()=>{
    sheetBody.innerHTML=stepBar()+`
      <div class="hanja-card">
        <div class="hint">책을 덮고 차례대로 놓으세요</div>
        <div class="slots">${Array.from({length:8},(_,n)=>
          `<span class="${n<put.length?'on':''}">${n<put.length?put[n]:'□'}</span>`
          + (n===3?'<em></em>':'')).join('')}</div>
      </div>
      <div class="pick">${pool.map(o=>
        `<button class="ja-opt" data-c="${o.c}" ${put.includes(o.c)?'disabled':''}>${o.c}</button>`).join('')}</div>
      <div id="after"></div>`;
    bindStepBar();
    sheetBody.querySelectorAll('.pick button').forEach(b=>
      b.addEventListener('click',()=>tap(b.dataset.c)));
  };
  const tap=(c)=>{
    const want=g.chars[put.length].c;
    if(c===want){
      put.push(c);
      markChar(P,c,true);
      if(put.length===8){ save(); return done(true); }
      draw();
    } else {
      markChar(P,c,false); save(); done(false);
    }
  };
  const done=(ok)=>{
    draw();
    document.getElementById('after').innerHTML= ok
      ? `<div class="verdict right">외웠습니다.</div>
         <div class="mean">${g.mean}</div>
         <button class="bigbtn" id="nx">다음 마디로</button>`
      : `<div class="verdict wrong">차례가 어긋났습니다. 다시 해 보세요.</div>
         <div class="gu">${g.gu1}   ${g.gu2}</div>
         <button class="bigbtn" id="nx">다시</button>`;
    sheetBody.querySelectorAll('.pick button').forEach(b=>b.disabled=true);
    document.getElementById('nx').addEventListener('click',()=>{
      if(ok) passStage(g, STAGES[4].coin);
      else { put=[]; draw(); }
    });
  };
  draw();
}

const DUE_CHAR_GROW=1;   // 되짚기에서 한 글자를 맞힐 때마다 즉시 주는 성장수
const DUE_TALLY_GOAL=5;  // 다섯 글자를 맞힐 때마다 전 하나로 바꿔 준다(0.2전씩 대신)
function runReview(list){
  let n=0, got=0, earnedCoin=0;
  const step=()=>{
    if(n>=list.length){
      sheetBody.innerHTML=`<div class="hanja-card">
          <div class="hunum">${list.length}자 되짚었습니다.</div>
          <div class="hint">맞힌 것 ${got}자${earnedCoin?` · ${earnedCoin}전`:''} · 성장수 ${got}방울</div></div>
        <button class="bigbtn" id="bk">글자 익힘책으로</button>`;
      document.getElementById('bk').addEventListener('click',renderJok);
      return;
    }
    const o=list[n];
    sheetBody.innerHTML= resBarHTML() + `
      <div class="hanja-card">
        <div class="hint">되짚기 ${n+1} / ${list.length}</div>
        <div class="hanja">${o.c}</div>
        <div class="hunum">${o.hun} □</div>
      </div>
      <p class="note">음을 적어 보세요.</p>
      <div class="answer"><input id="um" type="text" maxlength="2" autocomplete="off" aria-label="음">
        <button class="bigbtn" id="ck" style="margin:0;width:auto;padding:14px 22px">확인</button></div>
      <div id="after"></div>`;
    const inp=document.getElementById('um'); inp.focus();
    const check=()=>{
      const v=(inp.value||'').trim(); if(!v) return;
      const ok=v===o.um;
      if(ok){
        got++;
        S.growWater=(S.growWater||0)+DUE_CHAR_GROW;
        const reward={grow:DUE_CHAR_GROW};
        S.dueTally=(S.dueTally||0)+1;
        if(S.dueTally>=DUE_TALLY_GOAL){
          S.dueTally=0; S.coin+=1; earnedCoin+=1; reward.coin=1;
        }
        queueReward(reward);
      }
      markChar(P,o.c,ok); save(); syncHUD();
      inp.disabled=true; document.getElementById('ck').disabled=true;
      const goNext=()=>{ n++; step(); };
      if(ok){
        document.getElementById('after').innerHTML=`<div class="verdict right">맞혔습니다 — ${o.hun} ${o.um}</div>`;
        setTimeout(goNext, 500);
      } else {
        document.getElementById('after').innerHTML=
          `<div class="verdict wrong">아니요 — ${o.hun} ${o.um}</div>
           <button class="bigbtn" id="nx">다음</button>`;
        document.getElementById('nx').addEventListener('click', goNext);
      }
    };
    document.getElementById('ck').addEventListener('click',check);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
  };
  step();
}

const PACK_NAME = { all:'사철 두는 것', spring:'매화 핀 언덕', summer:'연꽃 뜬 못',
                    autumn:'단풍 드는 뜰', winter:'눈 내린 뜰' };

/* 계절마다 「이렇게 꾸미면 이런 그림이 된다」는 모범 배치.
   울타리·사립문·길은 어느 계절에나 깔리는 틀로 함께 넣는다. */
const FRAME = ['mhs_04','mhs_12','mhs_23','mhs_24'];
const PACK_SAMPLE = {
  all:    ['mhs_04','mhs_12','mhs_23','mhs_24','mhs_22','mhs_15','mhs_13','mhs_16','mhs_20'],
  spring: FRAME.concat(['mhs_07','mhs_08','mhs_09','mhs_10','mhs_11','mhs_21','mhs_17','spr_08']),
  summer: FRAME.concat(['sum_06','sum_05','sum_02','sum_01','sum_03','sum_04','sum_07']),
  autumn: FRAME.concat(['aut_06','aut_01','aut_02','aut_03','aut_04','aut_05','aut_07']),
  winter: FRAME.concat(['win_06','win_01','win_02','win_03','win_04','win_05','win_07'])
};
function placeAt(o){
  const it=o.it, [w,h]=it.box; let [x,y]=it.at;
  if(it.anchor==='bc'){ x-=w/2; y-=h; } else y-=h;
  return `<g transform="translate(${x},${y})">${itemMedia(it)}</g>`;
}
function packPreview(season){
  const list=(PACK_SAMPLE[season]||[]).map(id=>({id,it:ITEMS[id]})).filter(o=>o.it);
  const ground=list.filter(o=>o.it.slot==='ground')
    .sort((a,b)=>(a.it.gkind==='cover'?0:1)-(b.it.gkind==='cover'?0:1));
  const body=list.filter(o=>o.it.slot==='mid'||o.it.slot==='front')
    .sort((a,b)=>a.it.at[1]-b.it.at[1]);
  const air=list.filter(o=>o.it.slot==='air');
  // 흩날리는 것은 미리보기에서 멈춰 세워 세 군데에 흩뿌린다
  const airHtml=air.map(o=>o.it.fall
    ? `<g transform="translate(4,296) scale(1.5)">${itemMedia(o.it)}</g>
       <g transform="translate(190,430) scale(1.3)">${itemMedia(o.it)}</g>
       <g transform="translate(300,320) scale(1.2)">${itemMedia(o.it)}</g>`
    : placeAt(o)).join('');
  return `<svg class="preview" viewBox="0 264 400 336" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="${PACK_NAME[season]} 꾸민 모습">
    <rect x="0" y="258" width="400" height="40" fill="#C6D89C"/>${emptyLand()}${ground.map(placeAt).join('')}${body.map(placeAt).join('')}${airHtml}</svg>`;
}
/* 목록·읽기·퀴즈 등 여러 화면 위쪽에 늘 붙는 재화 표시(전·성장수).
   덮개(overlay)가 떠 있을 때 보상이 이 자리로 날아가는 기준점이 된다. */

function cellHTML(id,mode){
  const it=ITEMS[id], cnt=ownedCount(id), onCnt=placedCount(id);
  const [w,h]=it.box, m=Math.max(w,h);
  const tag = mode==='shop'
    ? (cnt?`<span class="tag">보유 ${cnt}</span>`:'')
    : (cnt?`<span class="tag">${onCnt}/${cnt}</span>`:'');
  const body = `<span class="rar" style="background:${RAR_COLOR[it.rar]}">${it.rar}</span>
    ${tag}
    <svg class="thumb" viewBox="${(w-m)/2} ${(h-m)/2} ${m} ${m}">${itemMedia(it)}</svg>
    <div class="cname">${it.name}</div>`;
  const foot = mode==='shop'
    ? `${COIN_SVG}${it.amt.toLocaleString()}전${it.pack?` · ${it.pack}개`:''}`
    : (onCnt<cnt?'정원에 놓기':'거두기');
  return `<button class="cell ${mode==='bag'&&onCnt?'placed':''}" data-id="${id}">
    ${body}
    <div class="cost">${foot}</div></button>`;
}
function buy(id){
  const it=ITEMS[id];
  if(S.coin<it.amt) return toast('전이 모자랍니다');
  S.coin-=it.amt;
  S.owned[id]=(S.owned[id]||0)+(it.pack||1);
  save(); syncHUD();
  if(activeShopRender) activeShopRender();
  toast(`${it.name} — 정원보따리에 넣었습니다 (${S.owned[id]}개)`);
}
