<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>K-서당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3D3A36;
  --hanji:#FBF3E4;
  --hanji-2:#F2E4CB;
  --maehwa:#F0A8BE;
  --maehwa-d:#D9718F;
  --leaf:#6E9A50;
  --wood:#B08F6A;
  --wood-d:#7A5F45;
  --tile:#9C8874;
  --coin:#E8A33C;
  --gem:#7FA9C9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2B2620}
body{
  font-family:'Gaegu',system-ui,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{
  position:relative;width:100%;height:100%;
  max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  background:#FDF3E9;overflow:hidden;
}

/* ── 상단 정보 ───────────────────────────── */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:30;
  display:flex;gap:6px;align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 0;
  pointer-events:none;
}
.plate{
  background:var(--hanji);
  border:2.5px solid var(--ink);
  border-radius:14px;
  padding:4px 10px;
  display:flex;align-items:center;gap:6px;
  font-size:17px;line-height:1.1;
  box-shadow:0 2px 0 rgba(61,58,54,.25);
}
.plate .num{font-weight:700;font-size:19px}
#who{flex-direction:column;align-items:flex-start;gap:1px;padding:5px 12px}
#who .name{font-weight:700;font-size:18px}
#who .rank{font-size:15px;color:#7A6E5E}
.bar{width:86px;height:8px;background:var(--hanji-2);border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;background:var(--maehwa);width:0%}
.pip{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);flex:0 0 auto}
.pip.coin{background:var(--coin)}
.pip.gem{background:var(--gem)}

/* ── 무대 ───────────────────────────────── */
#stage{flex:1;position:relative;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.tapzone{cursor:pointer}

.signpost text{font-family:'Gaegu',sans-serif;font-weight:700}

/* 문 위 알림 */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.badge-bob{animation:bob 1.6s ease-in-out infinite}

/* 꽃비 */
@keyframes fall{
  0%{transform:translate(0,-30px) rotate(0deg);opacity:0}
  10%{opacity:.9}
  100%{transform:translate(var(--dx),660px) rotate(340deg);opacity:0}
}
.petal{animation:fall linear infinite}

@media (prefers-reduced-motion:reduce){
  .petal,.badge-bob{animation:none}
}

/* ── 하단 이동 ──────────────────────────── */
#nav{
  position:relative;z-index:20;
  display:flex;
  background:var(--hanji);
  border-top:3px solid var(--ink);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
}
#nav button{
  flex:1;background:none;border:0;padding:4px 0 2px;
  font-family:inherit;font-size:16px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;border-radius:10px;position:relative;
}
#nav button:focus-visible{outline:3px solid var(--maehwa-d);outline-offset:-2px}
#nav button svg{width:26px;height:26px}
#nav button .dot{
  position:absolute;top:2px;right:calc(50% - 18px);
  width:9px;height:9px;border-radius:50%;
  background:#D9463F;border:2px solid var(--hanji);
}

/* ── 덮개 화면 ──────────────────────────── */
#overlay{
  position:absolute;inset:0;z-index:40;
  display:none;flex-direction:column;
  background:var(--hanji);
}
#overlay.on{display:flex}
.sheet-top{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  border-bottom:3px solid var(--ink);
  background:var(--hanji-2);
}
.sheet-top h1{margin:0;font-size:22px;font-weight:700;flex:1}
.iconbtn{
  width:38px;height:38px;flex:0 0 auto;
  border:2.5px solid var(--ink);border-radius:12px;
  background:var(--hanji);font-family:inherit;font-size:20px;
  cursor:pointer;line-height:1;
}
.sheet-body{flex:1;overflow-y:auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 20px)}

/* 서당 */
.hanja-card{
  background:var(--hanji-2);border:3px solid var(--ink);border-radius:18px;
  padding:22px 16px;text-align:center;
}
.hanja{font-size:96px;line-height:1;font-weight:700;letter-spacing:.02em}
.hunum{font-size:26px;margin-top:10px}
.hint{font-size:17px;color:#7A6E5E;margin-top:4px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{
  border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji);
  padding:12px;font-family:inherit;font-size:20px;cursor:pointer;text-align:left;
}
.choice:disabled{cursor:default}
.choice.right{background:#CFE7BE}
.choice.wrong{background:#F3CFCF}
.bigbtn{
  width:100%;margin-top:16px;padding:14px;
  border:3px solid var(--ink);border-radius:16px;
  background:var(--maehwa);font-family:inherit;font-size:22px;font-weight:700;
  cursor:pointer;box-shadow:0 3px 0 var(--ink);
}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bigbtn[disabled]{background:var(--hanji-2);color:#9C917F;box-shadow:none;cursor:default}
.note{font-size:17px;color:#7A6E5E;margin:10px 2px 0;line-height:1.5}

/* 저잣거리 */
.packhead{
  border:3px solid var(--ink);border-radius:16px;overflow:hidden;margin-bottom:14px;
}
.packhead .strip{padding:10px 14px;background:var(--maehwa);border-bottom:3px solid var(--ink)}
.packhead h2{margin:0;font-size:22px;font-weight:700}
.packhead .sub{padding:8px 14px;font-size:17px;background:var(--hanji-2);color:#6B6154}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{
  border:2.5px solid var(--ink);border-radius:14px;background:var(--hanji-2);
  padding:6px;cursor:pointer;position:relative;font-family:inherit;text-align:center;
}
.cell .thumb{width:100%;aspect-ratio:1;display:block;background:#FBF0E6;border-radius:9px}
.cell .cname{font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cost{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.cell .cost i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.cell.owned{opacity:.55}
.cell.owned .cost{color:#7A6E5E;font-weight:400}
.rar{
  position:absolute;top:3px;right:3px;
  min-width:22px;height:22px;border-radius:50%;
  border:2.5px solid var(--ink);color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}
#toast{
  position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);
  z-index:50;background:var(--ink);color:var(--hanji);
  padding:9px 18px;border-radius:20px;font-size:18px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

    <path d="M-14 -64 q0 -16 14 -16 q14 0 14 16 q-6 -7 -14 -7 q-8 0 -14 7 Z" fill="${A.hair}"/>
    <circle cx="-5" cy="-60" r="1.9" fill="${A.hair}"/>
    <circle cx="5" cy="-60" r="1.9" fill="${A.hair}"/>
    <ellipse cx="-9" cy="-56" rx="3" ry="1.8" fill="#F3A9A0" opacity=".8"/>
    <ellipse cx="9" cy="-56" rx="3" ry="1.8" fill="#F3A9A0" opacity=".8"/>
    <path d="M-2.5 -55 q2.5 2 5 0" fill="none" stroke="${A.hair}" stroke-width="1.4" stroke-linecap="round"/>
  </g>`;
}

/* ── 정원 그리기 ────────────────────────── */
const scene = document.getElementById('scene');

function drawGarden(){
  const placed = S.owned.map(id => ({id, it: ITEMS[id]})).filter(o => o.it);
  const layerZ = {wall:2, ground:3, mid:4, front:5, air:6};
  const bg = placed.filter(o => o.it.slot==='wall' || o.it.slot==='ground')
                   .sort((a,b) => layerZ[a.it.slot] - layerZ[b.it.slot]);
  const mid = placed.filter(o => o.it.slot==='mid' || o.it.slot==='front');
  const air = placed.filter(o => o.it.slot==='air');

  // 중경/전경 + 아바타는 y 순서로 함께 정렬한다
  const pool = mid.map(o => ({y:o.it.at[1], html:place(o)}))
    .concat([{y:S.avatar.y, html:avatarSVG()}])
    .sort((a,b) => a.y - b.y);

  scene.innerHTML = `
    ${sky()}
    ${farHills()}
    ${bg.map(place).join('')}
    ${gateSeodang()}
    ${gateMarket()}
    ${pool.map(p => p.html).join('')}
    ${air.map(place).join('')}
    ${petals()}
    <rect id="floor" x="0" y="330" width="400" height="270" fill="transparent" class="tapzone"/>
  `;
  scene.appendChild(scene.querySelector('#floor')); // 바닥 탭 영역을 맨 위로
  bindScene();
}

function place(o){
  const it = o.it, [w,h] = it.box;
  let [x,y] = it.at;
  if (it.anchor === 'bc'){ x -= w/2; y -= h; }
  else y -= h;
  return `<g transform="translate(${x},${y})">${it.svg}</g>`;
}

function sky(){
  return `<rect width="400" height="600" fill="#FDF3E9"/>
    <circle cx="330" cy="52" r="28" fill="#FFF3D8"/>
    <ellipse cx="80" cy="58" rx="58" ry="17" fill="#FFFAF3"/>
    <ellipse cx="220" cy="40" rx="44" ry="13" fill="#FFFAF3"/>
    <ellipse cx="310" cy="112" rx="38" ry="11" fill="#FFFAF3"/>`;
}
function farHills(){
  return `<path d="M0 214 L92 168 L164 206 L246 172 L344 210 L400 190 V266 H0Z" fill="#AEBCA4"/>
    <path d="M0 232 L112 190 L206 228 L296 194 L400 226 V266 H0Z" fill="#8FA88A"/>`;
}

/* 서당으로 나가는 일각대문 */
function gateSeodang(){
  return `<g class="tapzone" data-gate="seodang" role="button" aria-label="서당으로 가기">
    <rect x="248" y="150" width="104" height="112" fill="transparent"/>
    <rect x="262" y="196" width="76" height="60" fill="#8A6A4E"/>
    <rect x="272" y="206" width="56" height="50" rx="3" fill="#5E4632"/>
    <path d="M272 206 h56" stroke="#7A5B41" stroke-width="2"/>
    <rect x="256" y="188" width="88" height="12" rx="3" fill="#B08F6A"/>
    <path d="M244 186 q56 -34 112 0 Z" fill="#6F6258"/>
    <path d="M238 188 q62 -42 124 0 q-16 7 -62 7 q-46 0 -62 -7 Z" fill="#8B7D71"/>
    <path d="M262 176 q38 -20 76 0" stroke="#6F6258" stroke-width="2" fill="none"/>
    <rect x="278" y="158" width="44" height="20" rx="4" fill="#3D3A36"/>
    <text x="300" y="174" text-anchor="middle" font-family="Gaegu, serif" font-size="16" font-weight="700" fill="#F2E4CB">書堂</text>
    <g class="badge-bob"><circle cx="344" cy="158" r="13" fill="#D9463F" stroke="#3D3A36" stroke-width="2.5"/>
    <text x="344" y="164" text-anchor="middle" font-family="Gaegu, sans-serif" font-size="16" font-weight="700" fill="#FFF">${S.todayLeft}</text></g>
  </g>`;
}

/* 저잣거리로 나가는 사립문 */
function gateMarket(){
  return `<g class="tapzone" data-gate="market" role="button" aria-label="저잣거리로 가기">
    <rect x="52" y="176" width="96" height="86" fill="transparent"/>
    <g stroke="#96764F" stroke-width="5" stroke-linecap="round">
      <path d="M66 258 V204"/><path d="M82 258 V202"/><path d="M98 258 V204"/><path d="M114 258 V202"/><path d="M130 258 V206"/>
    </g>
    <g stroke="#B08F6A" stroke-width="4.5" stroke-linecap="round">
      <path d="M58 218 H138"/><path d="M58 240 H138"/>
    </g>
    <rect x="56" y="192" width="86" height="9" rx="4" fill="#7A5F45"/>
    <path d="M62 192 v-10 M136 192 v-10" stroke="#7A5F45" stroke-width="6" stroke-linecap="round"/>
    <rect x="70" y="164" width="58" height="22" rx="5" fill="#C9A87C" stroke="#3D3A36" stroke-width="2.5"/>
    <text x="99" y="181" text-anchor="middle" font-family="Gaegu, sans-serif" font-size="16" font-weight="700" fill="#3D3A36">저잣거리</text>
  </g>`;
}

function petals(){
  let out = '<g id="petalLayer">';
  for (let i=0;i<14;i++){
    const x = Math.round(Math.random()*400);
    const dur = (7 + Math.random()*6).toFixed(1);
    const delay = (Math.random()*10).toFixed(1);
    const dx = Math.round((Math.random()*80)-40);
    const r = 4 + Math.random()*2.5;
    out += `<ellipse class="petal" cx="${x}" cy="0" rx="${r.toFixed(1)}" ry="${(r*0.66).toFixed(1)}"
      fill="${Math.random()>.5?'#F0A8BE':'#FBD8E2'}"
      style="--dx:${dx}px;animation-duration:${dur}s;animation-delay:-${delay}s"/>`;
  }
  return out + '</g>';
}

/* ── 아바타 이동 ────────────────────────── */
let walking = false;
function walkTo(x, y, done){
  const g = document.getElementById('hakdong');
  if (!g) return;
  const dx = x - S.avatar.x;
  const dist = Math.hypot(dx, y - S.avatar.y);
  const dur = Math.max(260, dist * 9);
  const flip = dx < 0 ? -1 : 1;
  walking = true;
  g.style.transition = `transform ${dur}ms linear`;
  g.setAttribute('transform', `translate(${x},${y}) scale(${flip},1)`);
  const legs = document.getElementById('hakLegs');
  const t0 = performance.now();
  const step = (t) => {
    if (t - t0 > dur){ if(legs) legs.setAttribute('transform',''); walking=false; S.avatar={x,y}; save(); done&&done(); return; }
    if (legs) legs.setAttribute('transform', `translate(0,${Math.abs(Math.sin((t-t0)/90))*-2.2})`);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  // transform 속성은 style transition을 타지 않으므로 직접 보간
  g.style.transition = '';
  const sx = S.avatar.x, sy = S.avatar.y;
  const anim = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    g.setAttribute('transform', `translate(${sx+(x-sx)*k},${sy+(y-sy)*k}) scale(${flip},1)`);
    if (k < 1) requestAnimationFrame(anim);
  };
  requestAnimationFrame(anim);
}

function bindScene(){
  scene.querySelectorAll('[data-gate]').forEach(g => {
    g.addEventListener('click', () => {
      if (walking) return;
      const which = g.dataset.gate;
      const target = which === 'seodang' ? {x:300,y:300} : {x:99,y:300};
      walkTo(target.x, target.y, () => setTimeout(() => openSheet(which), 220));
    });
  });
  const floor = scene.querySelector('#floor');
  floor.addEventListener('click', (e) => {
    if (walking) return;
    const p = svgPoint(e);
    walkTo(clamp(p.x, 24, 376), clamp(p.y, 340, 588));
  });
}
function svgPoint(e){
  const pt = scene.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(scene.getScreenCTM().inverse());
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ── 화면 전환 ──────────────────────────── */
const overlay = document.getElementById('overlay');
const sheetTitle = document.getElementById('sheetTitle');
const sheetBody = document.getElementById('sheetBody');

function openSheet(which){
  if (which === 'garden'){ closeSheet(); return; }
  overlay.classList.add('on');
  if (which === 'seodang'){ sheetTitle.textContent = '서당'; renderSeodang(); }
  else if (which === 'market'){ sheetTitle.textContent = '저잣거리 · 꽃전'; renderMarket(); }
  else if (which === 'items'){ sheetTitle.textContent = '보따리'; renderItems(); }
  else { sheetTitle.textContent = '이웃'; sheetBody.innerHTML = `<p class="note">아직 이웃이 없습니다. 정원이 어느 정도 꾸며지면 이웃의 정원을 구경하러 갈 수 있습니다.</p>`; }
}
function closeSheet(){ overlay.classList.remove('on'); drawGarden(); }
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.querySelectorAll('#nav button').forEach(b => {
  b.addEventListener('click', () => openSheet(b.dataset.go));
});

/* ── 서당 ───────────────────────────────── */
let quizIdx = null;
function renderSeodang(){
  if (S.todayLeft <= 0){
    sheetBody.innerHTML = `<div class="hanja-card"><div class="hunum">오늘 몫은 다 익혔습니다.</div>
      <div class="hint">내일 다시 오세요.</div></div>
      <p class="note">진도는 엽전으로도 잎새로도 앞당길 수 없습니다. 익힌 만큼만 나아갑니다.</p>`;
    return;
  }
  quizIdx = S.learned % CHEONJA.length;
  const q = CHEONJA[quizIdx];
  const wrongs = CHEONJA.filter((_,i) => i !== quizIdx).sort(() => Math.random()-.5).slice(0,3);
  const opts = [q, ...wrongs].sort(() => Math.random()-.5);
  sheetBody.innerHTML = `
    <div class="hanja-card">
      <div class="hanja">${q.c}</div>
      <div class="hunum">${q.hun} ${q.um}</div>
      <div class="hint">천자문 ${quizIdx+1}번째 글자 · 오늘 ${S.todayLeft}자 남음</div>
    </div>
    <p class="note">뜻과 소리를 눈에 익힌 뒤, 아래에서 골라보세요.</p>
    <div class="choices">
      ${opts.map(o => `<button class="choice" data-c="${o.c}">${o.hun} ${o.um}</button>`).join('')}
    </div>`;
  sheetBody.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const ok = btn.dataset.c === q.c;
      sheetBody.querySelectorAll('.choice').forEach(b => {
        b.disabled = true;
        if (b.dataset.c === q.c) b.classList.add('right');
      });
      if (!ok) btn.classList.add('wrong');
      if (ok){
        S.learned++; S.todayLeft--; S.coin += 120; save(); syncHUD();
        sheetBody.insertAdjacentHTML('beforeend',
          `<button class="bigbtn" id="nextBtn">엽전 120냥 받고 이어하기</button>`);
      } else {
        sheetBody.insertAdjacentHTML('beforeend',
          `<button class="bigbtn" id="nextBtn">다시 익히기</button>`);
      }
      document.getElementById('nextBtn').addEventListener('click', renderSeodang);
    });
  });
}

/* ── 저잣거리 ───────────────────────────── */
function renderMarket(){
  const ids = Object.keys(ITEMS);
  sheetBody.innerHTML = `
    <div class="packhead">
      <div class="strip"><h2>매화 피는 서당 뒤뜰</h2></div>
      <div class="sub">봄 · 20종 중 ${ids.length}종 입고 · ${S.owned.length}종 보유</div>
    </div>
    <div class="grid">${ids.map(id => cellHTML(id)).join('')}</div>
    <p class="note">산 물건은 곧바로 정원에 놓입니다. 자리 옮기기는 다음 판에 붙일 예정입니다.</p>`;
  sheetBody.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('click', () => buy(c.dataset.id));
  });
}
function cellHTML(id){
  const it = ITEMS[id], has = S.owned.includes(id);
  const [w,h] = it.box, m = Math.max(w,h);
  return `<button class="cell ${has?'owned':''}" data-id="${id}">
    <span class="rar" style="background:${RAR_COLOR[it.rar]}">${it.rar}</span>
    <svg class="thumb" viewBox="${(w-m)/2} ${(h-m)/2} ${m} ${m}">${it.svg}</svg>
    <div class="cname">${it.name}</div>
    <div class="cost">${has ? '보유 중' : `<i style="background:${it.cur==='coin'?'#E8A33C':'#7FA9C9'}"></i>${it.amt}`}</div>
  </button>`;
}
function buy(id){
  const it = ITEMS[id];
  if (S.owned.includes(id)) return toast('이미 정원에 놓여 있습니다');
  const bag = it.cur === 'coin' ? S.coin : S.gem;
  if (bag < it.amt) return toast(it.cur==='coin' ? '엽전이 모자랍니다' : '잎새가 모자랍니다');
  if (it.cur === 'coin') S.coin -= it.amt; else S.gem -= it.amt;
  S.owned.push(id); save(); syncHUD(); renderMarket();
  toast(`${it.name}을(를) 정원에 놓았습니다`);
}

/* ── 보따리 ─────────────────────────────── */
function renderItems(){
  if (!S.owned.length){
    sheetBody.innerHTML = `<p class="note">아직 가진 물건이 없습니다. 저잣거리에서 하나 골라보세요.</p>`;
    return;
  }
  sheetBody.innerHTML = `<div class="grid">${S.owned.map(id => cellHTML(id)).join('')}</div>
    <p class="note">보유한 물건은 모두 정원에 놓여 있습니다.</p>`;
}

/* ── 공용 ───────────────────────────────── */
function syncHUD(){
  document.getElementById('coinTxt').textContent = S.coin.toLocaleString();
  document.getElementById('gemTxt').textContent = S.gem.toLocaleString();
  document.getElementById('rankTxt').textContent = `천자문 ${S.learned}자 익힘`;
  document.getElementById('progBar').style.width = Math.min(100, (S.learned/1000)*100*20) + '%';
  const dot = document.getElementById('navDot');
  dot.style.display = S.todayLeft > 0 ? 'block' : 'none';
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; } }

syncHUD();
drawGarden();
</script>
