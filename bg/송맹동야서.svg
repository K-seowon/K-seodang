<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720">
  <!-- 送孟東野序: 가을 저녁. 바람에 대숲이 울고 처마 끝 풍경이 흔들리며, 새가 날고,
       강 위로 동야를 태운 배가 남쪽(강남)으로 떠난다. 언덕에서 벗이 배웅한다 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3C98B"/>
      <stop offset=".5" stop-color="#F0D9AE"/>
      <stop offset="1" stop-color="#E6E1CC"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C9C4"/>
      <stop offset="1" stop-color="#7F9C99"/>
    </linearGradient>
  </defs>
  <rect width="800" height="720" fill="url(#sky)"/>
  <circle cx="560" cy="250" r="46" fill="#F7A65A" opacity=".85"/>
  <!-- 먼 산 -->
  <path d="M0 360 L80 300 L150 330 L240 270 L330 320 L420 285 L520 330 L610 290 L700 330 L800 300 L800 420 L0 420 Z" fill="#B9A58C" opacity=".75"/>
  <path d="M0 400 L110 350 L210 380 L320 345 L450 385 L560 352 L680 390 L800 360 L800 440 L0 440 Z" fill="#9C8C74" opacity=".85"/>
  <!-- 강 -->
  <path d="M0 440 L800 440 L800 600 C640 590 520 620 380 610 C240 600 120 630 0 620 Z" fill="url(#water)"/>
  <g stroke="#E9EFEA" stroke-width="2" opacity=".6" stroke-linecap="round">
    <path d="M60 480 h50"/><path d="M200 500 h70"/><path d="M420 470 h60"/><path d="M600 520 h80"/><path d="M300 555 h50"/><path d="M520 575 h60"/>
  </g>
  <!-- 떠나는 배(동야) -->
  <g transform="translate(520 505)">
    <path d="M-70 0 Q-30 22 10 22 Q45 22 80 -4 L62 12 Q30 18 10 18 Q-30 18 -58 6 Z" fill="#6B4A30"/>
    <path d="M-20 2 L-20 -38 L28 -38 L28 2 Z" fill="#D8C7A4" stroke="#6B4A30" stroke-width="2"/>
    <path d="M-26 -38 L4 -52 L34 -38 Z" fill="#8A6A48"/>
    <path d="M60 -6 L96 -60" stroke="#4A3424" stroke-width="3"/>
    <circle cx="44" cy="-14" r="6" fill="#E8C9A6"/>
    <path d="M37 -8 Q38 6 50 6 Q52 -6 50 -8 Z" fill="#5C6E7E"/>
  </g>
  <!-- 앞 언덕 -->
  <path d="M0 590 C120 570 220 600 330 600 C450 600 520 640 620 650 C700 658 760 650 800 640 L800 720 L0 720 Z" fill="#8C7A4E"/>
  <path d="M0 640 C140 620 260 650 400 660 C540 670 680 690 800 680 L800 720 L0 720 Z" fill="#6E6038"/>
  <!-- 배웅하는 한유 -->
  <g transform="translate(250 600)">
    <path d="M-16 6 Q-14 -34 0 -36 Q14 -34 16 6 Z" fill="#3E5A7A"/>
    <circle cx="0" cy="-45" r="9" fill="#E8C9A6"/>
    <path d="M-9 -51 L9 -51 L6 -61 L-6 -61 Z" fill="#2A2420"/>
    <path d="M12 -26 L30 -40" stroke="#3E5A7A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- 바람에 휘는 대숲 -->
  <g stroke-linecap="round" fill="none">
    <path d="M690 720 C690 600 700 520 735 430" stroke="#5E7A3E" stroke-width="7"/>
    <path d="M730 720 C730 610 745 520 790 440" stroke="#6E8C46" stroke-width="7"/>
    <path d="M760 720 C762 640 770 560 800 500" stroke="#5E7A3E" stroke-width="6"/>
    <path d="M660 720 C662 630 668 560 690 490" stroke="#6E8C46" stroke-width="6"/>
  </g>
  <g fill="#6E8C46">
    <path d="M735 430 q-40 -2 -60 14 q34 4 60 -14 Z"/><path d="M738 470 q-46 0 -66 18 q38 2 66 -18 Z"/>
    <path d="M790 440 q-42 -4 -62 10 q36 6 62 -10 Z"/><path d="M780 500 q-44 -2 -62 14 q36 4 62 -14 Z"/>
    <path d="M690 490 q-40 -2 -56 14 q32 4 56 -14 Z"/><path d="M700 540 q-44 -2 -60 16 q34 2 60 -16 Z"/>
    <path d="M760 560 q-42 0 -58 16 q32 2 58 -16 Z"/>
  </g>
  <!-- 바람 결 -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round">
    <path d="M480 400 c40 -20 80 -20 120 0 c20 10 40 6 50 -8"/>
    <path d="M430 430 c50 -14 90 -10 130 6"/>
    <path d="M560 360 c30 -14 60 -10 80 4 c14 10 30 6 36 -6"/>
  </g>
  <!-- 날아가는 새 -->
  <g stroke="#4A3A2E" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M360 230 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M410 200 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M330 270 q7 -7 14 0 q7 -7 14 0"/>
  </g>
  <!-- 처마와 풍경 -->
  <g>
    <path d="M0 120 L240 70 Q262 66 270 50 Q262 88 238 92 L0 150 Z" fill="#3A3028"/>
    <path d="M0 150 L238 92 L238 102 L0 162 Z" fill="#7A2E22"/>
    <g fill="#5A4A3C">
      <rect x="30" y="140" width="8" height="18"/><rect x="80" y="128" width="8" height="18"/><rect x="130" y="116" width="8" height="18"/><rect x="180" y="104" width="8" height="18"/>
    </g>
    <path d="M200 100 L203 168" stroke="#2A2420" stroke-width="2"/>
    <path d="M186 168 Q186 150 203 148 Q220 150 220 168 L224 192 L182 192 Z" fill="#6F7F6A" stroke="#2A2420" stroke-width="2"/>
    <path d="M203 192 L203 212" stroke="#2A2420" stroke-width="2"/>
    <path d="M192 212 L214 212 L210 236 L196 236 Z" fill="#C9A86A" stroke="#2A2420" stroke-width="2"/>
    <g stroke="#2A2420" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M232 170 q8 4 10 14"/><path d="M240 162 q12 6 14 22"/>
    </g>
  </g>
</svg>
